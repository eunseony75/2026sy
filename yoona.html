    const { useState, useEffect, useRef } = React;

    // 과학 개념 데이터
    const scienceData = [
      {
        term: "광합성 (Photosynthesis)",
        definition: "식물과 일부 다른 유기체가 빛 에너지를 화학 에너지로 변환하는 과정. 이 화학 에너지는 유기 화합물을 합성하는 데 사용됩니다."
      },
      {
        term: "세포 (Cell)",
        definition: "모든 알려진 생명체의 기본 구조, 기능 및 생물학적 단위. 세포는 생명의 최소 단위이며, 종종 '생명의 구성 블록'이라고 불립니다."
      },
      {
        term: "원자 (Atom)",
        definition: "일반적인 화학적 수단으로 더 이상 분할할 수 없는 물질의 가장 작은 단위입니다. 원자는 양성자, 중성자, 전자로 구성됩니다."
      },
      {
        term: "분자 (Molecule)",
        definition: "둘 이상의 원자가 화학 결합으로 함께 연결된 전기적으로 중성인 그룹입니다."
      },
      {
        term: "중력 (Gravity)",
        definition: "질량을 가진 물체들이 서로 끌어당기는 자연적인 현상입니다."
      },
      {
        term: "산성 (Acid)",
        definition: "수소 이온을 방출하거나 전자쌍을 받아들이는 화학 물질입니다. pH는 7보다 작습니다."
      },
      {
        term: "염기성 (Base)",
        definition: "수산화 이온을 방출하거나 수소 이온을 받아들이는 화학 물질입니다. pH는 7보다 큽니다."
      },
      {
        term: "용액 (Solution)",
        definition: "하나의 물질이 다른 물질에 균일하게 분산되어 있는 균일 혼합물입니다."
      },
      {
        term: "열에너지 (Thermal Energy)",
        definition: "물질을 구성하는 원자나 분자의 무작위 운동과 관련된 에너지입니다."
      },
      {
        term: "전류 (Electric Current)",
        definition: "전하의 흐름입니다."
      },
      {
        term: "운동 에너지 (Kinetic Energy)",
        definition: "움직이는 물체가 가지고 있는 에너지. 물체의 질량과 속도에 비례합니다."
      },
      {
        term: "위치 에너지 (Potential Energy)",
        definition: "물체가 위치나 상태 때문에 가지고 있는 에너지. 중력 위치 에너지와 탄성 위치 에너지 등이 있습니다."
      },
      {
        term: "화학 반응 (Chemical Reaction)",
        definition: "물질의 조성이 변하여 새로운 물질이 생성되는 과정."
      },
      {
        term: "물질의 상태 (States of Matter)",
        definition: "물질이 존재하는 형태. 고체, 액체, 기체, 플라즈마 등이 있습니다."
      },
      {
        term: "밀도 (Density)",
        definition: "물질의 질량을 부피로 나눈 값. 물질의 빽빽한 정도를 나타냅니다."
      },
      {
        term: "자기장 (Magnetic Field)",
        definition: "자석이나 전류 주변에 형성되어 자성 물질에 힘을 미치는 공간."
      },
      {
        term: "전자기 유도 (Electromagnetic Induction)",
        definition: "변화하는 자기장에 의해 전기가 발생하는 현상."
      },
      {
        term: "생태계 (Ecosystem)",
        definition: "생물 군집과 이들을 둘러싼 비생물적 환경이 상호작용하는 시스템."
      },
      {
        term: "유전 (Heredity)",
        definition: "부모의 형질이 자손에게 전달되는 현상."
      },
      {
        term: "진화 (Evolution)",
        definition: "생물 종이 여러 세대에 걸쳐 유전적 특성이 변화하는 과정."
      },
      {
        term: "지각 변동 (Crustal Movement)",
        definition: "지구 내부 에너지에 의해 지각이 움직이는 현상. 지진, 화산 활동, 습곡, 단층 등이 있습니다."
      },
      {
        term: "대기압 (Atmospheric Pressure)",
        definition: "대기의 무게로 인해 지표면에 가해지는 압력."
      },
      {
        term: "일기 변화 (Weather Change)",
        definition: "대기 상태의 변화로 인해 기온, 강수량, 바람 등이 변하는 현상."
      },
      {
        term: "파동 (Wave)",
        definition: "매질의 진동이 퍼져나가는 현상. 소리, 빛, 지진파 등이 있습니다."
      },
      {
        term: "굴절 (Refraction)",
        definition: "파동이 한 매질에서 다른 매질로 진행할 때 진행 방향이 꺾이는 현상."
      }
    ];

    // 메인 앱 컴포넌트
    const App = () => {
      const [currentSection, setCurrentSection] = useState('vocabulary'); // 'vocabulary', 'quiz', 'review'
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
      const [incorrectAnswers, setIncorrectAnswers] = useState([]);
      const [quizResult, setQuizResult] = useState(null); // 'correct', 'incorrect', null

      // 퀴즈 질문 생성
      const generateQuizQuestions = () => {
        const questions = scienceData.map(item => {
          const isCorrectDefinition = Math.random() < 0.5; // 50% 확률로 정답 정의
          let questionDefinition;
          let correctAnswer;

          if (isCorrectDefinition) {
            questionDefinition = item.definition;
            correctAnswer = true; // O가 정답
          } else {
            let wrongDefinitionItem;
            do {
              wrongDefinitionItem = scienceData[Math.floor(Math.random() * scienceData.length)];
            } while (wrongDefinitionItem.term === item.term);

            questionDefinition = wrongDefinitionItem.definition;
            correctAnswer = false; // X가 정답
          }

          return {
            term: item.term,
            questionDefinition: questionDefinition,
            correctAnswer: correctAnswer
          };
        }).sort(() => Math.random() - 0.5);

        setQuizQuestions(questions);
        setCurrentQuizIndex(0);
        setIncorrectAnswers([]);
        setQuizResult(null);
      };

      useEffect(() => {
        if (currentSection === 'quiz') {
          generateQuizQuestions();
        }
      }, [currentSection]);

      const handleAnswer = (userAnswer) => {
        const currentQuestion = quizQuestions[currentQuizIndex];
        const isCorrect = (userAnswer === 'O' && currentQuestion.correctAnswer) ||
                          (userAnswer === 'X' && !currentQuestion.correctAnswer);

        if (isCorrect) {
          setQuizResult('correct');
        } else {
          setQuizResult('incorrect');
          setIncorrectAnswers(prev => [...prev, currentQuestion]);
        }

        setTimeout(() => {
          setQuizResult(null);
          if (currentQuizIndex < quizQuestions.length - 1) {
            setCurrentQuizIndex(prev => prev + 1);
          } else {
            alert('퀴즈가 종료되었습니다. 오답 노트를 확인해 보세요!');
            setCurrentSection('review');
          }
        }, 1000);
      };

      const scienceProps = (
        <>
          <svg className="absolute top-5 left-5 w-12 h-12 text-blue-300 opacity-30 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1.51-1V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <svg className="absolute bottom-5 right-5 w-14 h-14 text-green-300 opacity-30 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M14.5 10c-.81 0-1.5-.45-1.87-1.12A2.96 2.96 0 0 0 9.25 6H7.5V3H4v3.5l-.5.5C2.65 8.15 2 9.57 2 11c0 2.15.65 3.57 1.5 4.5l.5.5V18h3.5v-3H9.25a2.96 2.96 0 0 0 3.38-2.88c.37-.67 1.06-1.12 1.87-1.12ZM22 13h-2.5v-3H19a2.5 2.5 0 0 0-5 0v3h-2.5l.5.5C9.65 14.15 9 15.57 9 17c0 2.15.65 3.57 1.5 4.5l.5.5H15v-3h3.5v-3H19a2.5 2.5 0 0 0 5 0v-3h-2.5Z"></path>
          </svg>
          <svg className="absolute top-20 right-10 w-10 h-10 text-pink-300 opacity-30 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2a5 5 0 0 0-5 5c0 5.5 7 15 7 15s7-9.5 7-15a5 5 0 0 0-5-5z"></path>
            <path d="M12 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
          </svg>
          <svg className="absolute bottom-10 left-10 w-10 h-10 text-yellow-300 opacity-30 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2v20"></path>
            <path d="M18 6h-6"></path>
            <path d="M18 10h-6"></path>
            <path d="M18 14h-6"></path>
            <path d="M18 18h-6"></path>
            <path d="M6 6h6"></path>
            <path d="M6 10h6"></path>
            <path d="M6 14h6"></path>
            <path d="M6 18h6"></path>
          </svg>
        </>
      );

      return (
        <div className="min-h-screen font-sans text-gray-800 relative overflow-hidden flex flex-col items-center justify-center p-4">
          {scienceProps}
          
          {/* 헤더 및 내비게이션 */}
          <header className="w-full max-w-2xl bg-white bg-opacity-80 backdrop-blur rounded-2xl shadow-lg p-6 mb-8 z-10">
            <h1 className="text-3xl font-extrabold text-center text-purple-700 mb-4">
              ✨ 중학교 & 고1 과학 마스터 ✨
            </h1>
            <nav className="flex justify-around space-x-4">
              <button
                onClick={() => setCurrentSection('vocabulary')}
                className={`py-3 px-6 rounded-full font-semibold transition-all duration-300 shadow-md ${
                  currentSection === 'vocabulary'
                    ? 'bg-purple-600 text-white transform scale-105'
                    : 'bg-gray-200 text-gray-700 hover:bg-purple-100'
                }`}
              >
                📚 단어 학습
              </button>
              <button
                onClick={() => setCurrentSection('quiz')}
                className={`py-3 px-6 rounded-full font-semibold transition-all duration-300 shadow-md ${
                  currentSection === 'quiz'
                    ? 'bg-purple-600 text-white transform scale-105'
                    : 'bg-gray-200 text-gray-700 hover:bg-purple-100'
                }`}
              >
                📝 O/X 퀴즈
              </button>
              <button
                onClick={() => setCurrentSection('review')}
                className={`py-3 px-6 rounded-full font-semibold transition-all duration-300 shadow-md ${
                  currentSection === 'review'
                    ? 'bg-purple-600 text-white transform scale-105'
                    : 'bg-gray-200 text-gray-700 hover:bg-purple-100'
                }`}
              >
                💡 오답 복습
              </button>
            </nav>
          </header>

          {/* 섹션 컨텐츠 */}
          <main className="w-full max-w-2xl bg-white bg-opacity-80 backdrop-blur rounded-2xl shadow-lg p-8 z-10 flex-grow">
            {currentSection === 'vocabulary' && <VocabularySection />}
            {currentSection === 'quiz' && (
              <QuizSection
                quizQuestions={quizQuestions}
                currentQuizIndex={currentQuizIndex}
                handleAnswer={handleAnswer}
                quizResult={quizResult}
              />
            )}
            {currentSection === 'review' && <ReviewSection incorrectAnswers={incorrectAnswers} />}
          </main>
        </div>
      );
    };

    // 단어 학습 섹션
    const VocabularySection = () => {
      return (
        <div className="animate-fade-in">
          <h2 className="text-2xl font-bold text-center text-purple-800 mb-6">개념 및 용어 학습</h2>
          <div className="space-y-6 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
            {scienceData.map((item, index) => (
              <div key={index} className="bg-purple-50 p-5 rounded-xl shadow-sm border border-purple-200">
                <h3 className="text-xl font-semibold text-purple-700 mb-2">{item.term}</h3>
                <p className="text-gray-700 leading-relaxed">{item.definition}</p>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // O/X 퀴즈 섹션
    const QuizSection = ({ quizQuestions, currentQuizIndex, handleAnswer, quizResult }) => {
      if (quizQuestions.length === 0) {
        return <p className="text-center text-lg text-gray-600">퀴즈를 준비 중입니다...</p>;
      }

      const currentQuestion = quizQuestions[currentQuizIndex];

      return (
        <div className="flex flex-col items-center justify-center h-full animate-fade-in">
          <h2 className="text-2xl font-bold text-purple-800 mb-6">O/X 퀴즈</h2>
          <p className="text-gray-600 text-lg mb-4">
            <span className="font-semibold text-purple-600">{currentQuizIndex + 1}</span> / {quizQuestions.length} 문제
          </p>
          <div className="bg-purple-50 p-6 rounded-xl shadow-lg border border-purple-200 w-full mb-6 text-center">
            <p className="text-xl font-semibold text-purple-700 mb-3">{currentQuestion.term}</p>
            <p className="text-lg text-gray-700 leading-relaxed">
              다음은 "<span className="font-bold">{currentQuestion.term}</span>"에 대한 설명입니다.
              <br />
              <span className="font-medium text-gray-800">"{currentQuestion.questionDefinition}"</span>
              <br />
              이 설명이 맞으면 'O', 틀리면 'X'를 선택하세요.
            </p>
          </div>

          <div className="flex space-x-6">
            <button
              onClick={() => handleAnswer('O')}
              className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-10 rounded-full text-2xl shadow-md transition-all duration-300 transform hover:scale-105 active:scale-95"
            >
              O
            </button>
            <button
              onClick={() => handleAnswer('X')}
              className="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-10 rounded-full text-2xl shadow-md transition-all duration-300 transform hover:scale-105 active:scale-95"
            >
              X
            </button>
          </div>

          {quizResult && (
            <div className={`mt-6 text-2xl font-bold ${quizResult === 'correct' ? 'text-green-600' : 'text-red-600'} animate-fade-in`}>
              {quizResult === 'correct' ? '정답입니다! 🎉' : '오답입니다! 😢'}
            </div>
          )}
        </div>
      );
    };

    // 오답 복습 슬라이드 섹션
    const ReviewSection = ({ incorrectAnswers }) => {
      const [currentReviewIndex, setCurrentReviewIndex] = useState(0);
      const slideRef = useRef(null);

      useEffect(() => {
        setCurrentReviewIndex(0);
      }, [incorrectAnswers]);

      const goToNext = () => {
        if (slideRef.current) {
          slideRef.current.classList.add('slide-out-left');
          setTimeout(() => {
            setCurrentReviewIndex((prev) => (prev + 1) % incorrectAnswers.length);
            slideRef.current.classList.remove('slide-out-left');
            slideRef.current.classList.add('slide-in-right');
          }, 300);
          setTimeout(() => {
            slideRef.current.classList.remove('slide-in-right');
          }, 600);
        }
      };

      const goToPrev = () => {
        if (slideRef.current) {
          slideRef.current.classList.add('slide-out-right');
          setTimeout(() => {
            setCurrentReviewIndex((prev) => (prev - 1 + incorrectAnswers.length) % incorrectAnswers.length);
            slideRef.current.classList.remove('slide-out-right');
            slideRef.current.classList.add('slide-in-left');
          }, 300);
          setTimeout(() => {
            slideRef.current.classList.remove('slide-in-left');
          }, 600);
        }
      };

      if (incorrectAnswers.length === 0) {
        return (
          <div className="text-center animate-fade-in">
            <h2 className="text-2xl font-bold text-purple-800 mb-6">오답 노트</h2>
            <p className="text-lg text-gray-600">아직 틀린 문제가 없습니다. 퀴즈를 풀어보세요! 😊</p>
          </div>
        );
      }

      const currentReview = incorrectAnswers[currentReviewIndex];

      return (
        <div className="flex flex-col items-center justify-center h-full animate-fade-in">
          <h2 className="text-2xl font-bold text-purple-800 mb-6">오답 노트</h2>
          <p className="text-gray-600 text-lg mb-4">
            <span className="font-semibold text-purple-600">{currentReviewIndex + 1}</span> / {incorrectAnswers.length} 오답
          </p>

          <div ref={slideRef} className="bg-red-50 p-6 rounded-xl shadow-lg border border-red-200 w-full mb-6 text-center transition-transform duration-300 ease-in-out">
            <h3 className="text-xl font-semibold text-red-700 mb-3">틀린 문제: {currentReview.term}</h3>
            <p className="text-lg text-gray-700 leading-relaxed mb-4">
              <span className="font-medium text-gray-800">질문 내용: "{currentReview.questionDefinition}"</span>
              <br />
              <span className="font-bold text-red-600">내 정답: {currentReview.correctAnswer ? 'X (원래 O가 정답인 문제)' : 'O (원래 X가 정답인 문제)'}</span>
            </p>
            <div className="bg-green-50 p-4 rounded-lg border border-green-200">
              <p className="text-md font-semibold text-green-700 mb-2">정확한 정의:</p>
              <p className="text-md text-gray-700 leading-relaxed">
                {scienceData.find(item => item.term === currentReview.term)?.definition || '정의를 찾을 수 없습니다.'}
              </p>
            </div>
          </div>

          <div className="flex space-x-4">
            <button
              onClick={goToPrev}
              className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-full shadow-md transition-all duration-300 transform hover:scale-105 active:scale-95"
            >
              이전 오답
            </button>
            <button
              onClick={goToNext}
              className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-full shadow-md transition-all duration-300 transform hover:scale-105 active:scale-95"
            >
              다음 오답
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
    </template>
    <template id="tmpl_game">

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const minimapCanvas = document.getElementById('minimapCanvas');
const miniCtx = minimapCanvas.getContext('2d');

const MAP_WIDTH = 2500;
const MAP_HEIGHT = 1600;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height
};

let currentChampionType = 'jax';
let gameState = 'SELECT'; // 'SELECT', 'PLAYING', 'GAMEOVER'

let player = {
    x: 300,
    y: MAP_HEIGHT / 2,
    radius: 24,
    color: '#3b82f6',
    maxHp: 600,
    hp: 600,
    maxMp: 300,
    mp: 300,
    speed: 4.5,
    ad: 60,
    level: 1,
    exp: 0,
    gold: 500,
    kills: 0,
    deaths: 0,
    assists: 0,
    cs: 0,
    targetX: 300,
    targetY: MAP_HEIGHT / 2,
    targetUnit: null,
    attackRange: 80,
    attackCooldown: 0,
    team: 'blue',
    skills: {
        q: { cd: 0, maxCd: 60, name: '도약 공격' },
        w: { cd: 0, maxCd: 45, name: '무기 강화' },
        e: { cd: 0, maxCd: 90, name: '반격' },
        r: { cd: 0, maxCd: 180, name: '달인의 전술' }
    },
    items: []
};

let enemyChampion = {
    x: MAP_WIDTH - 300,
    y: MAP_HEIGHT / 2,
    radius: 24,
    color: '#ef4444',
    maxHp: 650,
    hp: 650,
    speed: 4.2,
    ad: 65,
    level: 1,
    team: 'red',
    attackRange: 80,
    attackCooldown: 0,
    targetUnit: null,
    skills: {
        q: { cd: 0, maxCd: 70 },
        w: { cd: 0, maxCd: 50 },
        e: { cd: 0, maxCd: 100 },
        r: { cd: 0, maxCd: 200 }
    }
};

let minions = [];
let towers = [];
let nexuses = [];
let particles = [];
let damageTexts = [];

function initMap() {
    towers = [
        { id: 1, x: 700, y: MAP_HEIGHT / 2, team: 'blue', hp: 2000, maxHp: 2000, range: 250, ad: 80, cd: 0 },
        { id: 2, x: MAP_WIDTH - 700, y: MAP_HEIGHT / 2, team: 'red', hp: 2000, maxHp: 2000, range: 250, ad: 80, cd: 0 }
    ];

    nexuses = [
        { id: 1, x: 200, y: MAP_HEIGHT / 2, team: 'blue', hp: 3500, maxHp: 3500 },
        { id: 2, x: MAP_WIDTH - 200, y: MAP_HEIGHT / 2, team: 'red', hp: 3500, maxHp: 3500 }
    ];
}
initMap();

function selectChampion(type) {
    currentChampionType = type;
    if (type === 'jax') {
        player.color = '#3b82f6';
        player.skills.q.name = '도약 공격';
        player.skills.w.name = '무기 강화';
        player.skills.e.name = '반격';
        player.skills.r.name = '달인의 전술';
        document.getElementById('champ-title-display').innerText = 'JAX - 무기 마스터';
    } else {
        player.color = '#dc2626';
        player.skills.q.name = '학살';
        player.skills.w.name = '마비의 타격';
        player.skills.e.name = '포획';
        player.skills.r.name = '녹서스의 단두대';
        document.getElementById('champ-title-display').innerText = 'DARIUS - 녹서스의 실세';
    }

    document.getElementById('skill-q-name').innerText = player.skills.q.name;
    document.getElementById('skill-w-name').innerText = player.skills.w.name;
    document.getElementById('skill-e-name').innerText = player.skills.e.name;
    document.getElementById('skill-r-name').innerText = player.skills.r.name;

    document.getElementById('char-select-modal').classList.add('hidden');
    gameState = 'PLAYING';
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left + camera.x;
    const mouseY = e.clientY - rect.top + camera.y;

    if (e.button === 2) {
        let clickedTarget = null;
        const allEnemies = [enemyChampion, ...minions.filter(m => m.team !== player.team), ...towers.filter(t => t.team !== player.team), ...nexuses.filter(n => n.team !== player.team)];

        for (let target of allEnemies) {
            const dist = Math.hypot(target.x - mouseX, target.y - mouseY);
            if (dist < (target.radius || 30)) {
                clickedTarget = target;
                break;
            }
        }

        if (clickedTarget) {
            player.targetUnit = clickedTarget;
        } else {
            player.targetUnit = null;
            player.targetX = mouseX;
            player.targetY = mouseY;
            createClickEffect(mouseX, mouseY);
        }
    }
});

window.addEventListener('keydown', e => {
    if (gameState !== 'PLAYING') return;
    if (e.key === 'p' || e.key === 'P') toggleShop();
    if (e.key === 'q' || e.key === 'Q') castSkill('q');
    if (e.key === 'w' || e.key === 'W') castSkill('w');
    if (e.key === 'e' || e.key === 'E') castSkill('e');
    if (e.key === 'r' || e.key === 'R') castSkill('r');
});

function castSkill(skillKey) {
    const s = player.skills[skillKey];
    if (s.cd > 0) return;

    s.cd = s.maxCd;
    if (currentChampionType === 'jax') {
        if (skillKey === 'q' && player.targetUnit) {
            player.x = player.targetUnit.x - 30;
            player.y = player.targetUnit.y;
            dealDamage(player, player.targetUnit, player.ad * 1.5);
        } else if (skillKey === 'w') {
            player.ad += 20;
            setTimeout(() => player.ad -= 20, 5000);
        } else if (skillKey === 'e') {
            createExplosion(player.x, player.y, '#38bdf8', 30);
            minions.concat(enemyChampion).forEach(target => {
                if (target.team !== player.team && Math.hypot(target.x - player.x, target.y - player.y) < 150) {
                    dealDamage(player, target, 80);
                }
            });
        } else if (skillKey === 'r') {
            player.maxHp += 200;
            player.hp += 200;
        }
    } else {
        if (skillKey === 'q') {
            createExplosion(player.x, player.y, '#ef4444', 40);
            minions.concat(enemyChampion).forEach(target => {
                if (target.team !== player.team && Math.hypot(target.x - player.x, target.y - player.y) < 160) {
                    dealDamage(player, target, player.ad * 1.4);
                    player.hp = Math.min(player.maxHp, player.hp + 50);
                }
            });
        } else if (skillKey === 'w') {
            if (player.targetUnit) dealDamage(player, player.targetUnit, player.ad * 1.6);
        } else if (skillKey === 'e') {
            if (enemyChampion && Math.hypot(enemyChampion.x - player.x, enemyChampion.y - player.y) < 220) {
                enemyChampion.x = player.x + 40;
                enemyChampion.y = player.y;
            }
        } else if (skillKey === 'r') {
            if (player.targetUnit) dealDamage(player, player.targetUnit, 300);
        }
    }
}

function dealDamage(attacker, defender, amount) {
    defender.hp -= amount;
    damageTexts.push({
        x: defender.x,
        y: defender.y - 20,
        text: Math.round(amount),
        color: attacker.team === 'blue' ? '#38bdf8' : '#f87171',
        life: 30
    });

    if (defender.hp <= 0) {
        if (defender === enemyChampion) {
            player.kills++;
            player.gold += 300;
            enemyChampion.x = MAP_WIDTH - 200;
            enemyChampion.hp = enemyChampion.maxHp;
        } else if (defender.team === 'red' && defender !== enemyChampion) {
            player.cs++;
            player.gold += 20;
        }
    }
}

let spawnTimer = 0;
function spawnMinions() {
    spawnTimer++;
    if (spawnTimer >= 300) {
        spawnTimer = 0;
        for (let i = 0; i < 3; i++) {
            minions.push({
                x: 250 - i * 30,
                y: MAP_HEIGHT / 2 + (i - 1) * 20,
                team: 'blue',
                hp: 150,
                maxHp: 150,
                ad: 15,
                radius: 12,
                speed: 2,
                range: 40,
                cd: 0
            });
            minions.push({
                x: MAP_WIDTH - 250 + i * 30,
                y: MAP_HEIGHT / 2 + (i - 1) * 20,
                team: 'red',
                hp: 150,
                maxHp: 150,
                ad: 15,
                radius: 12,
                speed: 2,
                range: 40,
                cd: 0
            });
        }
    }
}

function createClickEffect(x, y) {
    particles.push({ x, y, radius: 10, maxRadius: 25, color: '#38bdf8', alpha: 1 });
}

function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 4 + 2,
            color,
            alpha: 1
        });
    }
}

function toggleShop() {
    const modal = document.getElementById('shop-modal');
    modal.classList.toggle('hidden');
}

function buyItem(itemKey) {
    if (itemKey === 'doran' && player.gold >= 450) {
        player.gold -= 450;
        player.ad += 10;
        player.maxHp += 80;
        player.hp += 80;
    } else if (itemKey === 'trinity' && player.gold >= 3333) {
        player.gold -= 3333;
        player.ad += 35;
        player.maxHp += 300;
        player.hp += 300;
    } else if (itemKey === 'sterak' && player.gold >= 3100) {
        player.gold -= 3100;
        player.maxHp += 400;
        player.hp += 400;
    } else if (itemKey === 'warmog' && player.gold >= 3000) {
        player.gold -= 3000;
        player.maxHp += 800;
        player.hp += 800;
    }
}

function update() {
    if (gameState !== 'PLAYING') return;

    spawnMinions();

    if (player.targetUnit) {
        const dist = Math.hypot(player.targetUnit.x - player.x, player.targetUnit.y - player.y);
        if (dist > player.attackRange) {
            const angle = Math.atan2(player.targetUnit.y - player.y, player.targetUnit.x - player.x);
            player.x += Math.cos(angle) * player.speed;
            player.y += Math.sin(angle) * player.speed;
        } else {
            if (player.attackCooldown <= 0) {
                dealDamage(player, player.targetUnit, player.ad);
                player.attackCooldown = 40;
            }
        }
        if (player.targetUnit.hp <= 0) player.targetUnit = null;
    } else {
        const dist = Math.hypot(player.targetX - player.x, player.targetY - player.y);
        if (dist > player.speed) {
            const angle = Math.atan2(player.targetY - player.y, player.targetX - player.x);
            player.x += Math.cos(angle) * player.speed;
            player.y += Math.sin(angle) * player.speed;
        }
    }

    if (player.attackCooldown > 0) player.attackCooldown--;

    ['q', 'w', 'e', 'r'].forEach(k => {
        if (player.skills[k].cd > 0) {
            player.skills[k].cd--;
            document.getElementById(`skill-${k}-cd-overlay`).classList.remove('hidden');
            document.getElementById(`skill-${k}-cd-overlay`).innerText = Math.ceil(player.skills[k].cd / 60);
        } else {
            document.getElementById(`skill-${k}-cd-overlay`).classList.add('hidden');
        }
    });

    const enemyDist = Math.hypot(player.x - enemyChampion.x, player.y - enemyChampion.y);
    if (enemyDist < 400) {
        if (enemyDist > enemyChampion.attackRange) {
            const angle = Math.atan2(player.y - enemyChampion.y, player.x - enemyChampion.x);
            enemyChampion.x += Math.cos(angle) * enemyChampion.speed;
            enemyChampion.y += Math.sin(angle) * enemyChampion.speed;
        } else {
            if (enemyChampion.attackCooldown <= 0) {
                dealDamage(enemyChampion, player, enemyChampion.ad);
                enemyChampion.attackCooldown = 45;
            }
        }
    }
    if (enemyChampion.attackCooldown > 0) enemyChampion.attackCooldown--;

    minions.forEach(m => {
        const enemyMinions = minions.filter(other => other.team !== m.team);
        let closest = null;
        let minDist = Infinity;

        enemyMinions.forEach(other => {
            const d = Math.hypot(other.x - m.x, other.y - m.y);
            if (d < minDist) {
                minDist = d;
                closest = other;
            }
        });

        if (closest && minDist < 200) {
            if (minDist > m.range) {
                const angle = Math.atan2(closest.y - m.y, closest.x - m.x);
                m.x += Math.cos(angle) * m.speed;
                m.y += Math.sin(angle) * m.speed;
            } else if (m.cd <= 0) {
                dealDamage(m, closest, m.ad);
                m.cd = 60;
            }
        } else {
            m.x += (m.team === 'blue' ? 1 : -1) * m.speed;
        }
        if (m.cd > 0) m.cd--;
    });

    minions = minions.filter(m => m.hp > 0);

    towers.forEach(t => {
        const enemies = [player, enemyChampion, ...minions].filter(u => u.team !== t.team && Math.hypot(u.x - t.x, u.y - t.y) < t.range);
        if (enemies.length > 0 && t.cd <= 0) {
            dealDamage(t, enemies[0], t.ad);
            t.cd = 60;
        }
        if (t.cd > 0) t.cd--;
    });

    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
    camera.x = Math.max(0, Math.min(camera.x, MAP_WIDTH - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, MAP_HEIGHT - canvas.height));

    document.getElementById('kda-display').innerText = `${player.kills} / ${player.deaths} / ${player.assists}`;
    document.getElementById('gold-display').innerText = `${player.gold} G`;
    document.getElementById('cs-display').innerText = `${player.cs}`;
    document.getElementById('player-hp-text').innerText = `${Math.max(0, Math.round(player.hp))} / ${player.maxHp}`;
    document.getElementById('player-hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;

    if (nexuses[1].hp <= 0) showGameOver(true);
    if (nexuses[0].hp <= 0 || player.hp <= 0) showGameOver(false);
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    for (let x = 0; x < MAP_WIDTH; x += 100) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_HEIGHT);
        ctx.stroke();
    }
    for (let y = 0; y < MAP_HEIGHT; y += 100) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_WIDTH, y);
        ctx.stroke();
    }

    towers.forEach(t => {
        ctx.fillStyle = t.team === 'blue' ? '#3b82f6' : '#ef4444';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
    });

    nexuses.forEach(n => {
        ctx.fillStyle = n.team === 'blue' ? '#1d4ed8' : '#b91c1c';
        ctx.fillRect(n.x - 50, n.y - 50, 100, 100);
    });

    minions.forEach(m => {
        ctx.fillStyle = m.team === 'blue' ? '#60a5fa' : '#f87171';
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = enemyChampion.color;
    ctx.beginPath();
    ctx.arc(enemyChampion.x, enemyChampion.y, enemyChampion.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 3;
    ctx.stroke();

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    damageTexts.forEach((d, i) => {
        ctx.fillStyle = d.color;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(d.text, d.x, d.y);
        d.y -= 1;
        d.life--;
        if (d.life <= 0) damageTexts.splice(i, 1);
    });

    ctx.restore();

    renderMinimap();
}

function renderMinimap() {
    miniCtx.fillStyle = '#0f172a';
    miniCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    const scaleX = minimapCanvas.width / MAP_WIDTH;
    const scaleY = minimapCanvas.height / MAP_HEIGHT;

    miniCtx.fillStyle = '#3b82f6';
    miniCtx.beginPath();
    miniCtx.arc(player.x * scaleX, player.y * scaleY, 4, 0, Math.PI * 2);
    miniCtx.fill();

    miniCtx.fillStyle = '#ef4444';
    miniCtx.beginPath();
    miniCtx.arc(enemyChampion.x * scaleX, enemyChampion.y * scaleY, 4, 0, Math.PI * 2);
    miniCtx.fill();

    minions.forEach(m => {
        miniCtx.fillStyle = m.team === 'blue' ? '#93c5fd' : '#fca5a5';
        miniCtx.fillRect(m.x * scaleX - 1, m.y * scaleY - 1, 2, 2);
    });

    towers.forEach(t => {
        miniCtx.fillStyle = t.team === 'blue' ? '#3b82f6' : '#ef4444';
        miniCtx.fillRect(t.x * scaleX - 2, t.y * scaleY - 2, 4, 4);
    });

    nexuses.forEach(n => {
        miniCtx.fillStyle = n.team === 'blue' ? '#2563eb' : '#dc2626';
        miniCtx.fillRect(n.x * scaleX - 3, n.y * scaleY - 3, 6, 6);
    });
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function showGameOver(victory) {
    const modal = document.getElementById('game-over-modal');
    const title = document.getElementById('game-result-title');
    const desc = document.getElementById('game-result-desc');
    
    modal.classList.remove('hidden');
    if (victory) {
        title.innerText = "승리!";
        title.className = "text-4xl font-black mb-4 text-amber-400";
        desc.innerText = "적 넥서스를 파괴하고 소환사의 계곡을 지배했습니다!";
    } else {
        title.innerText = "패배...";
        title.className = "text-4xl font-black mb-4 text-red-500";
        desc.innerText = "아군 넥서스가 파괴되었습니다.";
    }
}

function restartGame() {
    location.reload();
}

window.onload = function() {
    gameLoop();
};
</script>

                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 파일 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

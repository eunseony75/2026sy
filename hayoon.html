            --p-game-bg: #ECFDF5; --p-game-border: #D1FAE5; --p-game-text: #059669; --p-game-accent: #34D399;
            --p-video-bg: #F0F9FF; --p-video-border: #E0F2FE; --p-video-text: #0284C7; --p-video-accent: #38BDF8;

        .preview-controls-overlay { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 15; }

        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border-subtle); background: #F8FAFC; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }

        .tab-btn { padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.86rem; font-weight: 700; border: 1px solid var(--border-subtle); background: #FFF; color: var(--text-secondary); cursor: pointer; transition: var(--transition-smooth); }
        .tab-btn.active { background: var(--p-quiz-bg); color: var(--p-quiz-text); border-color: var(--p-quiz-border); box-shadow: var(--shadow-sm); }
        .drop-zone { border: 2px dashed var(--p-quiz-border); background: #F8FAFC; border-radius: var(--radius-md); padding: 30px 20px; text-align: center; cursor: pointer; transition: var(--transition-smooth); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .drop-zone:hover { background: #F5F3FF; border-color: var(--p-quiz-accent); }

        .toast-box { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #FFF; padding: 12px 20px; border-radius: var(--radius-full); font-size: 0.88rem; font-weight: 600; display: none; z-index: 12000; box-shadow: var(--shadow-lg); }
        .toast-box.active { display: flex; align-items: center; gap: 8px; }
    </style>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>파스텔 테트리스</title>
    <style>
        /* 기본 스타일 및 배경 */
        body {
            background-color: #FAF6F0; /* 따뜻한 크림톤 */
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            color: #6C5B7B;
            margin: 5px 0;
            font-size: 1.8rem;
        }

        /* 게임 컨테이너 */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #FFFFFF;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(142, 154, 175, 0.15);
        }

        /* 스코어보드 */
        .score-board {
            font-size: 1.2rem;
            color: #C06C84;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 캔버스 (게임판) */
        canvas {
            border: 4px solid #F8B195;
            border-radius: 10px;
            background-color: #FFFDF9;
        }

        /* 태블릿/모바일 터치 컨트롤러 */
        .touch-controller {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 240px;
            margin-top: 15px;
        }

        .btn {
            background-color: #F8B195;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 0 #E59A7D;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* 버튼 배치 조정 */
        .btn-left { grid-column: 1; }
        .btn-rotate { grid-column: 2; }
        .btn-right { grid-column: 3; }
        .btn-down { grid-column: 2; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Pastel Tetris</h1>
        <div class="score-board">SCORE: <span id="score">0</span></div>
        <canvas id="tetris" width="240" height="480"></canvas>
        
        <div class="touch-controller">
            <button class="btn btn-left" id="leftBtn">◀</button>
            <button class="btn btn-rotate" id="rotateBtn">↻</button>
            <button class="btn btn-right" id="rightBtn">▶</button>
            <button class="btn btn-down" id="downBtn">▼</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const scoreElement = document.getElementById('score');

// 블록 크기 및 그리드 설정 (10x20)
const ROW = 20;
const COL = 10;
const SQ = 24; 
context.scale(1, 1);

// 아기자기한 파스텔톤 블록 색상 세트
const COLORS = [
    null,
    '#FFB7B2', // Pastel Pink (I)
    '#FFDAC1', // Pastel Orange (O)
    '#E2F0CB', // Pastel Green (T)
    '#B5EAD7', // Pastel Mint (S)
    '#C7CEEA', // Pastel Purple (Z)
    '#FF9AA2', // Pastel Rose (J)
    '#E8C48E'  // Pastel Yellow (L)
];

// 테트리스 블록(미노) 형태 정의
const SHAPES = [
    [],
    [[1,1,1,1]],
    [[2,2],[2,2]],
    [[0,3,0],[3,3,3]],
    [[0,4,4],[4,4,0]],
    [[5,5,0],[0,5,5]],
    [[6,0,0],[6,6,6]],
    [[0,0,7],[7,7,7]]
];

// 게임판 초기화
let board = [];
for(let r = 0; r < ROW; r++){
    board[r] = [];
    for(let c = 0; c < COL; c++){
        board[r][c] = 0;
    }
}

// 블록 객체 생성자
function Piece(shape, colorIndex) {
    this.shape = shape;
    this.colorIndex = colorIndex;
    this.x = 3;
    this.y = -2;
}

// 화면에 사각형 그리기 (둥근 모서리 느낌 효과 포함)
function drawSquare(x, y, colorIndex) {
    context.fillStyle = COLORS[colorIndex];
    context.fillRect(x * SQ, y * SQ, SQ, SQ);
    
    // 파스텔톤 감성을 살리기 위한 은은한 테두리
    context.strokeStyle = '#FFFFFF';
    context.lineWidth = 1.5;
    context.strokeRect(x * SQ, y * SQ, SQ, SQ);
}

// 게임판 그리기
function drawBoard() {
    context.clearRect(0, 0, canvas.width, canvas.height);
    for(let r = 0; r < ROW; r++){
        for(let c = 0; c < COL; c++){
            if(board[r][c]) {
                drawSquare(c, r, board[r][c]);
            }
        }
    }
}

// 움직이는 블록 그리기
Piece.prototype.draw = function() {
    for(let r = 0; r < this.shape.length; r++){
        for(let c = 0; c < this.shape[r].length; c++){
            if(this.shape[r][c]){
                if(this.y + r >= 0) {
                    drawSquare(this.x + c, this.y + r, this.colorIndex);
                }
            }
        }
    }
}

// 충돌 감지 함수
Piece.prototype.collision = function(x, y, piece) {
    for(let r = 0; r < piece.length; r++){
        for(let c = 0; c < piece[r].length; c++){
            if(!piece[r][c]){
                continue;
            }
            let newX = this.x + c + x;
            let newY = this.y + r + y;
            
            if(newX < 0 || newX >= COL || newY >= ROW){
                return true;
            }
            if(newY < 0){
                continue;
            }
            if(board[newY][newX]){
                return true;
            }
        }
    }
    return false;
}

// 조작 메서드들
Piece.prototype.moveLeft = function() {
    if(!this.collision(-1, 0, this.shape)){
        this.x--;
    }
}

Piece.prototype.moveRight = function() {
    if(!this.collision(1, 0, this.shape)){
        this.x++;
    }
}

Piece.prototype.rotate = function() {
    let nextPattern = [];
    for(let c = 0; c < this.shape[0].length; c++) {
        let row = [];
        for(let r = this.shape.length - 1; r >= 0; r--) {
            row.push(this.shape[r][c]);
        }
        nextPattern.push(row);
    }
    
    if(!this.collision(0, 0, nextPattern)){
        this.shape = nextPattern;
    }
}

let score = 0;
Piece.prototype.moveDown = function() {
    if(!this.collision(0, 1, this.shape)){
        this.y++;
    } else {
        // 바닥이나 다른 블록에 고정됨
        this.lock();
        generateNextPiece();
    }
}

// 블록 고정 및 줄 삭제
Piece.prototype.lock = function() {
    for(let r = 0; r < this.shape.length; r++){
        for(let c = 0; c < this.shape[r].length; c++){
            if(!this.shape[r][c]){
                continue;
            }
            if(this.y + r < 0){
                alert("Game Over! 다시 시작합니다.");
                resetGame();
                return;
            }
            board[this.y + r][this.x + c] = this.colorIndex;
        }
    }
    
    // 꽉 찬 줄 제거
    for(let r = 0; r < ROW; r++){
        let isRowFull = true;
        for(let c = 0; c < COL; c++){
            if(board[r][c] == 0){
                isRowFull = false;
                break;
            }
        }
        if(isRowFull){
            for(let y = r; y > 1; y--){
                board[y] = [...board[y-1]];
            }
            board[0] = Array(COL).fill(0);
            score += 10;
            scoreElement.innerText = score;
        }
    }
}

// 새로운 블록 생성
function randomPiece() {
    let r = Math.floor(Math.random() * (SHAPES.length - 1)) + 1;
    return new Piece(SHAPES[r], r);
}

let p = randomPiece();
function generateNextPiece() {
    p = randomPiece();
}

// 게임 리셋
function resetGame() {
    board = board.map(row => row.fill(0));
    score = 0;
    scoreElement.innerText = score;
    p = randomPiece();
}

// 매 프레임 업데이트 (하강 속도 조정)
let dropStart = Date.now();
function update() {
    let now = Date.now();
    let delta = now - dropStart;
    if(delta > 1000){ // 1초마다 한 칸씩 다운
        p.moveDown();
        dropStart = Date.now();
    }
    drawBoard();
    p.draw();
    requestAnimationFrame(update);
}

// 키보드 조작 (PC 테스트용)
document.addEventListener("keydown", event => {
    if(event.keyCode == 37) p.moveLeft();
    else if(event.keyCode == 38) p.rotate();
    else if(event.keyCode == 39) p.moveRight();
    else if(event.keyCode == 40) p.moveDown();
});

// 태블릿/모바일 터치 버튼 이벤트 바인딩
document.getElementById('leftBtn').addEventListener('pointerdown', () => p.moveLeft());
document.getElementById('rightBtn').addEventListener('pointerdown', () => p.moveRight());
document.getElementById('rotateBtn').addEventListener('pointerdown', () => p.rotate());
document.getElementById('downBtn').addEventListener('pointerdown', () => p.moveDown());

// 게임 시작
update();
</script>
</body>
</html>

        lucide.createIcons();

        // Initialize Dots Indicator
        const bulletContainer = document.getElementById('bullet-indicators');
        for (let i = 1; i <= totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${i === 1 ? 'bg-orange-500 w-5' : 'bg-slate-700'}`;
            dot.id = `bullet-dot-${i}`;
            bulletContainer.appendChild(dot);
        }

        // Functions to Update Navigation & Progress
        function updateSlideUI() {
            // Hide all slides
            for (let i = 1; i <= totalSlides; i++) {
                const s = document.getElementById(`slide-${i}`);
                s.classList.add('hidden', 'opacity-0', 'scale-95');
                s.classList.remove('opacity-100', 'scale-100');
            }

            // Show current active slide
            const activeSlide = document.getElementById(`slide-${currentSlide}`);
            activeSlide.classList.remove('hidden');
            setTimeout(() => {
                activeSlide.classList.add('opacity-100', 'scale-100');
                activeSlide.classList.remove('opacity-0', 'scale-95');
            }, 50);

            // Update Counter
            document.getElementById('slide-counter').textContent = `Slide ${currentSlide} / ${totalSlides}`;

            // Update Progress Bar Percentage
            const percent = (currentSlide / totalSlides) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            // Update Dots indicator
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.getElementById(`bullet-dot-${i}`);
                if (i === currentSlide) {
                    dot.className = 'w-5 h-2 rounded-full bg-orange-500 transition-all duration-300';
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-slate-700 transition-all duration-300';
                }
            }
        }

        // Core Next/Prev Slide Control
        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateSlideUI();
            } else {
                // Loop back to start
                currentSlide = 1;
                updateSlideUI();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                updateSlideUI();
            } else {
                // Loop back to end
                currentSlide = totalSlides;
                updateSlideUI();
            }
        }

        // Keyboard Arrow Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {

            } else if (e.key === 'ArrowLeft') {
                prevSlide();

            swipeStartX = e.changedTouches[0].screenX;

            swipeEndX = e.changedTouches[0].screenX;

            const todayStr = `${year}-${month}-${day}`;
            dateInput.value = todayStr;

            // 규칙 4: 처음 페이지 열렸을 때 자동으로 오늘 날짜 급식 즉시 요청
            fetchLunchData(todayStr);
        });

        // 조회 버튼 클릭했을 때 동작
        searchBtn.addEventListener('click', () => {
            fetchLunchData(dateInput.value);
        });

        // 사용자가 달력 날짜를 수동으로 바꿨을 때도 자동으로 조회
        dateInput.addEventListener('change', () => {
            fetchLunchData(dateInput.value);
        });

        // API 비동기 통신 및 데이터 렌더링 함수
        function fetchLunchData(dateString) {
            if (!dateString) {
                alert("날짜를 정확히 선택해 주세요!");
                return;
            }

            // 새로운 데이터를 조회하기 위해 기존 뷰 상태 초기화
            statusMessage.classList.remove('hidden');
            lunchContent.classList.add('hidden');
            errorContent.classList.add('hidden');
            statusMessage.textContent = "급식 정보를 불러오고 있어요... 🥣";

            // 규칙 2: 하이픈(-)을 제거하고 8자리 'YYYYMMDD' 형식으로 변환
            const formattedDate = dateString.replace(/-/g, '');

            // API 최종 주소 조립
            const params = new URLSearchParams({
Type: "json",
                pIndex: "1",
                pSize: "10",
                ATPT_OFCDC_SC_CODE: EDUCATION_OFFICE_CODE,
                SD_SCHUL_CODE: SCHOOL_CODE,
                MLSV_YMD: formattedDate
            });
            const requestUrl = `${API_URL}?${params.toString()}`;

            // API 호출 실행
            fetch(requestUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("네트워크 응답 및 서버 상에 문제가 발생했습니다.");
                    }
                    return response.json();
                })
                .then(data => {
                    // 성공/실패 여부를 판단하므로 로딩 텍스트는 숨김
                    statusMessage.classList.add('hidden');

                    const mealRows = data.mealServiceDietInfo?.[1]?.row;

                    if (Array.isArray(mealRows) && mealRows.length > 0) {
                        const meal = mealRows.find(item => String(item.MMEAL_SC_CODE) === "2") || mealRows[0];
                        const cleanMenu = (meal.DDISH_NM || "")
                            .replace(/<br\s*\/?\s*>/gi, "\n")
                            .replace(/&amp;/g, "&")
                            .replace(/&lt;/g, "<")
                            .replace(/&gt;/g, ">");
                        // 규칙 3 - 성공 케이스 매핑
                        menuList.textContent = cleanMenu;
                        caloriesInfo.textContent = meal.CAL_INFO || "0 Kcal";
                        
                        lunchContent.classList.remove('hidden');
                    } else {
                        // 규칙 3 - 실패 케이스 매핑 (주말, 공휴일, 에러 등)
                        errorMessage.textContent = data.RESULT?.MESSAGE || "오늘은 급식이 없습니다.";
                        errorContent.classList.remove('hidden');
                    }
                })
                .catch(error => {
                    // 주소 오류, 연결 차단, 서버 전원 오프 등의 예외 예방 처리
                    statusMessage.classList.add('hidden');
                    errorMessage.textContent = "급식 정보를 불러오지 못했습니다. 잠시 후 다시 조회해 주세요.";
                    errorContent.classList.remove('hidden');
                    console.error("Fetch Error:", error);
                });
        }
    </script>
</body>
</html>
    </template>
    <script>
        const STUDENT_INFO = { id: 's_3_3_hayoon', name: '인하윤', grade: 3, classNum: 3 };
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let carouselIndexes = {};
        let multiFilePayloads = [];
        let currentFullscreenItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFullscreen(); closeModal(); } });
            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenItem) return;
                const newWin = window.open('', '_blank');
                if (currentFullscreenItem.type === 'image') {
                    newWin.document.write('<img src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;">');
                } else if (currentFullscreenItem.type === 'video') {
                    newWin.document.write('<video controls autoplay src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;"></video>');
                } else {
                    newWin.document.write(currentFullscreenItem.data);
                }
                newWin.document.close();
            });
        });

        function switchUploadTab(tab) {
            if (tab === 'file') {
                document.getElementById('tabBtnFile').classList.add('active');
                document.getElementById('tabBtnCode').classList.remove('active');
                document.getElementById('tabContentFile').style.display = 'block';
                document.getElementById('tabContentCode').style.display = 'none';
            } else {
                document.getElementById('tabBtnCode').classList.add('active');
                document.getElementById('tabBtnFile').classList.remove('active');
                document.getElementById('tabContentCode').style.display = 'block';
                document.getElementById('tabContentFile').style.display = 'none';
            }
        }

        function handleMultipleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const listContainer = document.getElementById('fileListPreview');
            listContainer.innerHTML = '';
            multiFilePayloads = [];
            files.forEach((file) => {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let fType = 'html';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov'].includes(ext)) fType = 'video';
                else if (['pdf'].includes(ext)) fType = 'pdf';
                else if (['ppt', 'pptx'].includes(ext)) fType = 'pptx';

                reader.onload = (re) => {
                    multiFilePayloads.push({ name: file.name, type: fType, data: re.target.result });
                    const tag = document.createElement('div');
                    tag.className = 'file-item-tag';
                    tag.innerHTML = `<span><i class="fa-solid fa-check-circle"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB)</span> <span style="font-size:0.75rem;">${fType.toUpperCase()}</span>`;
                    listContainer.appendChild(tag);
                };
                if (fType === 'image' || fType === 'video' || fType === 'pdf') {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function loadStudentProjects() {
            studentProjectsMap = {};

            const el_tmpl_game = document.getElementById('tmpl_game');
            if (el_tmpl_game) {
                studentProjectsMap['game'] = {
                    title: "파스텔 테트리스",
                    items: [{ name: "파스텔 테트리스", type: 'html', data: el_tmpl_game.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const el_tmpl_quiz = document.getElementById('tmpl_quiz');
            if (el_tmpl_quiz) {
                studentProjectsMap['quiz'] = {
                    title: "보이지 않는 가짜: AI 이미지와 사회적 위협",
                    items: [{ name: "보이지 않는 가짜: AI 이미지와 사회적 위협", type: 'html', data: el_tmpl_quiz.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const el_tmpl_meal_app = document.getElementById('tmpl_meal_app');
            if (el_tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "숭의여자중학교 오늘의 급식",
                    items: [{ name: "숭의여자중학교 오늘의 급식", type: 'html', data: el_tmpl_meal_app.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 파일 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>

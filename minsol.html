        * { margin: 0; padding: 0; box-sizing: border-box; }

        .slot-title { font-size: 1.08rem; font-weight: 700; color: var(--text-primary); margin-top: 4px; line-height: 1.35; }
        .slot-preview-box { width: 100%; height: 320px; background: #FAFAFC; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .slot-iframe { width: 100%; height: 100%; border: none; background: #FFFFFF; }
        .carousel-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--text-primary); z-index: 10; cursor: pointer; transition: var(--transition-smooth); }
        .carousel-nav-btn:hover { background: var(--p-quiz-accent); color: #FFF; }
        .carousel-btn-prev { left: 8px; }
        .carousel-btn-next { right: 8px; }
        .carousel-indicator { position: absolute; bottom: 8px; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); color: #FFF; padding: 2px 10px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 700; z-index: 10; }
        .preview-controls-overlay { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 15; }
        .preview-action-chip { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); box-shadow: var(--shadow-sm); cursor: pointer; transition: var(--transition-smooth); }

        .empty-slot-box { width: 100%; height: 320px; background: #F8FAFC; border: 2px dashed var(--border-subtle); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); text-align: center; padding: 20px; }
        .empty-slot-box i { font-size: 2.4rem; color: var(--p-quiz-accent); }
        .slot-card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 12px; flex-wrap: wrap; gap: 8px; }
        .fullscreen-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .fullscreen-modal.active { display: flex; }
        .fullscreen-container { background: #FFFFFF; border-radius: var(--radius-lg); width: 95vw; height: 92vh; max-width: 1300px; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden; }

        .fullscreen-body { flex: 1; width: 100%; height: 100%; position: relative; background: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .fullscreen-iframe { width: 100%; height: 100%; border: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.48); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-container { background: #FFFFFF; border-radius: var(--radius-lg); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-subtle); background: var(--bg-subtle); }
        .upload-tab-buttons { display: flex; gap: 8px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; margin-bottom: 10px; }
        .tab-btn { padding: 6px 14px; border-radius: var(--radius-full); font-size: 0.84rem; font-weight: 600; border: 1px solid var(--border-subtle); background: #FFF; color: var(--text-secondary); cursor: pointer; }
        .tab-btn.active { background: var(--p-quiz-bg); color: var(--p-quiz-text); border-color: var(--p-quiz-border); }
        .drop-zone { border: 2px dashed var(--p-quiz-border); background: #F8FAFC; border-radius: var(--radius-md); padding: 24px; text-align: center; cursor: pointer; transition: var(--transition-smooth); display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .drop-zone:hover { background: #F5F3FF; border-color: var(--p-quiz-accent); }
        .drop-zone i { font-size: 2.2rem; color: var(--p-quiz-accent); }
        .file-list-preview { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
        .file-item-tag { display: flex; justify-content: space-between; align-items: center; background: #ECFDF5; border: 1px solid #A7F3D0; padding: 6px 12px; border-radius: var(--radius-md); font-size: 0.82rem; color: #065F46; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-label { font-size: 0.84rem; font-weight: 600; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: inherit; font-size: 0.88rem; }
        .form-textarea { font-family: 'Fira Code', monospace; min-height: 120px; resize: vertical; }
        .toast-box { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #FFF; padding: 12px 20px; border-radius: var(--radius-full); font-size: 0.88rem; font-weight: 600; display: none; z-index: 4000; box-shadow: var(--shadow-lg); }
        .toast-box.active { display: flex; align-items: center; gap: 8px; }
    </style>
</head>

          badge.className = "inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500 text-white font-bold text-xs flex-shrink-0 mt-0.5";
        } else if (savedAnswer === idx) {
          button.className += " bg-rose-50 border-rose-300 text-rose-900";
          badge.className = "inline-flex items-center justify-center w-6 h-6 rounded-full bg-rose-500 text-white font-bold text-xs flex-shrink-0 mt-0.5";
        } else {
          button.className += " bg-white border-slate-100 opacity-60";
        }
      } else {
        // Active hover states before answering
        button.className += " bg-white border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/20 active:bg-emerald-50 cursor-pointer";
        button.onclick = () => selectOption(idx);
      }

      optionsContainer.appendChild(button);
    });

    // Control Next/Prev button states
    document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
    
    // Hide or show explanation panel
    const explanationPanel = document.getElementById('explanation-panel');
    if (savedAnswer !== null) {
      explanationPanel.classList.remove('hidden');
      renderRationales(q, savedAnswer);
    } else {
      explanationPanel.classList.add('hidden');
    }
  }

  // Handle Option Click
  function selectOption(selectedIdx) {
    userAnswers[currentQuestionIndex] = selectedIdx;
    
    // Calculate Score if correct
    if (quizData[currentQuestionIndex].answerOptions[selectedIdx].isCorrect) {
      score++;
      document.getElementById('score-txt').innerText = score;
    }

    // Refresh layout to reveal answers & explanation
    loadQuizQuestion();
  }

  // Render Detailed Rationale Breakdown
  function renderRationales(q, userSelectIdx) {
    const isUserCorrect = q.answerOptions[userSelectIdx].isCorrect;
    const badge = document.getElementById('explanation-badge');
    
    if (isUserCorrect) {
      badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800";
      badge.innerText = "정답입니다!";
    } else {
      badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800";
      badge.innerText = "오답입니다!";
    }

    const rationalesList = document.getElementById('rationales-list');
    rationalesList.innerHTML = '';

    q.answerOptions.forEach((option, idx) => {
      const div = document.createElement('div');
      div.className = `p-3 rounded-xl border ${option.isCorrect ? 'bg-emerald-50 border-emerald-100 text-emerald-950' : 'bg-slate-50 border-slate-100 text-slate-600'}`;
      
      const optionTitle = document.createElement('p');
      optionTitle.className = "font-semibold mb-1 flex items-center gap-1.5 text-xs md:text-sm";
      
      const dot = document.createElement('span');
      dot.className = `inline-block w-2.5 h-2.5 rounded-full ${option.isCorrect ? 'bg-emerald-500' : 'bg-slate-400'}`;
      
      optionTitle.appendChild(dot);
      optionTitle.append(`보기 ${String.fromCharCode(65 + idx)}`);
      
      const optionDesc = document.createElement('p');
      optionDesc.className = "text-xs md:text-sm pl-4 leading-relaxed";
      optionDesc.innerHTML = `<strong class="text-slate-800">${option.text}</strong><br><span class="text-slate-500 mt-1 block">${option.rationale}</span>`;

      div.appendChild(optionTitle);
      div.appendChild(optionDesc);
      rationalesList.appendChild(div);
    });
  }

  // Next Question or End Quiz
  function nextQuestion() {
    if (userAnswers[currentQuestionIndex] === null) {
      alert("문제를 푼 뒤에 다음으로 넘어갈 수 있습니다.");
      return;
    }

    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex++;
      loadQuizQuestion();
    } else {
      // Quiz complete
      showQuizComplete();
    }
  }

  // Previous Question
  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      loadQuizQuestion();
    }
  }

  // Show Quiz Results Card
  function showQuizComplete() {
    document.getElementById('quiz-complete-card').classList.remove('hidden');
    document.getElementById('options-container').parentElement.classList.add('hidden');
    document.getElementById('prev-btn').parentElement.classList.add('hidden');
    
    document.getElementById('final-score').innerText = score;

    // Custom feedback based on score
    let comment = "";
    if (score === 20) {
      comment = "🏆 대단해요! 완벽한 환경 전문가이시군요! 시험 만점은 따놓은 당상입니다.";
    } else if (score >= 16) {
      comment = "👍 훌륭합니다! 교과 핵심 환경 개념을 튼튼하게 확립하고 계시네요.";
    } else if (score >= 10) {
      comment = "⭐ 괜찮은 점수예요! 오답 노트를 한 번 훑어보며 부족한 내용을 보강해 보세요.";
    } else {
      comment = "✏️ 기말고사 전 복습이 조금 필요할 수 있어요. '전체 보기 & 학습' 탭을 활용해 복습해 보세요!";
    }
    document.getElementById('grade-comment').innerText = comment;
  }

  // Restart Quiz
  function resetQuiz() {
    currentQuestionIndex = 0;
    userAnswers = Array(quizData.length).fill(null);
    score = 0;
    document.getElementById('score-txt').innerText = "0";

    // Show normal quiz block
    document.getElementById('quiz-complete-card').classList.add('hidden');
    document.getElementById('options-container').parentElement.classList.remove('hidden');
    document.getElementById('prev-btn').parentElement.classList.remove('hidden');

    loadQuizQuestion();
  }

  // TAB 2 Render: Generate Scrollable Detailed Study Guide
  function renderStudyAll() {
    const container = document.getElementById('study-list-container');
    container.innerHTML = '';

    quizData.forEach((q, qIdx) => {
      const card = document.createElement('div');
      card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4";

      // Card Header
      const header = document.createElement('div');
      header.className = "flex items-center justify-between border-b border-slate-100 pb-3";
      
      const badge = document.createElement('span');
      badge.className = "px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-lg";
      badge.innerText = `기말고사 완벽 대비 문제 ${q.questionNumber}`;

      header.appendChild(badge);
      card.appendChild(header);

      // Question Title
      const title = document.createElement('h3');
      title.className = "font-bold text-slate-800 text-base leading-relaxed whitespace-pre-line";
      title.innerText = q.question;
      card.appendChild(title);

      // Solutions Box
      const solBox = document.createElement('div');
      solBox.className = "space-y-3 mt-4";

      q.answerOptions.forEach((option, idx) => {
        const item = document.createElement('div');
        item.className = `p-4 rounded-xl border text-sm ${option.isCorrect ? 'bg-emerald-50/70 border-emerald-200 text-emerald-950' : 'bg-slate-50 border-slate-100 text-slate-600'}`;
        
        const label = document.createElement('p');
        label.className = "font-bold mb-1 flex items-center gap-2 text-xs md:text-sm";
        
        const mark = document.createElement('span');
        if (option.isCorrect) {
          mark.className = "px-2 py-0.5 bg-emerald-500 text-white font-black text-2xs rounded-md";
          mark.innerText = "정답";
        } else {
          mark.className = "px-2 py-0.5 bg-slate-300 text-slate-600 font-bold text-2xs rounded-md";
          mark.innerText = "오답";
        }

        label.appendChild(mark);
        label.append(`보기 ${String.fromCharCode(65 + idx)}: ${option.text}`);

        const rationalText = document.createElement('p');
        rationalText.className = "text-xs md:text-sm text-slate-500 mt-1 pl-1 leading-relaxed";
        rationalText.innerText = option.rationale;

        item.appendChild(label);
        item.appendChild(rationalText);
        solBox.appendChild(item);
      });

      card.appendChild(solBox);
      container.appendChild(card);
    });
  }
</script>

        }
    };

    // 준비된 파스텔톤 블록 색상 팔레트 모음
    const PALETTES = {
        classic: [
            null,
            '#FFB7B2', // Z (파스텔 핑크)
            '#FFDAC1', // S (파스텔 피치)
            '#E2F0CB', // T (파스텔 연두)
            '#B5EAD7', // O (파스텔 민트)
            '#C7CEEA', // L (파스텔 연보라)
            '#FF9AA2', // J (딥 파스텔 로즈)
            '#B3C5FF'  // I (파스텔 소라)
        ],
        cotton: [
            null,
            '#FFC6FF', // Z (바닐라 핑크)
            '#BDB2FF', // S (솜사탕 퍼플)
            '#9BF6FF', // T (캔디 블루)
            '#CAFFBF', // O (라임 그린)
            '#FDFFB6', // L (레몬 옐로우)
            '#FFADAD', // J (밀크 스트로베리)
            '#FFD6A5'  // I (밀크 오렌지)
        ],
        fruit: [
            null,
            '#FF85A1', // Z (체리 레드)
            '#FFAAA6', // S (복숭아 살구)
            '#FFD3B6', // T (상큼 자몽)
            '#FFF5BA', // O (달콤 바나나)
            '#A8E6CF', // L (풋사과 그린)
            '#DED2F9', // J (라벤더 블루베리)
            '#98DDCA'  // I (싱그러운 멜론)
        ],
        forest: [
            null,
            '#D4A373', // Z (따뜻한 나무)
            '#FAEDCD', // S (포근한 베이지)
            '#FEFAE0', // T (크림 버터)
            '#E9EDC6', // O (어린 새싹)
            '#ADC178', // L (초록 올리브)
            '#DDE5B6', // J (연한 잎사귀)
            '#A98467'  // I (가을 도토리)
        ],
        sea: [
            null,
            '#A2D2FF', // Z (시원한 하늘바다)
            '#BDE0FE', // S (부드러운 물결 블루)
            '#FFC8DD', // T (산호초 핑크)
            '#FFAFCC', // O (조개껍데기 퍼플핑크)
            '#98DDCA', // J (청량한 얕은바다 민트)
            '#8ECAE6', // L (햇살비친 바다 에메랄드)
            '#4EA8DE'  // I (깊고 푸른 바다 블루)
        ]
    };

    // 현재 사용 중인 블록 색상 배열
    let COLORS = PALETTES.classic;

    // 테트로미노 형태 
    const SHAPES = [
        [],
        [[1,1,0],[0,1,1],[0,0,0]], // Z
        [[0,2,2],[2,2,0],[0,0,0]], // S
        [[0,3,0],[3,3,3],[0,0,0]], // T
        [[4,4],[4,4]],             // O
        [[5,0,0],[5,5,5],[0,0,0]], // L
        [[0,0,6],[6,6,6],[0,0,0]], // J
        [[0,0,0,0],[7,7,7,7],[0,0,0,0],[0,0,0,0]] // I
    ];

    let board = [];
    let score = 0;
    let isGameOver = false;
    let isPaused = true; // 대기 상태로 시작
    let gameLoopId = null;

    let currentPiece = null;
    let nextPiece = null;

    // 콜백 연동용 내부 변수
    let onModalPrimaryClick = null;
    let onModalSecondaryClick = null;

    // 배경색을 테마와 팔레트 조합에 따라 업데이트하는 함수
    function updateBackgroundColor() {
        const selectedValue = paletteSelect.value;
        if (selectedValue === 'sea') {
            if (currentTheme === 'light') {
                document.documentElement.style.setProperty('--bg-color', '#E4F1F5'); // 해변 색상
            } else {
                document.documentElement.style.setProperty('--bg-color', '#1C242B'); // 밤의 심해 색상
            }
        } else {
            // 다른 테마는 원래 기본값 복구
            if (currentTheme === 'light') {
                document.documentElement.style.setProperty('--bg-color', '#F6F5F2');
            } else {
                document.documentElement.style.setProperty('--bg-color', '#2A2830');
            }
        }
    }

    // 테마 변경 토글 이벤트 핸들러
    themeToggleBtn.addEventListener('click', () => {
        if (currentTheme === 'light') {
            currentTheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggleBtn.innerText = '🌙';
        } else {
            currentTheme = 'light';
            document.documentElement.removeAttribute('data-theme');
            themeToggleBtn.innerText = '☀️';
        }
        
        updateBackgroundColor();

        // 화면 다시 그리기
        if (currentPiece) {
            drawBoard();
            drawNextPreview();
            drawCurrentPiece();
        }
    });

    // 팔레트 변경 드롭다운 이벤트 핸들러
    paletteSelect.addEventListener('change', (e) => {
        const selectedValue = e.target.value;
        if (PALETTES[selectedValue]) {
            COLORS = PALETTES[selectedValue];
            
            updateBackgroundColor();

            // 실시간으로 화면의 모든 블록 색상 갱신
            if (currentPiece) {
                drawBoard();
                drawNextPreview();
                drawCurrentPiece();
            }
        }
    });

    // 게임 보드 생성 및 초기화
    function initBoard() {
        board = [];
        for(let r = 0; r < ROW; r++){
            board[r] = [];
            for(let c = 0; c < COL; c++){
                board[r][c] = 0;
            }
        }
    }

    // 메인 그리드 및 낙하된 블록 그리기
    function drawBoard() {
        for(let r=0; r<ROW; r++) {
            for(let c=0; c<COL; c++) {
                drawSquare(context, c, r, board[r][c], SQ);
            }
        }
    }

    // 블록 1칸 렌더링 시스템 (둥근 가장자리 & 부드러운 하이라이팅)
    function drawSquare(ctx, x, y, colorIndex, size) {
        if(colorIndex === 0) {
            // 현재 활성화된 테마의 배경색과 그리드 라인 색상 사용
            ctx.fillStyle = themeCanvasColors[currentTheme].background;
            ctx.fillRect(x*size, y*size, size, size);
            ctx.strokeStyle = themeCanvasColors[currentTheme].gridLine;
            ctx.lineWidth = 1;
            ctx.strokeRect(x*size, y*size, size, size);
        } else {
            // 메인 색상 채우기
            ctx.fillStyle = COLORS[colorIndex];
            ctx.fillRect(x*size, y*size, size, size);
            
            // 입체감을 살리는 파스텔 하이라이트 라인 생성
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x*size + 1, y*size + 1, size - 2, size - 2);

            // 어두운 테두리 경계선
            ctx.strokeStyle = 'rgba(0,0,0,0.06)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x*size, y*size, size, size);
        }
    }

    // 랜덤 블록 생성 객체
    function generatePiece() {
        let r = Math.floor(Math.random() * (SHAPES.length - 1)) + 1;
        return {
            shape: SHAPES[r],
            colorIndex: r,
            x: 3,
            y: -2
        };
    }

    // 다음 미리보기 블록 패널 그리기
    function drawNextPreview() {
        nextContext.fillStyle = themeCanvasColors[currentTheme].background;
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        
        if (!nextPiece) return;

        const shape = nextPiece.shape;
        const colorIndex = nextPiece.colorIndex;
        
        // 정렬을 위한 그리드 보정 계산
        const blockGridSize = 14; 
        const offsetLeft = (nextCanvas.width - (shape[0].length * blockGridSize)) / 2;
        const offsetTop = (nextCanvas.height - (shape.length * blockGridSize)) / 2;

        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c]) {
                    nextContext.fillStyle = COLORS[colorIndex];
                    nextContext.fillRect(offsetLeft + c*blockGridSize, offsetTop + r*blockGridSize, blockGridSize, blockGridSize);
                    
                    nextContext.strokeStyle = 'rgba(255,255,255,0.5)';
                    nextContext.lineWidth = 1.5;
                    nextContext.strokeRect(offsetLeft + c*blockGridSize + 1, offsetTop + r*blockGridSize + 1, blockGridSize - 2, blockGridSize - 2);
                }
            }
        }
    }

    // 현재 플레이어가 움직이는 피스 렌더링
    function drawCurrentPiece() {
        for(let r=0; r<currentPiece.shape.length; r++) {
            for(let c=0; c<currentPiece.shape[r].length; c++) {
                if(currentPiece.shape[r][c]) {
                    if (currentPiece.y + r >= 0) {
                        drawSquare(context, currentPiece.x + c, currentPiece.y + r, currentPiece.colorIndex, SQ);
                    }
                }
            }
        }
    }

    // 움직이기 전 이전 좌표 잔상 지우기
    function eraseCurrentPiece() {
        for(let r=0; r<currentPiece.shape.length; r++) {
            for(let c=0; c<currentPiece.shape[r].length; c++) {
                if(currentPiece.shape[r][c] && currentPiece.y + r >= 0) {
                    drawSquare(context, currentPiece.x + c, currentPiece.y + r, 0, SQ);
                }
            }
        }
    }

    // 벽 및 고정 블록 충돌 계산 감지
    function hasCollision(x, y, proposedShape) {
        for(let r=0; r<proposedShape.length; r++) {
            for(let c=0; c<proposedShape[r].length; c++) {
                if(!proposedShape[r][c]) continue;
                
                let checkX = x + c;
                let checkY = y + r;
                
                if(checkX < 0 || checkX >= COL || checkY >= ROW) return true;
                if(checkY < 0) continue; // 보드 천장 위 공간은 통과 허용
                if(board[checkY][checkX] !== 0) return true;
            }
        }
        return false;
    }

    // 아래로 이동
    function moveDown() {
        if(isPaused || isGameOver) return;
        eraseCurrentPiece();
        if(!hasCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
            currentPiece.y++;
            drawCurrentPiece();
        } else {
            lockPiece();
        }
    }

    // 좌측 이동
    function moveLeft() {
        if(isPaused || isGameOver) return;
        eraseCurrentPiece();
        if(!hasCollision(currentPiece.x - 1, currentPiece.y, currentPiece.shape)) {
            currentPiece.x--;
        }
        drawCurrentPiece();
    }

    // 우측 이동
    function moveRight() {
        if(isPaused || isGameOver) return;
        eraseCurrentPiece();
        if(!hasCollision(currentPiece.x + 1, currentPiece.y, currentPiece.shape)) {
            currentPiece.x++;
        }
        drawCurrentPiece();
    }

    // 시계방향 블록 회전 (Wall Kick 보완 설계)
    function rotate() {
        if(isPaused || isGameOver) return;
        eraseCurrentPiece();
        
        // 90도 전치 회전 배열 연산
        let nextShape = [];
        for(let c=0; c<currentPiece.shape[0].length; c++) {
            let row = [];
            for(let r=currentPiece.shape.length-1; r>=0; r--) {
                row.push(currentPiece.shape[r][c]);
            }
            nextShape.push(row);
        }
        
        let kick = 0;
        // 회전 후 보드 영역 이탈 시 1칸씩 킥 튕김 보정
        if(hasCollision(currentPiece.x, currentPiece.y, nextShape)) {
            if(currentPiece.x > COL / 2) {
                kick = -1; // 우측 벽 킥
                if (hasCollision(currentPiece.x + kick, currentPiece.y, nextShape)) kick = -2; // I블록용 2칸 킥
            } else {
                kick = 1; // 좌측 벽 킥
                if (hasCollision(currentPiece.x + kick, currentPiece.y, nextShape)) kick = 2;
            }
        }
        
        if(!hasCollision(currentPiece.x + kick, currentPiece.y, nextShape)) {
            currentPiece.x += kick;
            currentPiece.shape = nextShape;
        }
        drawCurrentPiece();
    }

    // 한방 낙하 (Space / Drop 버튼)
    function hardDrop() {
        if(isPaused || isGameOver) return;
        eraseCurrentPiece();
        while(!hasCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
            currentPiece.y++;
        }
        lockPiece();
    }

    // 내려앉은 조각 잠금 및 전체 가로줄 소거 처리
    function lockPiece() {
        for(let r=0; r<currentPiece.shape.length; r++) {
            for(let c=0; c<currentPiece.shape[r].length; c++) {
                if(!currentPiece.shape[r][c]) continue;
                
                // 천장에 닿아서 잠기면 게임오버 트리거
                if(currentPiece.y + r < 0) {
                    gameOver();
                    return;
                }
                board[currentPiece.y + r][currentPiece.x + c] = currentPiece.colorIndex;
            }
        }
        
        // 완성된 행 체크 후 밀어내기
        let clearedLines = 0;
        for(let r=0; r<ROW; r++) {
            if(board[r].every(cellValue => cellValue !== 0)) {
                board.splice(r, 1);
                board.unshift(new Array(COL).fill(0));
                clearedLines++;
            }
        }

        if(clearedLines > 0) {
            score += clearedLines * 10;
            scoreElement.innerText = score;
        }
        
        drawBoard();
        
        // 다음 준비된 피스 넘기기
        currentPiece = nextPiece;
        nextPiece = generatePiece();
        drawNextPreview();
        drawCurrentPiece();
    }

    // 게임 시작 및 재시작 시스템
    function startNewGame() {
        initBoard();
        score = 0;
        scoreElement.innerText = score;
        isGameOver = false;
        isPaused = false;
        
        currentPiece = generatePiece();
        nextPiece = generatePiece();
        
        drawBoard();
        drawNextPreview();
        drawCurrentPiece();
        
        // 일시정지 버튼 원상복구
        updatePauseButtonUI(false);
        closeModal();
    }

    // 일시정지 버튼 스타일 갱신 보조
    function updatePauseButtonUI(paused) {
        const pauseBtn = document.getElementById('pauseBtn');
        if (paused) {
            pauseBtn.innerText = "Resume";
            pauseBtn.style.backgroundColor = currentTheme === 'dark' ? "#3D503D" : "#E2F0CB";
            pauseBtn.style.boxShadow = currentTheme === 'dark' ? "0 4px 0 #212D21" : "0 4px 0 #CAD8B3";
            pauseBtn.style.color = currentTheme === 'dark' ? "#A8D8A8" : "#5D733E";
        } else {
            pauseBtn.innerText = "Pause";
            if (currentTheme === 'dark') {
                pauseBtn.style.backgroundColor = "#4D3838";
                pauseBtn.style.boxShadow = "0 4px 0 #2D1F1F";
                pauseBtn.style.color = "#FF9A9A";
            } else {
                pauseBtn.style.backgroundColor = "#FFE6E6";
                pauseBtn.style.boxShadow = "0 4px 0 #E5CFCF";
                pauseBtn.style.color = "#D87070";
            }
        }
    }

    // 일시정지 스위칭
    function togglePause() {
        if (isGameOver) return;
        isPaused = !isPaused;
        updatePauseButtonUI(isPaused);

        if (isPaused) {
            showModal(
                "일시 정지 ⏸", 
                "잠시 한숨을 돌리고 있어요.", 
                "게임 계속하기", 
                null,
                () => { togglePause(); }
            );
        } else {
            closeModal();
        }
    }

    // 게임 종료 (Exit) 트리거 수동 작동
    function triggerExit() {
        if (isGameOver) return;
        
        // 작동 중이었다면 임시 일시정지
        if (!isPaused) {
            isPaused = true;
            updatePauseButtonUI(true);
        }

        showModal(
            "게임 종료 🚪",
            "정말 현재 게임을 끝내시겠어요?<br>지금까지 얻은 점수는 보존되지 않습니다.",
            "예 (종료하기)",
            "아니오 (계속하기)",
            () => {
                gameOver(); // 게임 종료 화면으로 전환
            },
            () => {
                togglePause(); // 다시 게임 재개
            }
        );
    }

    // 게임 종료 트리거
    function gameOver() {
        isGameOver = true;
        isPaused = true;
        showModal(
            "Game Over 😭", 
            `아쉽게 머리가 꽉 찼네요!<br>최종 점수: <strong>${score}점</strong>`, 
            "다시 도전하기",
            null,
            () => { startNewGame(); }
        );
    }

    // 공용 모달창 표시 연동 (취소 버튼 지원 추가)
    function showModal(title, description, btnText, cancelBtnText = null, onPrimary = null, onCancel = null) {
        modalTitle.innerHTML = title;
        modalDesc.innerHTML = description;
        modalBtn.innerText = btnText;
        
        onModalPrimaryClick = onPrimary;
        onModalSecondaryClick = onCancel;

        if (cancelBtnText) {
            modalCancelBtn.innerText = cancelBtnText;
            modalCancelBtn.style.display = "block";
        } else {
            modalCancelBtn.style.display = "none";
        }

        modalOverlay.classList.add('active');
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        onModalPrimaryClick = null;
        onModalSecondaryClick = null;
    }

    // 모달 주 버튼 클릭 바인딩
    modalBtn.addEventListener('click', () => {
        if (onModalPrimaryClick) {
            onModalPrimaryClick();
        } else {
            // 기본 동작
            if (isGameOver || (isPaused && score === 0)) {
                startNewGame();
            } else {
                togglePause();
            }
        }
    });

    // 모달 취소 버튼 클릭 바인딩
    modalCancelBtn.addEventListener('click', () => {
        if (onModalSecondaryClick) {
            onModalSecondaryClick();
        } else {
            closeModal();
        }
    });

    // 태블릿/모바일 터치용 이벤트 핸들러 바인딩 (지연 없이 즉시 실행하도록 세팅)
    const touchMap = {
        'leftBtn': moveLeft,
        'rightBtn': moveRight,
        'rotateBtn': rotate,
        'downBtn': moveDown,
        'dropBtn': hardDrop,
        'pauseBtn': togglePause,
        'exitBtn': triggerExit
    };

    // 모든 버튼 터치 이벤트 및 방지 설정 추가
    Object.keys(touchMap).forEach(btnId => {
        const btnElement = document.getElementById(btnId);
        btnElement.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 더블탭 줌 방지 등
            touchMap[btnId]();
        }, { passive: false });
        
        // 마우스 클릭도 같이 보조 호환
        btnElement.addEventListener('click', (e) => {
            e.preventDefault();
        });
    });

    // 키보드 키 제어 연동 (PC 지원 보조)
    document.addEventListener('keydown', event => {
        if (isPaused || isGameOver) {
            if (event.keyCode === 32 || event.keyCode === 13) { // 스페이스바 혹은 엔터로 모달 제어
                if(modalOverlay.classList.contains('active')) {
                    modalBtn.click();
                }
            }
            return;
        }
        switch (event.keyCode) {
            case 37: // Left Arrow
                moveLeft();
                break;
            case 38: // Up Arrow
                rotate();
                break;
            case 39: // Right Arrow
                moveRight();
                break;
            case 40: // Down Arrow
                moveDown();
                break;
            case 32: // Space
                hardDrop();
                break;
            case 27: // ESC
                triggerExit(); // 종료 팝업 호출
                break;
        }
    });

    // 첫 실행 초기 모달 연결
    showModal(
        "웰컴! 🧸", 
        "아기자기한 파스텔 테트리스입니다.<br>준비가 되셨으면 시작하세요!", 
        "시작하기",
        null,
        () => { startNewGame(); }
    );

    // 게임 주기 가속 하강 속도 제어기 (1초 마다 자동 낙하)
    let dropStart = Date.now();
    function gameLoop() {
        let now = Date.now();
        let delta = now - dropStart;
        if(delta > 1000) { 
            moveDown();
            dropStart = Date.now();
        }
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    // 루프 애니메이션 시작
    gameLoop();
</script>
</body>
</html>

    <template id="tmpl-meal-app">
<!DOCTYPE html>
<html lang="ko">
<head>

    <script>
        const API_URL = "https://2026sy.eunseony75.workers.dev";
const SCHOOL_NAME = "숭의여자중학교";
        const SCHOOL_CODE = "7132148";
        const OFFICE_CODE = "B10";

        const LOCAL_MEAL_DATA = [
            {
                MLSV_YMD: "20260312",
                DDISH_NM: "혼합잡곡밥 (5)<br/>맑은순두부국 (5)<br/>시금치나물<br/>제육볶음 (5.6.10.13)<br/>야채계란말이 (1.5)<br/>포기김치 (9)",
                CAL_INFO: "811.9 Kcal"
            }
        ];

        const mainTitle = document.getElementById("mainTitle");
        const lunchDate = document.getElementById("lunchDate");
        const searchButton = document.getElementById("searchButton");
        const menuDisplay = document.getElementById("menuDisplay");
        const caloriesDisplay = document.getElementById("caloriesDisplay");
        const settingsButton = document.getElementById("settingsButton");
        const settingsPanel = document.getElementById("settingsPanel");
        const settingsArrow = document.getElementById("settingsArrow");
        const statusIndicator = document.getElementById("statusIndicator");
        const backupFile = document.getElementById("backupFile");
        const backupStatus = document.getElementById("backupStatus");

        function toggleSettings() {
            const isHidden = settingsPanel.classList.contains("hidden");

            settingsPanel.classList.toggle("hidden");
            settingsArrow.style.transform =
                isHidden ? "rotate(180deg)" : "rotate(0deg)";
        }

        function updateStatusIndicator(mode) {
            if (mode === "online") {
                statusIndicator.className =
                    "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-bold bg-green-100 text-green-600 text-xs shadow-sm border border-green-200";

                statusIndicator.innerHTML =
                    '<span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span><span>나이스 API 연결</span>';
            } else {
                statusIndicator.className =
                    "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-bold bg-blue-100 text-blue-600 text-xs shadow-sm border border-blue-200";

                statusIndicator.innerHTML =
                    '<span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span><span>로컬 백업 데이터</span>';
            }
        }

        function cleanMenu(menu) {
            return String(menu || "")
                .replace(/<br\s*\/?\s*>/gi, "\n")
                .replace(/&amp;/gi, "&")
                .replace(/&lt;/gi, "<")
                .replace(/&gt;/gi, ">");
        }

        function getApiMessage(data) {
            if (data?.RESULT?.MESSAGE) {
                return data.RESULT.MESSAGE;
            }

            const head = data?.mealServiceDietInfo?.[0]?.head;

            if (Array.isArray(head)) {
                const resultItem = head.find(item => item.RESULT);

                if (resultItem?.RESULT?.MESSAGE) {
                    return resultItem.RESULT.MESSAGE;
                }
            }

            return "";
        }

        function loadLocalMeal(ymd) {
            const savedBackup = localStorage.getItem("localMealData");

            let activeData = LOCAL_MEAL_DATA;

            if (savedBackup) {
                try {
                    activeData = JSON.parse(savedBackup);
                } catch {
                    activeData = LOCAL_MEAL_DATA;
                }
            }

            const matchedRow = activeData.find(
                row => String(row.MLSV_YMD) === ymd
            );

            if (matchedRow) {
                menuDisplay.innerText = cleanMenu(matchedRow.DDISH_NM);

                caloriesDisplay.innerText =
                    String(matchedRow.CAL_INFO || "-")
                        .split("(")[0]
                        .trim();

                updateStatusIndicator("offline");
                return true;
            }

            return false;
        }

        async function fetchLunch() {
            const dateValue = lunchDate.value;

            if (!dateValue) {
                alert("조회할 날짜를 선택해 주세요!");
                return;
            }

            const ymd = dateValue.replace(/-/g, "");

            menuDisplay.innerText =
                "맛있는 급식 메뉴를 불러오는 중이에요... ⏳";

            caloriesDisplay.innerText = "-";
            searchButton.disabled = true;
            searchButton.innerText = "조회 중...";

            const parameters = new URLSearchParams({
Type: "json",
                pIndex: "1",
                pSize: "10",
                ATPT_OFCDC_SC_CODE: OFFICE_CODE,
                SD_SCHUL_CODE: SCHOOL_CODE,
                MLSV_YMD: ymd
            });

            const requestUrl =
                `${API_URL}?${parameters.toString()}`;

            try {
                const response = await fetch(requestUrl);

                if (!response.ok) {
                    throw new Error(`HTTP 오류: ${response.status}`);
                }

                const data = await response.json();
                const mealRows =
                    data?.mealServiceDietInfo?.[1]?.row;

                if (
                    Array.isArray(mealRows) &&
                    mealRows.length > 0
                ) {
                    const lunch =
                        mealRows.find(
                            row =>
                                String(row.MMEAL_SC_CODE) === "2"
                        ) || mealRows[0];

                    menuDisplay.innerText =
                        cleanMenu(lunch.DDISH_NM);

                    caloriesDisplay.innerText =
                        lunch.CAL_INFO || "-";

                    updateStatusIndicator("online");
                } else {
                    const apiMessage =
                        getApiMessage(data);

                    menuDisplay.innerText =
                        apiMessage.includes("해당하는 데이터가 없습니다")
                            ? "선택한 날짜에 급식 정보가 없습니다 😢\n주말이거나 방학일 수 있어요!"
                            : apiMessage ||
                              "선택한 날짜에 급식 정보가 없습니다.";

                    caloriesDisplay.innerText = "-";
                    updateStatusIndicator("online");
                }
            } catch (error) {
                console.error("급식 정보 조회 오류:", error);

                if (!loadLocalMeal(ymd)) {
                    menuDisplay.innerText =
                        "급식 정보를 불러오지 못했습니다.\n잠시 후 다시 조회해 주세요.";

                    caloriesDisplay.innerText = "-";
                    updateStatusIndicator("offline");
                }
            } finally {
                searchButton.disabled = false;
                searchButton.innerText = "급식 조회하기 🔍";
            }
        }

        backupFile.addEventListener("change", function (event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function (readEvent) {
                try {
                    const result = readEvent.target.result;

                    if (typeof result !== "string") {
                        throw new Error("파일 읽기 실패");
                    }

                    let jsonData = JSON.parse(result);

                    if (!Array.isArray(jsonData)) {
                        throw new Error("배열 형식이 아닙니다.");
                    }

                    if (
                        jsonData.length > 0 &&
                        jsonData[0].MLSV_YMD === "급식일자"
                    ) {
                        jsonData.shift();
                    }

                    localStorage.setItem(
                        "localMealData",
                        JSON.stringify(jsonData)
                    );

                    backupStatus.innerText =
                        `✅ 백업 완료! (${jsonData.length}일치 식단 보관됨)`;

                    backupStatus.classList.remove("hidden");

                    alert(
                        "오프라인 백업 데이터가 저장되었습니다."
                    );
                } catch {
                    alert(
                        "올바른 JSON 파일이 아닙니다. 파일을 다시 확인해 주세요."
                    );
                }
            };

            reader.readAsText(file);
        });

        settingsButton.addEventListener(
            "click",
            toggleSettings
        );

        searchButton.addEventListener(
            "click",
            fetchLunch
        );

        lunchDate.addEventListener(
            "change",
            fetchLunch
        );

        window.addEventListener(
            "DOMContentLoaded",
            function () {
                mainTitle.innerText =
                    `🏫 ${SCHOOL_NAME} 오늘의 급식`;

                const today = new Date();
                const year = today.getFullYear();
                const month =
                    String(today.getMonth() + 1)
                        .padStart(2, "0");
                const day =
                    String(today.getDate())
                        .padStart(2, "0");

                lunchDate.value =
                    `${year}-${month}-${day}`;

                fetchLunch();
            }
        );
    </script>
</body>
</html>
    </template>
    <script>
        const STUDENT_INFO = { id: 's_3_1_minsol', name: '김민솔', grade: 3, classNum: 1 };
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let carouselIndexes = {};
        let multiFilePayloads = [];
        let currentFullscreenItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreen(); });
        });

        function switchUploadTab(tab) {
            if (tab === 'file') {
                document.getElementById('tabBtnFile').classList.add('active');
                document.getElementById('tabBtnCode').classList.remove('active');
                document.getElementById('tabContentFile').style.display = 'block';
                document.getElementById('tabContentCode').style.display = 'none';
            } else {
                document.getElementById('tabBtnCode').classList.add('active');
                document.getElementById('tabBtnFile').classList.remove('active');
                document.getElementById('tabContentCode').style.display = 'block';
                document.getElementById('tabContentFile').style.display = 'none';
            }
        }

        function handleMultipleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const listContainer = document.getElementById('fileListPreview');
            listContainer.innerHTML = '';
            multiFilePayloads = [];
            files.forEach((file, idx) => {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let fType = 'html';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov'].includes(ext)) fType = 'video';
                else if (['pdf'].includes(ext)) fType = 'pdf';
                else if (['ppt', 'pptx'].includes(ext)) fType = 'pptx';

                reader.onload = (re) => {
                    multiFilePayloads.push({ name: file.name, type: fType, data: re.target.result });
                    const tag = document.createElement('div');
                    tag.className = 'file-item-tag';
                    tag.innerHTML = `<span><i class="fa-solid fa-check-circle"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB)</span> <span style="font-size:0.75rem;">${fType.toUpperCase()}</span>`;
                    listContainer.appendChild(tag);
                };
                if (fType === 'image' || fType === 'video' || fType === 'pdf') {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function loadStudentProjects() {
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Object.keys(parsed).length > 0) {
                        studentProjectsMap = parsed;
                        return;
                    }
                } catch (e) {}
            }

            studentProjectsMap = {};
            const tmpl_quiz = document.getElementById('tmpl-quiz');
            if (tmpl_quiz) {
                studentProjectsMap['quiz'] = {
                    title: "중학교 환경 기말고사 완벽 대비 모의고사",
                    items: [{ name: '기본 결과물', type: 'html', data: tmpl_quiz.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const tmpl_game = document.getElementById('tmpl-game');
            if (tmpl_game) {
                studentProjectsMap['game'] = {
                    title: "파스텔 테트리스 🧸",
                    items: [{ name: '기본 결과물', type: 'html', data: tmpl_game.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const tmpl_meal_app = document.getElementById('tmpl-meal-app');
            if (tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "숭의여자중학교 오늘의 급식",
                    items: [{ name: '기본 결과물', type: 'html', data: tmpl_meal_app.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || activeItem.data.startsWith('data:video/')) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || activeItem.data.startsWith('data:application/pdf')) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 보기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-images"></i> 내 파일/작품 여러 개 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            currentFullscreenItem = project;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];

            if (activeItem.type === 'image' || activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || activeItem.data.startsWith('data:video/')) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || activeItem.data.startsWith('data:application/pdf')) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 다중 파일 업로드/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 작품 시리즈`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

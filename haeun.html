        .slot-card { background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; box-shadow: var(--shadow-sm); transition: var(--transition-smooth); position: relative; }

        .slot-iframe { width: 100%; height: 100%; border: none; background: #FFFFFF; }
        .preview-controls-overlay { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10; }
        .preview-action-chip { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); box-shadow: var(--shadow-sm); cursor: pointer; transition: var(--transition-smooth); }
        .preview-action-chip:hover { background: var(--p-quiz-accent); color: #FFF; transform: translateY(-1px); }
        .empty-slot-box { width: 100%; height: 320px; background: #F8FAFC; border: 2px dashed var(--border-subtle); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); text-align: center; padding: 20px; }
        .empty-slot-box i { font-size: 2.4rem; color: var(--p-quiz-accent); }
        .slot-card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 12px; flex-wrap: wrap; gap: 8px; }
        .fullscreen-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .fullscreen-modal.active { display: flex; }
        .fullscreen-container { background: #FFFFFF; border-radius: var(--radius-lg); width: 95vw; height: 92vh; max-width: 1300px; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden; }
        .fullscreen-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #F8FAFC; border-bottom: 1px solid var(--border-subtle); }
        .fullscreen-body { flex: 1; width: 100%; height: 100%; position: relative; background: #FFFFFF; }
        .fullscreen-iframe { width: 100%; height: 100%; border: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.48); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-container { background: #FFFFFF; border-radius: var(--radius-lg); width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-subtle); background: var(--bg-subtle); }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-label { font-size: 0.84rem; font-weight: 600; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: inherit; font-size: 0.88rem; }
        .form-textarea { font-family: 'Fira Code', monospace; min-height: 140px; resize: vertical; }
        .toast-box { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #FFF; padding: 12px 20px; border-radius: var(--radius-full); font-size: 0.88rem; font-weight: 600; display: none; z-index: 4000; box-shadow: var(--shadow-lg); }
        .toast-box.active { display: flex; align-items: center; gap: 8px; }
    </style>
</head>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중3 과학 1학기 기말고사 대비 퀴즈 (기본 개념)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid <i fa-solid fa-graduation-cap"></i>
                <span>중3 과학 기말대비 (기본개념 20제)</span>
            </h1>
            <span class="bg-indigo-500 px-3 py-1 rounded-full text-xs font-semibold">난이도: 하~중</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 transition-all duration-300">
            
            <!-- 1. START SCREEN -->
            <div id="start-screen" class="text-center py-8">
                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl animate-bounce">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h2 class="text-2xl font-bold mb-4">기본부터 차근차근! 과학 퀴즈</h2>
                <p class="text-slate-600 mb-6 max-w-md mx-auto leading-relaxed">
                    중학교 3학년 1학기 과학 과정의 꼭 알아야 할 기초 개념 20문항입니다. 계산보다 핵심 원리 위주로 쉽게 구성되어 있습니다.
                </p>
                <button id="btn-start" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-indigo-200 transition-all duration-150 text-lg w-full sm:w-auto">
                    퀴즈 시작하기
                </button>
            </div>

            <!-- 2. QUIZ SCREEN -->
            <div id="quiz-screen" class="hidden">
                <!-- Progress & Stats -->
                <div class="flex justify-between items-center mb-4 text-sm text-slate-500">
                    <span class="font-medium">질문 <span id="current-question-num" class="text-indigo-600 font-bold">1</span> / 20</span>
                    <span class="bg-slate-100 py-1 px-3 rounded-full text-xs font-bold" id="category-badge">생물</span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-2 mb-6">
                    <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 5%"></div>
                </div>

                <!-- Question Text -->
                <h3 id="question-text" class="text-lg md:text-xl font-bold mb-6 text-slate-900 leading-snug">
                    질문 내용이 여기에 들어갑니다.
                </h3>

                <!-- Options -->
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Options dynamically rendered here -->
                </div>

                <!-- Explanation Box (Initially Hidden) -->
                <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border transition-all duration-300">
                    <div class="flex items-start gap-3">
                        <span id="feedback-icon" class="text-xl"></span>
                        <div>
                            <h4 id="feedback-title" class="font-bold text-sm mb-1">정답입니다!</h4>
                            <p id="explanation-text" class="text-sm text-slate-600 leading-relaxed"></p>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <div class="flex justify-between items-center">
                    <button id="btn-hint" class="text-slate-500 hover:text-indigo-600 flex items-center gap-1 text-sm font-medium transition-colors">
                        <i class="fa-regular fa-lightbulb"></i> 힌트 보기
                    </button>
                    <button id="btn-next" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md transition-all text-sm">
                        다음 문제 <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>

            <!-- 3. RESULT SCREEN -->
            <div id="result-screen" class="hidden text-center py-6">
                <div id="result-icon-container" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                    <!-- Icon dynamically updated -->
                </div>
                <h2 class="text-2xl font-bold mb-2">시험 결과</h2>
                <div class="text-4xl font-extrabold text-indigo-600 mb-4" id="score-text">0 / 20</div>
                <p id="result-comment" class="text-slate-600 mb-8 max-w-md mx-auto leading-relaxed"></p>

                <!-- Review Section -->
                <div class="text-left border-t border-slate-100 pt-6 mb-8 max-h-60 overflow-y-auto px-2">
                    <h3 class="font-bold mb-4 text-slate-900">문제별 복습</h3>
                    <div id="review-list" class="space-y-3">
                        <!-- Review items dynamically added -->
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <button id="btn-restart" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all">
                        다시 도전하기
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 border-t border-slate-200 py-4 text-center text-xs text-slate-500">

        function startQuiz() {

        function loadQuestion() {

            currentQuestionNum.textContent = q.number;

                        <span class="font-medium text-slate-700 text-sm md:text-base">${opt.text}</span>
                    </div>
                    <div class="status-icon hidden text-lg"></div>
                `;
                button.addEventListener('click', () => selectOption(idx, button));
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIdx, selectedButton) {
            if (isAnswered) return; // Prevent double answering
            isAnswered = true;

            const q = questions[currentQuestionIndex];
            const correctOptionIndex = q.options.findIndex(opt => opt.isCorrect);
            const isCorrect = selectedIdx === correctOptionIndex;

            // Update Score and History
            if (isCorrect) {
                score++;
                userAnswers.push({ num: q.number, correct: true, text: q.question });
            } else {
                userAnswers.push({ num: q.number, correct: false, text: q.question });
            }

            // Style all option buttons
            const optionButtons = optionsContainer.children;
            for (let i = 0; i < optionButtons.length; i++) {
                const btn = optionButtons[i];
                const statusIcon = btn.querySelector('.status-icon');
                statusIcon.classList.remove('hidden');

                if (i === correctOptionIndex) {
                    // This is the correct answer
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 flex items-center justify-between";

                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-100 opacity-60 flex items-center justify-between cursor-default";

            explanationBox.classList.remove('hidden');
            if (isCorrect) {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-emerald-100 bg-emerald-50/50 transition-all duration-300";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                feedbackTitle.textContent = "정답입니다! 참 잘했어요.";
                feedbackTitle.className = "font-bold text-emerald-800 text-sm mb-1";
            } else {
                explanationBox.className = "mb-6 p-4 rounded-xl border border-rose-100 bg-rose-50/50 transition-all duration-300";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600"></i>`;
                feedbackTitle.textContent = "아쉬워요! 틀렸습니다.";
                feedbackTitle.className = "font-bold text-rose-800 text-sm mb-1";
            }
            explanationText.textContent = q.options[selectedIdx].rationale;

            // Show 'Next' Button
            btnNext.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showHint() {
            const q = questions[currentQuestionIndex];
            hintModalText.textContent = q.hint;
            hintModal.classList.remove('hidden');
        }

        function closeHint() {
            hintModal.classList.add('hidden');
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const scoreText = document.getElementById('score-text');
            const resultComment = document.getElementById('result-comment');
            const resultIconContainer = document.getElementById('result-icon-container');
            const reviewList = document.getElementById('review-list');

            scoreText.textContent = `${score} / 20 문제`;

            // Tailored feedback
            if (score === 20) {
                resultIconContainer.className = "w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl";

            } else if (score >= 10) {
                resultIconContainer.className = "w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl";
                resultIconContainer.innerHTML = `<i class="fa-solid fa-thumbs-up"></i>`;
                resultComment.textContent = "절반 이상 맞추셨네요! 조금만 보완하면 기말고사에서 만족스러운 점수를 얻을 수 있습니다. 틀린 문제 중심의 꼼꼼한 교과서 정독을 추천합니다.";
            } else {

            }

            // Render Review
            reviewList.innerHTML = '';
            userAnswers.forEach(ans => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg flex items-start gap-2.5 text-sm ${ans.correct ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'}`;

                    <span><strong>Q${ans.num}.</strong> ${ans.text}</span>

        function restartQuiz() {
            startQuiz();
        }

      while (height--) {
        matrix.push(new Array(width).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 0, 0],
          [1, 1, 1],
          [0, 1, 0]
        ];
      }
      if (type === 'O') {
        return [
          [2, 2],
          [2, 2]
        ];
      }
      if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3]
        ];
      }
      if (type === 'J') {
        return [
          [0, 4, 0],
          [0, 4, 0],
          [4, 4, 0]
        ];
      }
      if (type === 'I') {
        return [
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0]
        ];
      }
      if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0]
        ];
      }
      if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0]
        ];
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            drawBlock(x + offset.x, y + offset.y, colors[value]);
          }
        });
      });
    }

    function drawBlock(x, y, color) {
      context.fillStyle = color;
      context.fillRect(x, y, 1, 1);
      context.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      context.lineWidth = 0.06;
      context.strokeRect(x + 0.04, y + 0.04, 0.92, 0.92);
    }

    function draw() {
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);
    }

    function drawGrid() {
      context.strokeStyle = '#f1f4f8';
      context.lineWidth = 0.03;
      for (let x = 0; x <= 12; x++) {
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, 20);
        context.stroke();
      }
      for (let y = 0; y <= 20; y++) {
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(12, y);
        context.stroke();
      }
    }

    function collide(arenaMatrix, playerObject) {
      const matrix = playerObject.matrix;
      const offset = playerObject.pos;

      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (
            matrix[y][x] !== 0 &&
            (arenaMatrix[y + offset.y] && arenaMatrix[y + offset.y][x + offset.x]) !== 0
          ) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arenaMatrix, playerObject) {
      playerObject.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arenaMatrix[y + playerObject.pos.y][x + playerObject.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      let rowCount = 1;

      outer: for (let y = arena.length - 1; y >= 0; y--) {
        for (let x = 0; x < arena[y].length; x++) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }

        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        y++;

        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(direction) {
      player.pos.x += direction;
      if (collide(arena, player)) {
        player.pos.x -= direction;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
      player.pos.y = 0;
      player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);

      // 새 블록이 나오자마자 충돌하면 게임 오버 후 초기화
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function rotate(matrix, direction) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < y; x++) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }

      if (direction > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate(direction) {
      const originalX = player.pos.x;
      let offset = 1;
      rotate(player.matrix, direction);

      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));

        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -direction);
          player.pos.x = originalX;
          return;
        }
      }
    }

    function updateScore() {
      scoreElement.textContent = player.score;
    }

    let dropCounter = 0;
    let dropInterval = 850;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;

      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') {
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        playerDrop();
      } else if (event.key === 'ArrowUp') {
        playerRotate(1);
      }
    });

    function bindButton(id, action) {
      const button = document.getElementById(id);
      button.addEventListener('click', action);
      button.addEventListener('touchstart', event => {
        event.preventDefault();
        action();
      }, { passive: false });
    }

    bindButton('left-btn', () => playerMove(-1));
    bindButton('right-btn', () => playerMove(1));
    bindButton('down-btn', () => playerDrop());
    bindButton('rotate-btn', () => playerRotate(1));

    // PWA 설치 버튼: https 환경에서만 실제 설치 버튼이 뜬다.
    let deferredPrompt = null;
    const installButton = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.style.display = 'inline-block';
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.style.display = 'none';
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>

            prevDateBtn.addEventListener('click', () => changeDate(-1));
            nextDateBtn.addEventListener('click', () => changeDate(1));

            // 최초 로드 시 즉시 급식 정보 가져오기 (요구사항 4번)
            fetchMealData();
        });

        // 날짜 증감 연산 함수
        function changeDate(daysToMove) {
            const currentDate = new Date(mealDateInput.value);
            if (isNaN(currentDate.getTime())) return;
            
            currentDate.setDate(currentDate.getDate() + daysToMove);
            const yyyy = currentDate.getFullYear();
            const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
            const dd = String(currentDate.getDate()).padStart(2, '0');
            
            mealDateInput.value = `${yyyy}-${mm}-${dd}`;
            fetchMealData();
        }

        // ----------------------------------------------------
        // 3. API 요청 및 데이터 처리 메인 로직
        // ----------------------------------------------------
        async function fetchMealData() {
            const rawDateValue = mealDateInput.value;
            if (!rawDateValue) {
                showError("날짜를 올바르게 선택해주세요.");
                return;
            }

            // 하이픈 제거하여 8자리 'YYYYMMDD'로 변환 (요구사항 2번)
            const dateQuery = rawDateValue.replace(/-/g, '');
            const params = new URLSearchParams({
Type: "json",
                pIndex: "1",
                pSize: "10",
                ATPT_OFCDC_SC_CODE: EDUCATION_OFFICE_CODE,
                SD_SCHUL_CODE: SCHOOL_CODE,
                MLSV_YMD: dateQuery
            });
            const targetUrl = `${API_URL}?${params.toString()}`;

            // 화면 초기화 및 로딩 인디케이터 표시
            showLoading(true);

            try {
                // API 요청 보내기
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    },
                    // 로컬 네트워크 장애 시 너무 오래 대기하지 않도록 2.5초 타임아웃 처리
                    signal: AbortSignal.timeout(2500)
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error Status: ${response.status}`);
                }

                const data = await response.json();
                const mealRows = data.mealServiceDietInfo?.[1]?.row;

                if (Array.isArray(mealRows) && mealRows.length > 0) {
                    const meal = mealRows.find(item => String(item.MMEAL_SC_CODE) === "2") || mealRows[0];
                    const cleanMenu = (meal.DDISH_NM || "")
                        .replace(/<br\s*\/?\s*>/gi, "\n")
                        .replace(/&amp;/g, "&")
                        .replace(/&lt;/g, "<")
                        .replace(/&gt;/g, ">");

                    processResponseData({
                        success: true,
                        clean_menu: cleanMenu,
                        calories: meal.CAL_INFO || "정보 없음"
                    }, false); // 원격 서버 성공
                } else {
                    processResponseData({
                        success: false,
                        message: data.RESULT?.MESSAGE || "오늘은 급식이 없거나 조회할 수 없습니다."
                    }, false);
                }

            } catch (error) {
                console.warn("원격 급식 서버 접속 실패. 폴백 로컬 데이터베이스를 조회합니다.", error);
                
                // 사설망 서버 연결 불가 시, 업로드된 CSV 내장 데이터로 부드러운 대체 동작 실행!
                if (LOCAL_MEAL_DB[dateQuery]) {
                    const fallbackData = LOCAL_MEAL_DB[dateQuery];
                    processResponseData(fallbackData, true); // 로컬 오프라인 데이터 성공
                } else {
                    // 로컬 데이터에도 없는 날짜는 깔끔하게 급식 없음 안내
                    // 주말(토, 일) 판별하여 친절한 멘트 출력
                    const dayOfWeek = new Date(mealDateInput.value).getDay();
                    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                    
                    const message = isWeekend 
                        ? "신나는 주말입니다! 주말에는 학교 급식이 운영되지 않아요." 
                        : "해당 날짜의 급식 데이터가 존재하지 않습니다.";
                    
                    showError(message, true); // 오프라인 에러 모드 표시
                }
            }
        }

        // ----------------------------------------------------
        // 4. 성공/실패 렌더링 세부 함수
        // ----------------------------------------------------
        function processResponseData(data, isOfflineMode = false) {
            showLoading(false);

            // 네트워크 배지 업데이트
            updateNetworkBadge(isOfflineMode);

            if (data && data.success === true) {
                // 성공할 때 (요구사항 3번)
                mealMenu.innerText = data.clean_menu;
                mealCalories.innerText = data.calories || "정보 없음";

                // 뷰 가시성 전환
                mealCard.classList.remove('hidden');
                mealCard.classList.add('flex');
                errorCard.classList.add('hidden');
                errorCard.classList.remove('flex');
            } else {
                // 실패할 때 (요구사항 3번)
                const fallbackMessage = (data && data.message) ? data.message : "오늘은 급식이 없거나 조회할 수 없습니다.";
                showError(fallbackMessage);
            }
        }

        // 로딩 화면 토글 함수
        function showLoading(isLoading) {
            if (isLoading) {
                loadingState.classList.remove('hidden');
                loadingState.classList.add('flex');
                mealCard.classList.add('hidden');
                mealCard.classList.remove('flex');
                errorCard.classList.add('hidden');
                errorCard.classList.remove('flex');
            } else {
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
            }
        }

        // 에러 상태 렌더링 함수
        function showError(msg, isOfflineMode = false) {
            showLoading(false);
            updateNetworkBadge(isOfflineMode);

            errorMessage.innerText = msg;
            
            errorCard.classList.remove('hidden');
            errorCard.classList.add('flex');
            mealCard.classList.add('hidden');
            mealCard.classList.remove('flex');
        }

        // 네트워크 배지 텍스트 및 스타일 동적 전환
        function updateNetworkBadge(isOfflineMode) {
            if (isOfflineMode) {
                dbBadge.className = "bg-amber-100 text-amber-700 font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 border border-amber-200 animate-pulse";
                dbBadge.innerHTML = `<span class="w-2 h-2 bg-amber-500 rounded-full"></span> 로컬 백업 DB 모드`;
            } else {
                dbBadge.className = "bg-emerald-100 text-emerald-700 font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 border border-emerald-200";
                dbBadge.innerHTML = `<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> 실시간 급식 서버 연결됨`;
            }
        }
    </script>
</body>
</html>
    </template>
    <script>
        const STUDENT_INFO = { id: 's_3_2_haeun', name: '박하은', grade: 3, classNum: 2 };
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let currentFullscreenCode = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreen(); });
            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenCode) return;
                const newWin = window.open('', '_blank');
                newWin.document.write(currentFullscreenCode);
                newWin.document.close();
            });
        });

        function loadStudentProjects() {
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Object.keys(parsed).length > 0) {
                        studentProjectsMap = parsed;
                        return;
                    }
                } catch (e) {}
            }

            studentProjectsMap = {};
            const tmpl_quiz = document.getElementById('tmpl-quiz');
            if (tmpl_quiz) {
                studentProjectsMap['quiz'] = {
                    title: "중3 과학 1학기 기말고사 대비 퀴즈 (기본 개념)",
                    sourceCode: tmpl_quiz.innerHTML.trim(),
                    updatedAt: '2026-07-01'
                };
            }
            const tmpl_game = document.getElementById('tmpl-game');
            if (tmpl_game) {
                studentProjectsMap['game'] = {
                    title: "파스텔 테트리스 수정본",
                    sourceCode: tmpl_game.innerHTML.trim(),
                    updatedAt: '2026-07-01'
                };
            }
            const tmpl_meal_app = document.getElementById('tmpl-meal-app');
            if (tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "🏫 숭의여중 급식 확인",
                    sourceCode: tmpl_meal_app.innerHTML.trim(),
                    updatedAt: '2026-07-01'
                };
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.sourceCode) {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                <iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(project.sourceCode)}"></iframe>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project.title, project.sourceCode));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-plus"></i> 내 작품 등록하기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function openFullscreen(title, sourceCode) {
            currentFullscreenCode = sourceCode;
            document.getElementById('fullscreenTitle').textContent = title;
            document.getElementById('fullscreenIframe').srcdoc = sourceCode;
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenIframe').srcdoc = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 등록 및 수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
                document.getElementById('slotCodeInput').value = existing.sourceCode || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 창작 과제`;
                document.getElementById('slotCodeInput').value = '';
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            const sourceCode = document.getElementById('slotCodeInput').value.trim();
            if (!title || !sourceCode) { alert('제목과 소스코드를 입력해주세요.'); return; }
            studentProjectsMap[topicId] = { title, sourceCode, updatedAt: new Date().toISOString().split('T')[0] };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast('성공적으로 저장되었습니다!');
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

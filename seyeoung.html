        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border-subtle); background: #F8FAFC; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }
        .upload-tab-buttons { display: flex; gap: 8px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 8px; }

        .tab-btn.active { background: var(--p-quiz-bg); color: var(--p-quiz-text); border-color: var(--p-quiz-border); box-shadow: var(--shadow-sm); }
        .drop-zone { border: 2px dashed var(--p-quiz-border); background: #F8FAFC; border-radius: var(--radius-md); padding: 30px 20px; text-align: center; cursor: pointer; transition: var(--transition-smooth); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .drop-zone:hover { background: #F5F3FF; border-color: var(--p-quiz-accent); }
        .drop-zone i { font-size: 2.6rem; color: var(--p-quiz-accent); }

        // --- APPLICATION STATE ---

        const examScreen = document.getElementById('exam-screen');
        const resultScreen = document.getElementById('result-screen');
        const timerDisplay = document.getElementById('timer-display');
        const timerBadge = document.getElementById('timer-badge');

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnQuickSubmit = document.getElementById('btn-quick-submit');
        const btnRestart = document.getElementById('btn-restart');

        const statusGrid = document.getElementById('status-grid');
        const progressText = document.getElementById('progress-text');
        
        const questionCard = document.getElementById('question-card');
        const questionCategory = document.getElementById('question-category');
        const questionNumberBadge = document.getElementById('question-number-badge');
        const passageContainer = document.getElementById('passage-container');
        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options-container');

        const scoreDisplay = document.getElementById('score-display');
        const correctCountDisplay = document.getElementById('correct-count-display');

        // Modal Elements
        const alertModal = document.getElementById('alert-modal');
        const modalIconContainer = document.getElementById('modal-icon-container');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnConfirm = document.getElementById('modal-btn-confirm');
        const modalActions = document.getElementById('modal-actions');

        // --- EVENT LISTENERS ---
        btnStart.addEventListener('click', startExam);
        btnPrev.addEventListener('click', () => navigateQuestion(currentIdx - 1));
        btnNext.addEventListener('click', handleNextButton);
        btnQuickSubmit.addEventListener('click', promptSubmit);
        btnRestart.addEventListener('click', restartExam);
        modalBtnConfirm.addEventListener('click', closeModal);

        // --- FUNCTIONS ---

        // Custom Modal Alert Helper
        function showAlert(title, message, type = 'info', onConfirm = null) {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            
            // Stylize Icon and Background
            if (type === 'success') {
                modalIconContainer.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-emerald-50 text-emerald-600 border border-emerald-100";
                modalIconContainer.innerHTML = '<i class="fa-solid fa-circle-check text-2xl"></i>';
            } else if (type === 'warning') {
                modalIconContainer.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-amber-50 text-amber-600 border border-amber-100";
                modalIconContainer.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-2xl"></i>';
            } else if (type === 'confirm') {
                modalIconContainer.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-indigo-50 text-indigo-600 border border-indigo-100";
                modalIconContainer.innerHTML = '<i class="fa-solid fa-circle-question text-2xl"></i>';
            } else {
                modalIconContainer.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-indigo-50 text-indigo-600 border border-indigo-100";
                modalIconContainer.innerHTML = '<i class="fa-solid fa-circle-info text-2xl"></i>';
            }

            // Customize Action Buttons
            if (type === 'confirm') {
                modalActions.innerHTML = `
                    <button id="modal-cancel-btn" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors">취소</button>
                    <button id="modal-confirm-btn" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-colors">확인</button>
                `;
                document.getElementById('modal-cancel-btn').onclick = closeModal;
                document.getElementById('modal-confirm-btn').onclick = () => {
                    closeModal();
                    if (onConfirm) onConfirm();
                };
            } else {
                modalActions.innerHTML = `
                    <button id="modal-ok-btn" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-colors">확인</button>
                `;
                document.getElementById('modal-ok-btn').onclick = () => {
                    closeModal();
                    if (onConfirm) onConfirm();
                };
            }

            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertModal.firstElementChild.classList.remove('scale-95');
                alertModal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            alertModal.firstElementChild.classList.remove('scale-100');
            alertModal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                alertModal.classList.add('hidden');
            }, 150);
        }

        // Initialize Timer
        function startTimer() {
            startTime = Date.now();
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
            timerBadge.classList.remove('hidden');
        }

        function updateTimerDisplay() {
            const elapsedMs = Date.now() - startTime;
            const totalSeconds = Math.floor(elapsedMs / 1000);
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerText = `${minutes}:${seconds}`;
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function getFormattedTime() {
            const elapsedMs = Date.now() - startTime;
            const totalSeconds = Math.floor(elapsedMs / 1000);
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}분 ${seconds}초`;
        }

        // Start Exam
        function startExam() {
            userAnswers = Array(questions.length).fill(null);
            currentIdx = 0;
            isSubmitted = false;
            
            startScreen.classList.add('hidden');
            examScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');

            buildStatusGrid();
            renderQuestion();
            startTimer();
        }

        // Sidebar Navigation Map builder
        function buildStatusGrid() {
            statusGrid.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `status-dot-${i}`;
                btn.className = "w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xs border transition-all duration-200 " + getStatusDotClass(i);
                btn.innerText = i + 1;
                btn.addEventListener('click', () => navigateQuestion(i));
                statusGrid.appendChild(btn);
            }
            updateProgressText();
        }

        function getStatusDotClass(index) {
            if (currentIdx === index) {
                return "border-indigo-600 bg-indigo-50 text-indigo-700 ring-2 ring-indigo-100 shadow-sm";
            } else if (userAnswers[index] !== null) {
                return "border-slate-300 bg-slate-100 text-slate-800";
            } else {
                return "border-slate-200 bg-white text-slate-400 hover:border-slate-300 hover:bg-slate-50";
            }
        }

        function updateProgressText() {
            const completedCount = userAnswers.filter(ans => ans !== null).length;
            progressText.innerText = `${completedCount} / ${questions.length} 완료`;
        }

        // Render Active Question
        function renderQuestion() {
            const q = questions[currentIdx];

            // Setup Badge, category and numbers
            questionCategory.innerText = q.category;
            questionNumberBadge.innerText = `Question ${currentIdx + 1} of ${questions.length}`;
            
            // Title
            questionTitle.innerText = q.title;

            // Optional Passage box
            if (q.passage) {
                passageContainer.innerHTML = q.passage;
                passageContainer.classList.remove('hidden');
            } else {
                passageContainer.classList.add('hidden');
                passageContainer.innerHTML = '';
            }

            // Options container building
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, oIdx) => {
                const isSelected = userAnswers[currentIdx] === oIdx;
                
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left p-4 rounded-xl border flex items-center justify-between transition-all group ${
                    isSelected 
                    ? 'border-indigo-600 bg-indigo-50/50 text-indigo-900 font-semibold ring-1 ring-indigo-200 shadow-sm' 
                    : 'border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50 text-slate-700'
                }`;
                
                // Click behavior
                btn.addEventListener('click', () => selectOption(oIdx));

                // Left Content: Option Label Indicator and Option Text
                const contentDiv = document.createElement('div');
                contentDiv.className = "flex items-center space-x-3";

                const badge = document.createElement('span');
                badge.className = `w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs ${
                    isSelected
                    ? 'bg-indigo-600 text-white'
                    : 'bg-slate-100 text-slate-500 group-hover:bg-slate-200'
                }`;
                badge.innerText = oIdx + 1;

                const textSpan = document.createElement('span');
                textSpan.className = "text-sm md:text-base";
                textSpan.innerText = opt;

                contentDiv.appendChild(badge);
                contentDiv.appendChild(textSpan);
                btn.appendChild(contentDiv);

                // Right Content: Select Indicator Circle
                const circle = document.createElement('span');
                circle.className = `w-5 h-5 rounded-full border flex items-center justify-center text-xs ${
                    isSelected
                    ? 'border-indigo-600 bg-indigo-600 text-white'
                    : 'border-slate-300 bg-white group-hover:border-slate-400'
                }`;
                if (isSelected) {
                    circle.innerHTML = '<i class="fa-solid fa-check"></i>';
                }
                btn.appendChild(circle);

                optionsContainer.appendChild(btn);
            });

            // Update footer controls
            btnPrev.disabled = currentIdx === 0;
            if (currentIdx === 0) {
                btnPrev.classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                btnPrev.classList.remove('opacity-40', 'cursor-not-allowed');
            }

            if (currentIdx === questions.length - 1) {
                btnNext.innerHTML = '<span>제출하기</span> <i class="fa-solid fa-paper-plane text-xs"></i>';
                btnNext.className = "px-5 py-3 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl flex items-center space-x-2 transition-colors";
            } else {
                btnNext.innerHTML = '<span>다음 문제</span> <i class="fa-solid fa-chevron-right"></i>';
                btnNext.className = "px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl flex items-center space-x-2 transition-colors";
            }

            // Sync visual active dot in sidebar
            for (let i = 0; i < questions.length; i++) {
                const dot = document.getElementById(`status-dot-${i}`);
                if (dot) {
                    dot.className = "w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xs border transition-all duration-200 " + getStatusDotClass(i);
                }
            }
        }

        // Pick Answer Option
        function selectOption(optionIndex) {
            userAnswers[currentIdx] = optionIndex;
            
            // Re-render immediately to show visual change
            renderQuestion();
            updateProgressText();
        }

        // Navigation Controller
        function navigateQuestion(targetIndex) {
            if (targetIndex >= 0 && targetIndex < questions.length) {
                currentIdx = targetIndex;
                renderQuestion();
            }
        }

        function handleNextButton() {
            if (currentIdx === questions.length - 1) {
                promptSubmit();
            } else {
                navigateQuestion(currentIdx + 1);
            }
        }

        // Submitting Exam Process
        function promptSubmit() {
            const unanswered = [];
            userAnswers.forEach((ans, idx) => {
                if (ans === null) unanswered.push(idx + 1);
            });

            if (unanswered.length > 0) {
                showAlert(
                    "풀지 않은 문제 있음", 
                    `아직 풀지 않은 문제가 있습니다: ${unanswered.join(', ')}번\n그래도 제출하고 채점하시겠습니까?`, 
                    'warning', 
                    processSubmit
                );
            } else {
                showAlert(
                    "답안 제출", 
                    "시험을 종료하고 답안을 제출하시겠습니까?", 
                    'confirm', 
                    processSubmit
                );
            }
        }

        function processSubmit() {
            stopTimer();
            isSubmitted = true;
            
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correctAnswer) {
                    correctCount++;
                }
            });

            const rawScore = Math.round((correctCount / questions.length) * 100);

            // Hide exam screen, show result
            examScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            timerBadge.classList.add('hidden');

            // Render stats
            scoreDisplay.innerText = rawScore;
            correctCountDisplay.innerText = correctCount;
            timeSpentDisplay.innerText = getFormattedTime();

            // Render Detailed Analysis Review
            renderReviews();
        }

        // Render Explanations Screen (오답 및 정답 이유 상세 해설 생성)
        function renderReviews() {
            detailedReviewsContainer.innerHTML = '';

            questions.forEach((q, idx) => {
                const uAnswer = userAnswers[idx];
                const isCorrect = uAnswer === q.correctAnswer;

                const card = document.createElement('div');
                card.className = `bg-white border rounded-2xl p-6 shadow-sm overflow-hidden ${
                    isCorrect 
                    ? 'border-emerald-200 bg-gradient-to-br from-white to-emerald-50/10' 
                    : 'border-rose-200 bg-gradient-to-br from-white to-rose-50/10'
                }`;

                // Header status
                const headDiv = document.createElement('div');
                headDiv.className = "flex justify-between items-start mb-4";
                
                const qNumSpan = document.createElement('span');
                qNumSpan.className = "font-bold text-slate-900";
                qNumSpan.innerText = `${idx + 1}번 문제 [${q.category}]`;

                const badge = document.createElement('span');
                if (isCorrect) {
                    badge.className = "bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full flex items-center space-x-1 border border-emerald-200";
                    badge.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>정답</span>';
                } else {
                    badge.className = "bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full flex items-center space-x-1 border border-rose-200";
                    badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>오답</span>';
                }

                headDiv.appendChild(qNumSpan);
                headDiv.appendChild(badge);
                card.appendChild(headDiv);

                // Passage (if exists)
                if (q.passage) {
                    const passDiv = document.createElement('div');
                    passDiv.className = "p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-xs md:text-sm font-medium leading-relaxed mb-4 whitespace-pre-wrap";
                    passDiv.innerHTML = q.passage;
                    card.appendChild(passDiv);
                }

                // Question Title
                const titlePara = document.createElement('p');
                titlePara.className = "text-sm md:text-base font-bold text-slate-800 mb-4";
                titlePara.innerText = q.title;
                card.appendChild(titlePara);

                // Option review items
                const optsGrid = document.createElement('div');
                optsGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-2.5 mb-6";

                q.options.forEach((opt, oIdx) => {
                    const item = document.createElement('div');
                    
                    let bgBorderClass = "border-slate-200 text-slate-600";
                    let iconMarkup = "";

                    // User selected this
                    const isUserSelected = uAnswer === oIdx;
                    // Is this the actual correct option
                    const isActualCorrect = q.correctAnswer === oIdx;

                    if (isActualCorrect) {
                        bgBorderClass = "border-emerald-300 bg-emerald-50 text-emerald-900 font-semibold";
                        iconMarkup = '<span class="text-xs bg-emerald-500 text-white rounded px-1.5 py-0.5 ml-2 font-bold">정답</span>';
                    } else if (isUserSelected) {
                        bgBorderClass = "border-rose-300 bg-rose-50 text-rose-900 font-semibold";
                        iconMarkup = '<span class="text-xs bg-rose-500 text-white rounded px-1.5 py-0.5 ml-2 font-bold">내 답</span>';
                    }

                    item.className = `p-3 rounded-xl border text-xs md:text-sm flex items-center justify-between ${bgBorderClass}`;
                    item.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <span class="w-5 h-5 rounded bg-slate-100 flex items-center justify-center text-[10px] font-bold text-slate-500">${oIdx + 1}</span>
                            <span>${opt}</span>
                        </div>
                        <div>${iconMarkup}</div>
                    `;
                    optsGrid.appendChild(item);
                });
                card.appendChild(optsGrid);

                // Explanations Box
                const explanationBox = document.createElement('div');
                explanationBox.className = "bg-indigo-50/40 rounded-xl p-4 md:p-5 border border-indigo-100 text-xs md:text-sm text-slate-700 space-y-3";
                
                // Why it is correct
                explanationBox.innerHTML = `
                    <div>
                        <p class="font-bold text-indigo-900 flex items-center space-x-1.5 mb-1.5">
                            <i class="fa-solid fa-lightbulb text-indigo-500"></i>
                            <span>왜 ${q.correctAnswer + 1}번이 정답일까요?</span>
                        </p>
                        <p class="leading-relaxed text-slate-600 pl-5">${q.explanation.correct}</p>
                    </div>
                `;

                // Why others are wrong
                const wrongsListDiv = document.createElement('div');
                wrongsListDiv.className = "pt-2 border-t border-indigo-100/60";
                wrongsListDiv.innerHTML = `
                    <p class="font-bold text-slate-800 flex items-center space-x-1.5 mb-2">
                        <i class="fa-solid fa-circle-xmark text-rose-400"></i>
                        <span>나머지 번호가 오답인 이유:</span>
                    </p>
                `;

                const listUl = document.createElement('ul');
                listUl.className = "space-y-1.5 pl-5 list-disc text-slate-500 leading-relaxed";

                let wrongCounter = 0;
                q.options.forEach((opt, oIdx) => {
                    if (oIdx !== q.correctAnswer) {
                        const li = document.createElement('li');
                        li.innerHTML = `<strong class="text-slate-600">${oIdx + 1}번:</strong> ${q.explanation.wrong[wrongCounter]}`;
                        listUl.appendChild(li);
                        wrongCounter++;
                    }
                });

                wrongsListDiv.appendChild(listUl);
                explanationBox.appendChild(wrongsListDiv);
                
                card.appendChild(explanationBox);
                detailedReviewsContainer.appendChild(card);
            });
        }

        // Restart Exam Setup
        function restartExam() {
            showAlert(
                "시험 재시작", 
                "다시 시험에 응시하시겠습니까? 기존 기록은 소멸됩니다.", 
                'confirm', 
                () => {
                    startExam();
                }
            );
        }
    </script>

     * 서울특별시교육청
     *
     * 학교 코드 7132148:
     * 숭의여자중학교
     */
    const API_URL =
      "https://2026sy.eunseony75.workers.dev";
const EDUCATION_OFFICE_CODE = "B10";
    const SCHOOL_CODE = "7132148";

    // 화면 요소

      document.getElementById("meal-date");

    const searchBtn =
      document.getElementById("search-btn");

    const loadingSpinner =
      document.getElementById("loading-spinner");

    const errorCard =
      document.getElementById("error-card");

    const errorMessage =
      document.getElementById("error-message");

    const mealCard =
      document.getElementById("meal-card");

    const mealCalories =
      document.getElementById("meal-calories");

    const mealMenu =
      document.getElementById("meal-menu");

    /*
     * 오늘 날짜를 YYYY-MM-DD 형식으로 반환
     */
    function getTodayDateString() {
      const today = new Date();

      const year = today.getFullYear();

      const month = String(
        today.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        today.getDate()
      ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    /*
     * YYYY-MM-DD를 YYYYMMDD로 변환
     */
    function convertDateToYYYYMMDD(dateString) {
      return dateString.replace(/-/g, "");
    }

    /*
     * 나이스 급식 메뉴에 포함된 HTML 줄바꿈과
     * 일부 특수문자를 일반 텍스트로 변환
     */
    function cleanMenuText(menuText) {
      return String(menuText || "")
        .replace(/<br\s*\/?\s*>/gi, "\n")
        .replace(/&amp;/gi, "&")
        .replace(/&lt;/gi, "<")
        .replace(/&gt;/gi, ">")
        .replace(/&quot;/gi, "\"")
        .replace(/&#39;/gi, "'");
    }

    /*
     * API 오류 메시지를 확인
     */
    function getApiMessage(data) {
      if (data?.RESULT?.MESSAGE) {
        return data.RESULT.MESSAGE;
      }

      const head =
        data?.mealServiceDietInfo?.[0]?.head;

      if (Array.isArray(head)) {
        const resultItem = head.find(
          (item) => item.RESULT
        );

        if (resultItem?.RESULT?.MESSAGE) {
          return resultItem.RESULT.MESSAGE;
        }
      }

      return "";
    }

    /*
     * 로딩 화면 표시
     */
    function showLoading() {
      mealCard.classList.add("hidden");
      errorCard.classList.add("hidden");
      loadingSpinner.classList.remove("hidden");
      searchBtn.disabled = true;

      searchBtn.classList.add(
        "opacity-60",
        "cursor-not-allowed"
      );

      searchBtn.textContent = "조회 중";
    }

    /*
     * 급식 결과 표시
     */
    function showMeal(menu, calories) {
      loadingSpinner.classList.add("hidden");
      errorCard.classList.add("hidden");
      mealCard.classList.remove("hidden");

      mealMenu.textContent =
        menu || "메뉴 정보가 없습니다.";

      mealCalories.textContent =
        calories || "칼로리 정보 없음";

      searchBtn.disabled = false;

      searchBtn.classList.remove(
        "opacity-60",
        "cursor-not-allowed"
      );

      searchBtn.textContent = "급식 조회";
    }

    /*
     * 급식 없음 또는 오류 표시
     */
    function showError(message) {
      loadingSpinner.classList.add("hidden");
      mealCard.classList.add("hidden");
      errorCard.classList.remove("hidden");

      errorMessage.textContent = message;

      searchBtn.disabled = false;

      searchBtn.classList.remove(
        "opacity-60",
        "cursor-not-allowed"
      );

      searchBtn.textContent = "급식 조회";
    }

    /*
     * 나이스 API에서 급식 정보 조회
     */
    async function fetchMealData(selectedDate) {
      if (!selectedDate) {
        showError("조회할 날짜를 선택해 주세요.");
        return;
      }

      showLoading();

      const mealDate =
        convertDateToYYYYMMDD(selectedDate);

      const parameters = new URLSearchParams({
Type: "json",
        pIndex: "1",
        pSize: "10",
        ATPT_OFCDC_SC_CODE:
          EDUCATION_OFFICE_CODE,
        SD_SCHUL_CODE:
          SCHOOL_CODE,
        MLSV_YMD:
          mealDate
      });

      const apiEndpoint =
        `${API_URL}?${parameters.toString()}`;

      try {
        const response =
          await fetch(apiEndpoint);

        if (!response.ok) {
          throw new Error(
            `HTTP 오류: ${response.status}`
          );
        }

        const data =
          await response.json();

        const mealRows =
          data?.mealServiceDietInfo?.[1]?.row;

        if (
          !Array.isArray(mealRows) ||
          mealRows.length === 0
        ) {
          const apiMessage =
            getApiMessage(data);

          if (
            apiMessage.includes(
              "해당하는 데이터가 없습니다"
            )
          ) {
            showError(
              "선택한 날짜에는 급식이 없습니다."
            );
          } else {
            showError(
              apiMessage ||
              "선택한 날짜에는 급식이 없습니다."
            );
          }

          return;
        }

        /*
         * 같은 날짜에 조식·중식·석식이 함께 조회될 경우
         * 중식(MMEAL_SC_CODE 2)을 우선 선택
         */
        const lunch =
          mealRows.find(
            (meal) =>
              String(meal.MMEAL_SC_CODE) === "2"
          ) || mealRows[0];

        const menu =
          cleanMenuText(lunch.DDISH_NM);

        const calories =
          lunch.CAL_INFO;

        showMeal(menu, calories);

      } catch (error) {
        console.error(
          "급식 정보 조회 오류:",
          error
        );

        showError(
          "급식 정보를 가져오지 못했습니다. 잠시 후 다시 조회해 주세요."
        );
      }
    }

    /*
     * 조회 버튼
     */
    searchBtn.addEventListener(
      "click",
      function () {
        if (!dateInput.value) {
          dateInput.focus();
          return;
        }

        fetchMealData(dateInput.value);
      }
    );

    /*
     * 날짜 변경 시 자동 조회
     */
    dateInput.addEventListener(
      "change",
      function () {
        if (dateInput.value) {
          fetchMealData(dateInput.value);
        }
      }
    );

    /*
     * 페이지가 열리면 오늘 급식을 자동 조회
     */
    window.addEventListener(
      "DOMContentLoaded",
      function () {
        const todayDate =
          getTodayDateString();

        dateInput.value =
          todayDate;

        fetchMealData(todayDate);
      }
    );
  </script>

</body>
</html>
    </template>
    <script>
        const STUDENT_INFO = { id: 's_2_3_seyeoung', name: '신세영', grade: 2, classNum: 3 };
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let carouselIndexes = {};
        let multiFilePayloads = [];
        let currentFullscreenItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFullscreen(); closeModal(); } });
            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenItem) return;
                const newWin = window.open('', '_blank');
                if (currentFullscreenItem.type === 'image') {
                    newWin.document.write('<img src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;">');
                } else if (currentFullscreenItem.type === 'video') {
                    newWin.document.write('<video controls autoplay src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;"></video>');
                } else {
                    newWin.document.write(currentFullscreenItem.data);
                }
                newWin.document.close();
            });
        });

        function switchUploadTab(tab) {
            if (tab === 'file') {
                document.getElementById('tabBtnFile').classList.add('active');
                document.getElementById('tabBtnCode').classList.remove('active');
                document.getElementById('tabContentFile').style.display = 'block';
                document.getElementById('tabContentCode').style.display = 'none';
            } else {
                document.getElementById('tabBtnCode').classList.add('active');
                document.getElementById('tabBtnFile').classList.remove('active');
                document.getElementById('tabContentCode').style.display = 'block';
                document.getElementById('tabContentFile').style.display = 'none';
            }
        }

        function handleMultipleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const listContainer = document.getElementById('fileListPreview');
            listContainer.innerHTML = '';
            multiFilePayloads = [];
            files.forEach((file) => {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let fType = 'html';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov'].includes(ext)) fType = 'video';
                else if (['pdf'].includes(ext)) fType = 'pdf';
                else if (['ppt', 'pptx'].includes(ext)) fType = 'pptx';

                reader.onload = (re) => {
                    multiFilePayloads.push({ name: file.name, type: fType, data: re.target.result });
                    const tag = document.createElement('div');
                    tag.className = 'file-item-tag';
                    tag.innerHTML = `<span><i class="fa-solid fa-check-circle"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB)</span> <span style="font-size:0.75rem;">${fType.toUpperCase()}</span>`;
                    listContainer.appendChild(tag);
                };
                if (fType === 'image' || fType === 'video' || fType === 'pdf') {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function loadStudentProjects() {
            studentProjectsMap = {};

            const el_tmpl_quiz = document.getElementById('tmpl_quiz');
            if (el_tmpl_quiz) {
                studentProjectsMap['quiz'] = {
                    title: "중1 영어 1학기 기말고사 모의고사",
                    items: [{ name: "중1 영어 1학기 기말고사 모의고사", type: 'html', data: el_tmpl_quiz.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const el_tmpl_meal_app = document.getElementById('tmpl_meal_app');
            if (el_tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "숭의여자중학교 오늘의 급식",
                    items: [{ name: "숭의여자중학교 오늘의 급식", type: 'html', data: el_tmpl_meal_app.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 파일 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>

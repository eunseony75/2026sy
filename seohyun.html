            --p-video-bg: #F0F9FF; --p-video-border: #E0F2FE; --p-video-text: #0284C7; --p-video-accent: #38BDF8;
            --p-slide-bg: #FFF7ED; --p-slide-border: #FFEDD5; --p-slide-text: #EA580C; --p-slide-accent: #FB923C;
            --p-meal-bg: #FEFCE8; --p-meal-border: #FEF08A; --p-meal-text: #CA8A04; --p-meal-accent: #FACC15;

            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg-main); color: var(--text-primary); line-height: 1.6; padding: 20px 14px; }

        button { font-family: inherit; cursor: pointer; border: none; outline: none; }
        .portfolio-wrapper { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .profile-banner { background: linear-gradient(135deg, #FFF5F7 0%, #FFFFFF 50%, #F5F7FF 100%); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); padding: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; box-shadow: var(--shadow-sm); }

        .profile-info h1 { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.86rem; font-weight: 600; transition: var(--transition-smooth); }

        .btn-secondary { background: var(--p-quiz-bg); color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); }

        .slot-card { background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; box-shadow: var(--shadow-sm); transition: var(--transition-smooth); position: relative; }
        .slot-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .slot-card-header { display: flex; justify-content: space-between; align-items: center; }
        .slot-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); margin-top: 4px; line-height: 1.35; }
        .slot-preview-box { width: 100%; height: 320px; background: #FAFAFC; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .slot-iframe { width: 100%; height: 100%; border: none; background: #FFFFFF; }
        .carousel-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--text-primary); z-index: 10; cursor: pointer; transition: var(--transition-smooth); }
        .carousel-nav-btn:hover { background: var(--p-quiz-accent); color: #FFF; }
        .carousel-btn-prev { left: 8px; }
        .carousel-btn-next { right: 8px; }
        .carousel-indicator { position: absolute; bottom: 8px; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); color: #FFF; padding: 2px 10px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 700; z-index: 10; }
        .preview-controls-overlay { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 15; }
        .preview-action-chip { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); box-shadow: var(--shadow-sm); cursor: pointer; transition: var(--transition-smooth); }
        .preview-action-chip:hover { background: var(--p-quiz-accent); color: #FFF; transform: translateY(-1px); }
        .empty-slot-box { width: 100%; height: 320px; background: #F8FAFC; border: 2px dashed var(--border-subtle); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); text-align: center; padding: 20px; }
        .empty-slot-box i { font-size: 2.4rem; color: var(--p-quiz-accent); }
        .slot-card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 12px; flex-wrap: wrap; gap: 8px; }
        .fullscreen-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        .fullscreen-modal.active { display: flex; }
        .fullscreen-container { background: #FFFFFF; border-radius: var(--radius-lg); width: 95vw; height: 92vh; max-width: 1300px; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden; }
        .fullscreen-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #F8FAFC; border-bottom: 1px solid var(--border-subtle); }
        .fullscreen-body { flex: 1; width: 100%; height: 100%; position: relative; background: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .fullscreen-iframe { width: 100%; height: 100%; border: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: flex-start; z-index: 9999; padding: 50px 16px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal-container { background: #FFFFFF; border-radius: 22px; width: 100%; max-width: 660px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); margin: auto; animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes popIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); background: #F8FAFC; border-top-left-radius: 22px; border-top-right-radius: 22px; }
        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border-subtle); background: #F8FAFC; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }
        .upload-tab-buttons { display: flex; gap: 8px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 8px; }
        .tab-btn { padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.86rem; font-weight: 700; border: 1px solid var(--border-subtle); background: #FFF; color: var(--text-secondary); cursor: pointer; transition: var(--transition-smooth); }
        .tab-btn.active { background: var(--p-quiz-bg); color: var(--p-quiz-text); border-color: var(--p-quiz-border); box-shadow: var(--shadow-sm); }
        .drop-zone { border: 2px dashed var(--p-quiz-border); background: #F8FAFC; border-radius: var(--radius-md); padding: 30px 20px; text-align: center; cursor: pointer; transition: var(--transition-smooth); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .drop-zone:hover { background: #F5F3FF; border-color: var(--p-quiz-accent); }
        .drop-zone i { font-size: 2.6rem; color: var(--p-quiz-accent); }
        .file-list-preview { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
        .file-item-tag { display: flex; justify-content: space-between; align-items: center; background: #ECFDF5; border: 1px solid #A7F3D0; padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.84rem; color: #065F46; font-weight: 600; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 0.88rem; font-weight: 700; color: var(--text-primary); }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: inherit; font-size: 0.9rem; }
        .form-textarea { font-family: 'Fira Code', monospace; min-height: 130px; resize: vertical; }
        .toast-box { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #FFF; padding: 12px 20px; border-radius: var(--radius-full); font-size: 0.88rem; font-weight: 600; display: none; z-index: 12000; box-shadow: var(--shadow-lg); }
        .toast-box.active { display: flex; align-items: center; gap: 8px; }
    </style>
</head>

        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let isAnswered = false;
let userResults = [];

// 배열 셔플 함수
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// 퀴즈 초기화
function initQuiz() {
    currentIndex = 0;
    score = 0;
    userResults = [];

    // 원본 데이터 복사 및 문제/보기 무작위 셔플
    currentQuestions = JSON.parse(JSON.stringify(rawQuestions));
    shuffle(currentQuestions);
    currentQuestions.forEach(q => shuffle(q.answerOptions));

    // 화면 전환
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    updateStatus();
    renderQuestion();
}

// 상단 프로그레스 바 및 점수 갱신
function updateStatus() {
    const total = currentQuestions.length;
    document.getElementById('question-count').innerText = `문제 ${currentIndex + 1} / ${total}`;
    document.getElementById('current-score').innerText = `현재 점수: ${score * 5}점`;
    
    const progressPercent = ((currentIndex) / total) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
}

// 한 문제 화면 렌더링
function renderQuestion() {
    isAnswered = false;
    const qData = currentQuestions[currentIndex];

    // 문제 및 힌트 셋팅
    document.getElementById('question-text').innerText = `Q${currentIndex + 1}. ${qData.question}`;
    
    const hintBox = document.getElementById('hint-box');
    hintBox.innerText = `💡 힌트: ${qData.hint}`;
    hintBox.style.display = 'none';

    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.style.display = 'none';
    feedbackBox.className = 'feedback-box';

    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'none';

    // 선택지 생성
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    qData.answerOptions.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `${String.fromCharCode(65 + optIdx)}. ${opt.text}`;
        btn.onclick = () => selectOption(optIdx);
        optionsContainer.appendChild(btn);
    });
}

// 힌트 토글
function toggleHint() {
    const hintBox = document.getElementById('hint-box');
    if (hintBox.style.display === 'none' || hintBox.style.display === '') {
        hintBox.style.display = 'block';
    } else {
        hintBox.style.display = 'none';
    }
}

// 답안 선택 처리 (즉시 채점)
function selectOption(selectedIndex) {
    if (isAnswered) return;
    isAnswered = true;

    const qData = currentQuestions[currentIndex];
    const selectedOpt = qData.answerOptions[selectedIndex];
    const optionBtns = document.querySelectorAll('.option-btn');
    const feedbackBox = document.getElementById('feedback-box');
    const nextBtn = document.getElementById('next-btn');

    // 모든 버튼 비활성화
    optionBtns.forEach(btn => btn.disabled = true);

    const isCorrect = selectedOpt.isCorrect;
    if (isCorrect) {
        score++;
        optionBtns[selectedIndex].classList.add('correct-choice');
        feedbackBox.className = 'feedback-box correct';
        feedbackBox.innerHTML = `
            <div class="rationale-title">🎉 정답입니다! (+5점)</div>
            <div>${selectedOpt.rationale}</div>
        `;
    } else {
        optionBtns[selectedIndex].classList.add('wrong-choice');
        // 정답 버튼 강조
        const correctIdx = qData.answerOptions.findIndex(o => o.isCorrect);
        if (correctIdx !== -1) {
            optionBtns[correctIdx].classList.add('correct-choice');
        }

        feedbackBox.className = 'feedback-box wrong';
        feedbackBox.innerHTML = `
            <div class="rationale-title">❌ 오답입니다.</div>
            <div style="margin-bottom: 6px;"><b>내가 선택한 보기의 해설:</b> ${selectedOpt.rationale}</div>
            <div><b>정답 이유:</b> ${qData.answerOptions[correctIdx].rationale}</div>
        `;
    }

    feedbackBox.style.display = 'block';
    updateStatus();

    // 결과 기록
    userResults.push({
        qNum: currentIndex + 1,
        question: qData.question,
        isCorrect: isCorrect
    });

    // 다음 문제 버튼 활성화
    if (currentIndex < currentQuestions.length - 1) {
        nextBtn.innerText = '다음 문제 ▶';
    } else {
        nextBtn.innerText = '최종 결과 보기 🏆';
    }
    nextBtn.style.display = 'block';
}

// 다음 문제 이동
function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        updateStatus();
        renderQuestion();
    } else {
        showResultScreen();
    }
}

// 최종 결과 화면 출력
function showResultScreen() {
    document.getElementById('quiz-screen').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';

    const finalScore = score * 5;
    document.getElementById('final-score-badge').innerText = `${finalScore}점`;
    document.getElementById('final-summary-text').innerText = `총 20문항 중 ${score}문항을 맞추셨습니다!`;

    // 문항별 맞춤 요약 리스트 생성
    const summaryList = document.getElementById('summary-list');
    summaryList.innerHTML = '';

    userResults.forEach(res => {
        const item = document.createElement('div');
        item.className = 'summary-item';
        
        const qTitle = res.question.length > 25 ? res.question.substring(0, 25) + '...' : res.question;
        const icon = res.isCorrect ? '<span style="color:var(--success); font-weight:bold;">O (정답)</span>' : '<span style="color:var(--danger); font-weight:bold;">X (오답)</span>';

        item.innerHTML = `
            <span>Q${res.qNum}. ${qTitle}</span>
            <span>${icon}</span>
        `;
        summaryList.appendChild(item);
    });
}

// 페이지가 로드되면 실행
window.onload = initQuiz;
</script>

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);

    let deck = [];          // 미공개 카드 (덱)
    let waste = [];         // 공개된 드로우 카드 더미
    let foundations = [[], [], [], []]; // 네 종류의 파운데이션 슬롯
    let tableaus = [[], [], [], [], [], [], []]; // 일곱 줄의 작업장 슬롯

    let drawCount = 3;      // 넘길 드로우 장 수 (1, 3, 5)
    let score = 0;
    let moves = 0;
    let seconds = 0;
    let timerId = null;
    let history = [];       // 실행 취소(Undo) 스택
    let activeDragData = null; // 드래그 중인 카드 정보들
    let isDrawingJustNow = false; // 드로우 직후 애니메이션 구분용 플래그

    // UI 요소들 캐싱
    const elScore = document.getElementById('score-val');
    const elMoves = document.getElementById('moves-val');
    const elTime = document.getElementById('time-val');
    const elDiffBadge = document.getElementById('difficulty-badge');
    const elDeckSlot = document.getElementById('deck-slot');
    const elDeckPile = document.getElementById('deck-pile');
    const elWastePile = document.getElementById('waste-pile');
    const elDiffModal = document.getElementById('difficulty-modal');
    const elVictModal = document.getElementById('victory-modal');
    const elToast = document.getElementById('toast');

    // 터치 이벤트를 처리하기 위한 상태
    let touchStartCard = null;
    let touchOffsetX = 0;
    let touchOffsetY = 0;
    let hasMovedDuringTouch = false;

    // --- 초기화 및 모달 관련 함수 ---

    function showDifficultyModal() {
      stopTimer();
      elDiffModal.classList.remove('hidden');
      elDiffModal.classList.add('flex');
    }

    // 새 게임 시작
    function startGame(difficulty) {
      drawCount = difficulty;
      elDiffModal.classList.add('hidden');
      elDiffModal.classList.remove('flex');
      elVictModal.classList.add('hidden');

      // 난이도 배지 갱신
      const textMap = { 1: '쉬움 (1-CARD)', 3: '보통 (3-CARD)', 5: '어려움 (5-CARD)' };
      elDiffBadge.textContent = textMap[difficulty];

      score = 0;
      moves = 0;
      seconds = 0;
      history = [];
      updateStatusDisplay();
      startTimer();

      buildAndShuffleDeck();

      // 타블로(7개 줄)에 카드 분배
      tableaus = [[], [], [], [], [], [], []];
      for (let i = 0; i < 7; i++) {
        for (let j = i; j < 7; j++) {
          const card = deck.pop();
          if (j === i) {
            card.faceUp = true;
          }
          tableaus[j].push(card);
        }
      }

      foundations = [[], [], [], []];
      waste = [];

      saveState();
      renderAll();
    }

    function buildAndShuffleDeck() {
      deck = [];
      SUITS.forEach(suit => {
        VALUES.forEach((val, index) => {
          deck.push({
            id: `card-${suit.name}-${val}`,
            suit: suit.name,
            symbol: suit.symbol,
            color: suit.color,
            value: val,
            rank: index + 1, // A=1, K=13
            faceUp: false
          });
        });
      });

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    // --- 타이머 기능 ---
    function startTimer() {
      stopTimer();
      seconds = 0;
      timerId = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        elTime.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // --- 실행 취소(Undo) 시스템 ---
    function saveState() {
      const state = {
        deck: JSON.parse(JSON.stringify(deck)),
        waste: JSON.parse(JSON.stringify(waste)),
        foundations: JSON.parse(JSON.stringify(foundations)),
        tableaus: JSON.parse(JSON.stringify(tableaus)),
        score: score,
        moves: moves
      };
      
      if (history.length > 50) history.shift();
      history.push(state);
    }

    function undo() {
      if (history.length <= 1) {
        showToast('실행 취소할 기록이 없습니다.');
        return;
      }
      
      history.pop(); 
      const prevState = history[history.length - 1];

      deck = JSON.parse(JSON.stringify(prevState.deck));
      waste = JSON.parse(JSON.stringify(prevState.waste));
      foundations = JSON.parse(JSON.stringify(prevState.foundations));
      tableaus = JSON.parse(JSON.stringify(prevState.tableaus));
      score = prevState.score;
      moves = prevState.moves;

      playCardSound();
      updateStatusDisplay();
      renderAll();
    }

    function updateStatusDisplay() {
      elScore.textContent = score;
      elMoves.textContent = moves;
    }

    function showToast(msg) {
      elToast.textContent = msg;
      elToast.classList.remove('opacity-0', 'pointer-events-none');
      elToast.classList.add('opacity-100');
      setTimeout(() => {
        elToast.classList.remove('opacity-100');
        elToast.classList.add('opacity-0', 'pointer-events-none');
      }, 1800);
    }

    // --- 카드의 완성도를 극대화하는 벡터 그래픽 (모든 슬롯 비율 일치) ---
    function getCardHTML(card, indexOffset = 0, isPlayable = false, triggerAnimate = false) {
      if (!card.faceUp) {
        return `
          <div class="game-card flex flex-col items-center justify-center border-2 border-[#d4af37] bg-gradient-to-br from-[#1c1c1c] via-[#090909] to-[#242424] h-full"
               style="transform: translateY(${indexOffset}px);"
               data-card-id="${card.id}">
            <div class="w-[88%] h-[88%] border border-[#d4af37]/40 rounded-md flex flex-col items-center justify-between p-1.5 sm:p-2 relative">
              <div class="absolute inset-2 border border-[#d4af37]/20 flex items-center justify-center">
                <svg width="34" height="34" viewBox="0 0 100 100" class="text-[#d4af37]">
                  <polygon points="50,15 85,50 50,85 15,50" stroke="#d4af37" stroke-width="3" fill="none"/>
                  <polygon points="50,5 95,50 50,95 5,50" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
                  <circle cx="50" cy="50" r="16" stroke="#d4af37" stroke-width="2" fill="none"/>
                  <path d="M50,5 L50,95 M5,50 L95,50" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
                </svg>
              </div>
              <div class="w-full flex justify-between text-[10px] text-[#d4af37]/40 font-bold">
                <span>♠</span><span>♦</span>
              </div>
              <div class="w-full flex justify-between text-[10px] text-[#d4af37]/40 font-bold rotate-180">
                <span>♠</span><span>♦</span>
              </div>
            </div>
          </div>
        `;
      }

      const isRed = card.color === 'red';
      const colorClass = isRed ? 'text-[#ffcc33]' : 'text-[#e5c158]';
      const valColor = isRed ? 'text-amber-500' : 'text-stone-300';
      const suitSymbol = card.symbol;

      let centerSuits = '';
      if (['J', 'Q', 'K'].includes(card.value)) {
        centerSuits = `
          <div class="flex items-center justify-center w-full h-full text-3xl opacity-80 filter drop-shadow">
            <span class="text-amber-600 font-extrabold border border-amber-600/30 px-1.5 py-0.5 rounded">${card.value}</span>
          </div>
        `;
      } else {
        centerSuits = `<div class="text-3xl filter drop-shadow-md text-[#d4af37]">${suitSymbol}</div>`;
      }

      const animateClass = triggerAnimate ? 'animate-draw' : '';

      return `
        <div id="${card.id}" 
             class="game-card flex flex-col justify-between p-1.5 sm:p-2 border-2 border-[#d4af37] bg-gradient-to-br from-[#111111] to-[#252525] h-full ${animateClass}"
             style="transform: translateY(${indexOffset}px);"
             draggable="${isPlayable}"
             data-card-id="${card.id}"
             onclick="handleCardClick('${card.id}', event)">
          
          <div class="flex justify-between items-start leading-none">
            <div class="flex flex-col items-center">
              <span class="text-xs sm:text-sm font-black tracking-tighter ${valColor}">${card.value}</span>
              <span class="text-[10px] sm:text-xs ${colorClass}">${suitSymbol}</span>
            </div>
            <span class="text-[8px] text-[#d4af37]/40 font-mono">Luxe</span>
          </div>

          <div class="flex-1 flex items-center justify-center">
            ${centerSuits}
          </div>

          <div class="flex justify-between items-end leading-none rotate-180">
            <div class="flex flex-col items-center">
              <span class="text-xs sm:text-sm font-black tracking-tighter ${valColor}">${card.value}</span>
              <span class="text-[10px] sm:text-xs ${colorClass}">${suitSymbol}</span>
            </div>
            <span class="text-[8px] text-[#d4af37]/40 font-mono">Luxe</span>
          </div>
        </div>
      `;
    }

    // --- 드로우 및 덱 관련 동작 ---

    elDeckSlot.addEventListener('click', (e) => {
      if (e.target.closest('#deck-pile') || e.target.id === 'deck-slot') {
        handleDeckDraw();
      }
    });

    function handleDeckDraw() {
      saveState();

      if (deck.length === 0) {
        if (waste.length === 0) {
          showToast('덱이 완전히 비어 있습니다.');
          return;
        }
        deck = waste.reverse().map(c => {
          c.faceUp = false;
          return c;
        });
        waste = [];
        score = Math.max(0, score - 50);
        playCardSound();
      } else {
        const popCount = Math.min(deck.length, drawCount);
        const drawn = [];
        for (let i = 0; i < popCount; i++) {
          const card = deck.pop();
          card.faceUp = true;
          drawn.push(card);
        }
        waste.push(...drawn);
        score += 5;
        isDrawingJustNow = true; // 애니메이션 적용 활성화
        playCardSound();
      }

      moves++;
      updateStatusDisplay();
      renderAll();
      isDrawingJustNow = false; // 일회성 처리 후 비활성화
    }

    // --- 드래그 앤 드롭 구현부 (트랜지션 끄기 최적화 포함) ---

    function setupCardDragEvents(element, cardObj, location) {
      element.addEventListener('dragstart', (e) => {
        if (!cardObj.faceUp) {
          e.preventDefault();
          return;
        }

        activeDragData = {
          card: cardObj,
          from: location,
          childCards: []
        };

        if (location.type === 'tableau') {
          const tabIndex = location.index;
          const cardIdx = tableaus[tabIndex].findIndex(c => c.id === cardObj.id);
          activeDragData.childCards = tableaus[tabIndex].slice(cardIdx + 1);
        }

        e.dataTransfer.setData('text/plain', cardObj.id);
        e.dataTransfer.effectAllowed = 'move';
        
        // 드래그 시 반응성을 가미하기 위해 트랜지션 해제 및 투명화
        element.classList.add('dragging');

        const ghost = document.getElementById('drag-ghost');
        e.dataTransfer.setDragImage(ghost, 0, 0);
      });

      element.addEventListener('dragend', () => {
        element.classList.remove('dragging');
        activeDragData = null;
      });

      // 모바일 등을 위한 터치 이벤트를 동시에 구축
      setupTouchEvents(element, cardObj, location);
    }

    // 터치 기기를 위한 고품격 슬라이딩 드래그 시뮬레이터
    function setupTouchEvents(element, cardObj, location) {
      let visualClone = null;

      element.addEventListener('touchstart', (e) => {
        if (!cardObj.faceUp) return;

        const touch = e.touches[0];
        const rect = element.getBoundingClientRect();
        
        touchOffsetX = touch.clientX - rect.left;
        touchOffsetY = touch.clientY - rect.top;
        hasMovedDuringTouch = false;

        touchStartCard = { element, cardObj, location };

        activeDragData = {
          card: cardObj,
          from: location,
          childCards: []
        };
        if (location.type === 'tableau') {
          const tabIdx = location.index;
          const cardIdx = tableaus[tabIdx].findIndex(c => c.id === cardObj.id);
          activeDragData.childCards = tableaus[tabIdx].slice(cardIdx + 1);
        }

        visualClone = element.cloneNode(true);
        visualClone.style.position = 'fixed';
        visualClone.style.width = `${rect.width}px`;
        visualClone.style.height = `${rect.height}px`;
        visualClone.style.left = `${rect.left}px`;
        visualClone.style.top = `${rect.top}px`;
        visualClone.style.zIndex = '9999';
        visualClone.style.pointerEvents = 'none';
        visualClone.style.opacity = '0.95';
        visualClone.style.transform = 'none';
        visualClone.style.transition = 'none';
        document.body.appendChild(visualClone);

        element.style.opacity = '0.25';
        e.stopPropagation();
      }, { passive: false });

      element.addEventListener('touchmove', (e) => {
        if (!touchStartCard || !visualClone) return;
        const touch = e.touches[0];
        hasMovedDuringTouch = true;
        
        const newX = touch.clientX - touchOffsetX;
        const newY = touch.clientY - touchOffsetY;
        
        visualClone.style.left = `${newX}px`;
        visualClone.style.top = `${newY}px`;
        
        e.preventDefault();
      }, { passive: false });

      element.addEventListener('touchend', (e) => {
        if (!touchStartCard || !visualClone) return;

        element.style.opacity = '1';
        
        const touch = e.changedTouches[0];
        visualClone.style.display = 'none';
        const dropTargetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        visualClone.remove();
        visualClone = null;

        // 터치 시작 후 움직임이 매우 미미한 경우는 단순 '원터치 자동이동'으로 인식 유도
        if (!hasMovedDuringTouch) {
          handleCardClick(cardObj.id);
          touchStartCard = null;
          activeDragData = null;
          return;
        }

        if (dropTargetElement) {
          const tableauSlot = dropTargetElement.closest('.tableau-slot');
          const foundSlot = dropTargetElement.closest('.foundation-slot');
          let handled = false;

          if (tableauSlot) {
            const index = parseInt(tableauSlot.id.replace('tableau-', ''));
            handled = tryMoveToTableau(activeDragData, index);
          } else if (foundSlot) {
            const index = parseInt(foundSlot.id.replace('foundation-', ''));
            handled = tryMoveToFoundation(activeDragData, index);
          } else {
            const targetCardEl = dropTargetElement.closest('.game-card');
            if (targetCardEl) {
              const targetCardId = targetCardEl.dataset.cardId;
              
              let foundIndex = -1;
              for (let i = 0; i < 7; i++) {
                if (tableaus[i].some(c => c.id === targetCardId)) {
                  foundIndex = i;
                  break;
                }
              }
              if (foundIndex !== -1) {
                handled = tryMoveToTableau(activeDragData, foundIndex);
              } else {
                for (let i = 0; i < 4; i++) {
                  if (foundations[i].some(c => c.id === targetCardId)) {
                    handled = tryMoveToFoundation(activeDragData, i);
                    break;
                  }
                }
              }
            }
          }

          if (!handled) {
            showToast('여기에 카드를 놓을 수 없습니다.');
          }
        }

        touchStartCard = null;
        activeDragData = null;
        renderAll();
      });
    }

    function registerDropSlots() {
      document.querySelectorAll('.tableau-slot').forEach((slot, index) => {
        slot.addEventListener('dragover', (e) => { e.preventDefault(); });
        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          if (activeDragData) {
            const success = tryMoveToTableau(activeDragData, index);
            if (!success) showToast('유효하지 않은 이적입니다.');
            renderAll();
          }
        });
      });

      document.querySelectorAll('.foundation-slot').forEach((slot, index) => {
        slot.addEventListener('dragover', (e) => { e.preventDefault(); });
        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          if (activeDragData) {
            const success = tryMoveToFoundation(activeDragData, index);
            if (!success) showToast('기초대 수집 룰에 어긋납니다.');
            renderAll();
          }
        });
      });
    }

    // --- 원터치 (Single Tap / Click) 스마트 이동 메커니즘 ---

    function handleCardClick(cardId, event) {
      if (event) {
        // 드래그와의 충돌을 완화하기 위해 이벤트 캡처 차단
        event.stopPropagation();
      }

      let cardObj = null;
      let fromData = null;
      let childCards = [];

      // 1. 웨이스트 더미 최상위 카드인지 수색
      if (waste.length > 0 && waste[waste.length - 1].id === cardId) {
        cardObj = waste[waste.length - 1];
        fromData = { type: 'waste' };
      }

      // 2. 타블로의 최상단 기둥들 중 정면 노출된 열인지 수색
      if (!cardObj) {
        for (let i = 0; i < 7; i++) {
          const tab = tableaus[i];
          const idx = tab.findIndex(c => c.id === cardId);
          if (idx !== -1 && tab[idx].faceUp) {
            cardObj = tab[idx];
            fromData = { type: 'tableau', index: i };
            childCards = tab.slice(idx + 1);
            break;
          }
        }
      }

      // 3. 파운데이션에 안착되어있던 카드를 내려오게 하려는 경우
      if (!cardObj) {
        for (let i = 0; i < 4; i++) {
          const f = foundations[i];
          if (f.length > 0 && f[f.length - 1].id === cardId) {
            cardObj = f[f.length - 1];
            fromData = { type: 'foundation', index: i };
            break;
          }
        }
      }

      if (!cardObj) return;

      const clickDragData = {
        card: cardObj,
        from: fromData,
        childCards: childCards
      };

      // [우선순위 1] 파운데이션(수집기)으로의 자동 탐색 (단, 딸린 카드가 없는 단일장 상태일 때만)
      if (childCards.length === 0) {
        for (let i = 0; i < 4; i++) {
          if (tryMoveToFoundation(clickDragData, i)) {
            renderAll();
            return;
          }
        }
      }

      // [우선순위 2] 타블로(열) 영역으로의 자동 안착 가능한 곳 탐색
      for (let i = 0; i < 7; i++) {
        // 자신의 현재 기둥 위치는 당연히 스킵
        if (fromData.type === 'tableau' && fromData.index === i) continue;
        
        if (tryMoveToTableau(clickDragData, i)) {
          renderAll();
          return;
        }
      }

      // 어디에도 갈 곳이 없는 경우 작게 알림
      showToast('이동할 수 있는 적합한 장소가 없습니다.');
    }

    // --- 무브 규칙 유효성 평가 검증 ---

    function tryMoveToTableau(dragData, targetIndex) {
      const movingCard = dragData.card;
      const targetColumn = tableaus[targetIndex];
      const targetTopCard = targetColumn[targetColumn.length - 1];

      let isValid = false;

      if (!targetTopCard) {
        if (movingCard.value === 'K') {
          isValid = true;
        }
      } else {
        const isColorContrast = movingCard.color !== targetTopCard.color;
        const isOneRankLower = targetTopCard.rank - movingCard.rank === 1;

        if (isColorContrast && isOneRankLower) {
          isValid = true;
        }
      }

      if (isValid) {
        saveState();
        executeMove(dragData, 'tableau', targetIndex);
        score += 10;
        playCardSound();
        checkGameVictory();
        return true;
      }
      return false;
    }

    function tryMoveToFoundation(dragData, targetIndex) {
      if (dragData.childCards.length > 0) return false;

      const movingCard = dragData.card;
      const targetPile = foundations[targetIndex];
      const slotElement = document.getElementById(`foundation-${targetIndex}`);
      const targetSuit = slotElement.dataset.suit;

      if (movingCard.suit !== targetSuit) return false;

      let isValid = false;

      if (targetPile.length === 0) {
        if (movingCard.value === 'A') isValid = true;
      } else {
        const topCard = targetPile[targetPile.length - 1];
        if (movingCard.rank - topCard.rank === 1) isValid = true;
      }

      if (isValid) {
        saveState();
        executeMove(dragData, 'foundation', targetIndex);
        score += 20;
        playCardSound();
        checkGameVictory();
        return true;
      }
      return false;
    }

    function executeMove(dragData, targetType, targetIdx) {
      const { card, from, childCards } = dragData;

      if (from.type === 'waste') {
        waste.pop();
      } else if (from.type === 'tableau') {
        const sourceIdx = from.index;
        const cutIndex = tableaus[sourceIdx].findIndex(c => c.id === card.id);
        tableaus[sourceIdx].splice(cutIndex);

        if (tableaus[sourceIdx].length > 0) {
          const lastCard = tableaus[sourceIdx][tableaus[sourceIdx].length - 1];
          if (!lastCard.faceUp) {
            lastCard.faceUp = true;
            score += 5;
          }
        }
      } else if (from.type === 'foundation') {
        foundations[from.index].pop();
      }

      const cardsToInsert = [card, ...childCards];

      if (targetType === 'tableau') {
        tableaus[targetIdx].push(...cardsToInsert);
      } else if (targetType === 'foundation') {
        foundations[targetIdx].push(...cardsToInsert);
      }

      moves++;
      updateStatusDisplay();
    }

    function checkGameVictory() {
      const totalCollected = foundations.reduce((acc, current) => acc + current.length, 0);
      if (totalCollected === 52) {
        stopTimer();
        playSuccessSound();

        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        document.getElementById('victory-time').textContent = `${mins}:${secs}`;
        document.getElementById('victory-moves').textContent = moves;
        document.getElementById('victory-score').textContent = score;

        setTimeout(() => {
          elVictModal.classList.remove('hidden');
        }, 500);
      }
    }

    // --- 렌더링 엔진 (동적 모션 바인딩 포함) ---

    function renderAll() {
      renderDeck();
      renderWaste();
      renderFoundations();
      renderTableaus();
      registerDropSlots();
    }

    function renderDeck() {
      if (deck.length === 0) {
        elDeckPile.innerHTML = '';
      } else {
        elDeckPile.innerHTML = `
          <div class="game-card flex flex-col items-center justify-center border-2 border-[#d4af37] bg-gradient-to-br from-[#1c1c1c] via-[#090909] to-[#242424] h-full shadow-md">
            <div class="w-[88%] h-[88%] border border-[#d4af37]/30 rounded-md flex items-center justify-center relative">
              <span class="text-[#d4af37] text-sm font-serif">♠</span>
              <span class="absolute bottom-1 right-1 text-[8px] text-gray-500 font-mono font-bold">${deck.length}</span>
            </div>
          </div>
        `;
      }
    }

    function renderWaste() {
      elWastePile.innerHTML = '';
      if (waste.length === 0) return;

      const visibleCount = Math.min(waste.length, 3);
      const startIndex = waste.length - visibleCount;

      for (let i = startIndex; i < waste.length; i++) {
        const card = waste[i];
        const isTop = (i === waste.length - 1);
        
        // 겹쳐진 카드 연출 (모든 디바이스 사이즈 대응형 상대 비율 오프셋 제공)
        const offsetLeft = (i - startIndex) * 14; 

        const cardEl = document.createElement('div');
        cardEl.className = 'absolute w-full h-full';
        cardEl.style.left = `${offsetLeft}px`;
        
        // 새로 드로우된 장일 때 우아한 진입 애니메이션 탑재
        const animateFlag = (isDrawingJustNow && isTop);
        cardEl.innerHTML = getCardHTML(card, 0, isTop, animateFlag);

        const innerCard = cardEl.firstElementChild;
        if (isTop) {
          setupCardDragEvents(innerCard, card, { type: 'waste' });
        }
        elWastePile.appendChild(cardEl);
      }
    }

    function renderFoundations() {
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById(`foundation-${i}`);
        const existingCards = slot.querySelectorAll('.game-card');
        existingCards.forEach(c => c.remove());

        const pile = foundations[i];
        if (pile.length > 0) {
          const topCard = pile[pile.length - 1];
          const cardHTML = getCardHTML(topCard, 0, true);
          const wrapper = document.createElement('div');
          wrapper.innerHTML = cardHTML;
          const cardEl = wrapper.firstElementChild;

          setupCardDragEvents(cardEl, topCard, { type: 'foundation', index: i });
          slot.appendChild(cardEl);
        }
      }
    }

    function renderTableaus() {
      for (let i = 0; i < 7; i++) {
        const slot = document.getElementById(`tableau-${i}`);
        slot.innerHTML = '';

        const pile = tableaus[i];
        if (pile.length === 0) {
          slot.classList.add('border-2');
          continue;
        } else {
          slot.classList.remove('border-2');
        }

        pile.forEach((card, idx) => {
          const stepOffset = window.innerWidth < 640 ? 15 : 22; 
          const yPosition = idx * stepOffset;

          const wrapper = document.createElement('div');
          const isPlayable = card.faceUp;
          wrapper.innerHTML = getCardHTML(card, yPosition, isPlayable);

          const cardEl = wrapper.firstElementChild;
          if (isPlayable) {
            setupCardDragEvents(cardEl, card, { type: 'tableau', index: i });
          }

          slot.appendChild(cardEl);
        });
      }
    }

    // --- 최초 실행 트리거 ---
    window.onload = function() {
      showDifficultyModal();
    };
  </script>

://cdn.esahubble.org/archives/images/screen/heic0512d.jpg</p><p class="attribution__title">Source: <a href="https://esahubble.org/images/heic0512d/" target="_blank" class="attribution__link">esahubble.org</a></p></div></li></ul></div></div><div class="slide-container slide-attributions" id="slide-attributions-2"><h2 class="slide-title">Image Sources</h2><div class="content-area"><ul class="attribution-list"><li class="attribution-list__item"><div class="attribution__thumbnail"><img class="attribution__thumbnail__image" src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcS71EVzRtlNO6mqbuuaT8Lj6A5IL0lYsF_HwTME8ILBA9ohRQuMYH8TeduWzeLy" alt="Thumbnail for www.eso.org"></div><div class="attribution__details"><p class="attribution__raw-url">https://cdn.eso.org/images/large/eso0932a.jpg</p><p class="attribution__title">Source: <a href="https://www.eso.org/public/images/eso0932a/" target="_blank" class="attribution__link">www.eso.org</a></p></div></li></ul></div></div></div></div><script>
/**
 * Fetches an image blob using a method that attempts to bypass CORS issues
 * by adding 'alr=yes' to the URL and following redirects.
 */
async function fetchFifeImageBlobUsingAlr(urlString) {
  if (urlString.startsWith('blob:') || urlString.startsWith('data:')) {
      throw new Error('Input URL is already a blob or data URL.');
  }
  let url = new URL(urlString, window.location.href);
  url.searchParams.set('alr', 'yes');
  for (let i = 0; i < 5; i++) {
      const response = await fetch(url.toString(), { credentials: 'include' });
      if (!response.ok) throw new Error(`Fetch received not OK response: ${response.status}`);
      if (!response.headers.get('content-type')?.startsWith('text/plain')) {
          const blob = await response.blob();
          if (blob.size > 0 && blob.type.startsWith('image/')) return blob;
          // This will now correctly throw an error for non-image types like fonts.
          else throw new Error('Fetched blob is not a valid image.');
      }
      url = new URL(await response.text());
  }
  throw new Error('Exceeded maximum number of redirects.');
}

async function updateImageSourcesUsingAlr() {
  // Get all img elements on the page.
  const allImages = Array.from(document.querySelectorAll('img'));

  // Use Promise.all to handle all updates concurrently for better performance.
  await Promise.all(allImages.map(async (img) => {
    // Only proceed if the img tag has a valid 'src' attribute with a
    // googleusercontent URL.
    if (img.src && img.src.includes('googleusercontent')) {
      try {
        const blob = await fetchFifeImageBlobUsingAlr(img.src);
        // Create a new URL from the Blob and set it as the image's source.
        img.src = URL.createObjectURL(blob);
      } catch (error) {
        // Do nothing.
      }
    }
  }));
}

async function updateBackgroundImagesUsingAlr() {
  // Find all elements with a googleusercontent background image.
  const elementsToProcess = document.querySelectorAll('[style*="googleusercontent"]');
  const urlRegex = /url\((['"]?)(https?:\/\/.*?googleusercontent.*?)\1\)/;

  if (elementsToProcess.length > 0) {

      const promises = Array.from(elementsToProcess).map(element => {
          return new Promise(async (resolve) => {
              const style = element.style.backgroundImage;
              const match = style.match(urlRegex);

              if (match && match[2]) {
                  const originalUrl = match[2];
                  try {
                      const blob = await fetchFifeImageBlobUsingAlr(originalUrl);
                      const blobUrl = URL.createObjectURL(blob);

                      // Directly update the element's style property.
                      const newBackgroundImage = style.replace(originalUrl, blobUrl);
                      element.style.backgroundImage = newBackgroundImage;
                  } catch (error) {
                      // Do nothing.
                  }
              }
              resolve();
          });
      });

      // Wait for all images to be processed.
      await Promise.all(promises);
  }
}

document.addEventListener('DOMContentLoaded', async function() {
    await Promise.all([
      updateImageSourcesUsingAlr(),
      updateBackgroundImagesUsingAlr()
    ]);
    initializeSlideshowUI();
});

// --- SLIDESHOW LOGIC ---
function initializeSlideshowUI() {
    const slides = document.querySelectorAll('.slide-container');
    const prevButton = document.getElementById('prev-slide');
    const nextButton = document.getElementById('next-slide');
    const slideCounter = document.getElementById('slide-counter');
    let currentSlide = 0;

    function updateUI() {
        slides.forEach((slide, index) => {
            slide.classList.toggle('active', index === currentSlide);
        });
        prevButton.disabled = currentSlide === 0;
        nextButton.disabled = currentSlide === slides.length - 1;
        slideCounter.textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
    }

    function showNextSlide() {
        if (currentSlide < slides.length - 1) {
            currentSlide++;
            updateUI();
        }
    }

    function showPrevSlide() {
        if (currentSlide > 0) {
            currentSlide--;
            updateUI();
        }
    }

    nextButton.addEventListener('click', showNextSlide);
    prevButton.addEventListener('click', showPrevSlide);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') showNextSlide();
        else if (e.key === 'ArrowLeft') showPrevSlide();
    });

    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const htmlEl = document.documentElement;

    function setTheme(isDark) {
        htmlEl.classList.toggle('dark', isDark);
        darkIcon.classList.toggle('hidden', isDark);
        lightIcon.classList.toggle('hidden', !isDark);
        localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
    }
    const isDarkMode = localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(isDarkMode);
    themeToggleBtn.addEventListener('click', () => setTheme(!htmlEl.classList.contains('dark')));

    function updateScale() {
        const baseWidth = 1280;
        const baseHeight = 720;
        const slideshowWrapper = document.getElementById('slideshow-wrapper');
        const slideshowHolder = document.getElementById('slideshow-holder');

        // The available space is the dimensions of the holder div.
        const availableWidth = slideshowHolder.clientWidth;
        const availableHeight = slideshowHolder.clientHeight;

        // Calculate the scale ratio based on both width and height
        const scaleX = availableWidth / baseWidth;
        const scaleY = availableHeight / baseHeight;

        // Use the smaller of the two ratios to ensure it fits
        const finalScale = Math.min(scaleX, scaleY);

        slideshowWrapper.style.setProperty('--scale-factor', finalScale);
    }

    updateUI();
    updateScale();
    window.addEventListener('resize', updateScale);
}

            if (el_tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "🏫 숭의여자중학교 오늘의 급식",
                    items: [{ name: "🏫 숭의여자중학교 오늘의 급식", type: 'html', data: el_tmpl_meal_app.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 파일 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

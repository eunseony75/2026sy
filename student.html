        // App State
        let currentQuestionIdx = 0;
        let userAnswers = Array(questions.length).fill(null);
        let examStarted = false;
        let secondsElapsed = 0;
        let timerInterval = null;

        // Start Exam
        function startExam() {
            document.getElementById('intro-card').classList.add('hidden');
            document.getElementById('exam-container').classList.remove('hidden');
            examStarted = true;
            secondsElapsed = 0;
            startTimer();
            loadQuestion(0);
        }

        // Timer
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer-text').innerHTML = `<i class="fa-regular fa-clock mr-1 text-blue-500"></i>${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // Load Question
        function loadQuestion(index) {
            currentQuestionIdx = index;
            const q = questions[index];

            // Progress Update
            document.getElementById('progress-text').innerText = `문제 ${index + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((index + 1) / questions.length) * 100}%`;

            // Text Update
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-text').innerText = `${q.id}. ${q.question}`;

            // Optional box update
            const boxEl = document.getElementById('question-box');
            if (q.box) {
                boxEl.innerText = q.box;
                boxEl.classList.remove('hidden');
            } else {
                boxEl.classList.add('hidden');
            }

            // Choices list
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            
            q.choices.forEach((choice, choiceIdx) => {
                const isSelected = userAnswers[index] === choiceIdx;
                
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3 ${
                    isSelected 
                    ? 'border-blue-600 bg-blue-50/50 text-blue-900 font-medium shadow-sm' 
                    : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700'
                }`;
                btn.onclick = () => selectChoice(choiceIdx);

                // Option Circle
                const numCircle = document.createElement('span');
                numCircle.className = `w-6 h-6 rounded-full flex items-center justify-center text-xs border ${
                    isSelected 
                    ? 'bg-blue-600 border-blue-600 text-white' 
                    : 'border-slate-300 bg-white text-slate-500'
                }`;
                numCircle.innerText = choiceIdx + 1;

                // Option Text
                const textSpan = document.createElement('span');
                textSpan.className = 'flex-1 text-sm sm:text-base';
                textSpan.innerText = choice;

                btn.appendChild(numCircle);
                btn.appendChild(textSpan);
                container.appendChild(btn);
            });

            // Navigation State
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('prev-btn').style.opacity = index === 0 ? '0.5' : '1';

            const nextBtn = document.getElementById('next-btn');
            if (index === questions.length - 1) {
                nextBtn.innerHTML = `제출하기 <i class="fa-solid fa-paper-plane ml-1 text-xs"></i>`;
                nextBtn.className = "px-5 py-2.5 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition font-medium flex items-center gap-2 shadow-sm shadow-emerald-500/10";
            } else {
                nextBtn.innerHTML = `다음 <i class="fa-solid fa-chevron-right text-xs"></i>`;
                nextBtn.className = "px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-medium flex items-center gap-2 shadow-sm shadow-blue-500/10";
            }
        }

        // Selection
        function selectChoice(choiceIdx) {
            userAnswers[currentQuestionIdx] = choiceIdx;
            loadQuestion(currentQuestionIdx);
        }

        // Previous
        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                loadQuestion(currentQuestionIdx - 1);
            }
        }

        function nextQuestion() {
            if (currentQuestionIdx < questions.length - 1) {
                loadQuestion(currentQuestionIdx + 1);
            } else {
                submitExam();
            }
        }

        // Submit Logic
        function submitExam() {
            const unanswered = userAnswers.map((ans, idx) => ans === null ? idx + 1 : null).filter(val => val !== null);
            if (unanswered.length > 0) {
                alertModal(`아직 풀지 않은 문제가 있습니다!\n(미답변 문항: ${unanswered.join(', ')}번)\n\n모든 문제의 답안을 선택하고 다시 제출해 주세요.`);
                return;
            }

            stopTimer();
            calculateResults();
        }

        // Custom Modal Alert
        function alertModal(message) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 text-center animate-in fade-in zoom-in duration-200">
                    <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    </div>
                    <p class="text-slate-700 text-sm whitespace-pre-line leading-relaxed mb-6">${message}</p>
                    <button id="modal-close-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition text-sm">확인</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('modal-close-btn').focus();
            document.getElementById('modal-close-btn').onclick = () => {
                modal.remove();
            };
        }

        // Results Calculation
        let score = 0;
        let correctCount = 0;

        function calculateResults() {
            correctCount = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) {
                    correctCount++;
                }
            });

            score = Math.round((correctCount / questions.length) * 100);

            document.getElementById('exam-container').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');

            document.getElementById('score-text').innerText = `${score}점`;
            document.getElementById('result-summary').innerText = `총 20문제 중 ${correctCount}문제를 맞췄고, ${questions.length - correctCount}문제를 틀렸습니다. (소요시간 ${Math.floor(secondsElapsed / 60)}분 ${secondsElapsed % 60}초)`;
        }

        // Restart Exam
        function restartExam() {
            userAnswers = Array(questions.length).fill(null);
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('review-section').classList.add('hidden');
            startExam();
        }

        // Show review explanations
        function showReviewList() {
            document.getElementById('review-section').classList.remove('hidden');
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            questions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correct;
                const userChoiceStr = userAnswers[idx] !== null ? `${userAnswers[idx] + 1}번. ${q.choices[userAnswers[idx]]}` : '미선택';
                const correctChoiceStr = `${q.correct + 1}번. ${q.choices[q.correct]}`;

                const card = document.createElement('div');
                card.className = `bg-white rounded-xl border p-5 transition-all shadow-sm ${
                    isCorrect ? 'border-emerald-200' : 'border-red-200'
                }`;

                const header = document.createElement('div');
                header.className = "flex justify-between items-start gap-4 mb-3";
                
                const title = document.createElement('h4');
                title.className = "font-bold text-slate-900 leading-snug";
                title.innerText = `${q.id}번 [${q.category}]`;

                const badge = document.createElement('span');
                badge.className = `px-2.5 py-1 rounded text-xs font-bold ${
                    isCorrect ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'
                }`;
                badge.innerHTML = isCorrect 
                    ? '<i class="fa-solid fa-circle-check mr-1"></i>정답' 
                    : '<i class="fa-solid fa-circle-xmark mr-1"></i>오답';

                header.appendChild(title);
                header.appendChild(badge);
                card.appendChild(header);

                const bodyText = document.createElement('p');
                bodyText.className = "text-sm text-slate-700 font-medium mb-3";
                bodyText.innerText = q.question;
                card.appendChild(bodyText);

                if (q.box) {
                    const qBox = document.createElement('div');
                    qBox.className = "mb-3 bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs font-mono text-slate-600 whitespace-pre-line leading-relaxed";
                    qBox.innerText = q.box;
                    card.appendChild(qBox);
                }

                const resComp = document.createElement('div');
                resComp.className = "space-y-1 text-xs mb-4 p-3 bg-slate-50 rounded-lg border border-slate-100";
                resComp.innerHTML = `
                    <div class="flex"><span class="w-16 font-semibold text-slate-500">내가 고른 답:</span> <span class="${isCorrect ? 'text-emerald-600 font-medium' : 'text-red-500 font-medium'}">${userChoiceStr}</span></div>
                    <div class="flex"><span class="w-16 font-semibold text-slate-500">올바른 정답:</span> <span class="text-blue-600 font-medium">${correctChoiceStr}</span></div>
                `;
                card.appendChild(resComp);

                const explanationBlock = document.createElement('div');
                explanationBlock.className = "text-xs leading-relaxed space-y-2 border-t border-slate-100 pt-3 text-slate-600";
                
                explanationBlock.innerHTML += `
                    <div>
                        <span class="inline-block px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded font-semibold mr-1.5">정답 해설</span>
                        ${q.explanation}
                    </div>
                `;

                let wrongItemsHtml = '';
                q.choices.forEach((choice, choiceIdx) => {
                    if (choiceIdx !== q.correct) {
                        const wrongExplText = q.wrongExplanations[choiceIdx < q.correct ? choiceIdx : choiceIdx - 1] || "옳지 않은 보기입니다.";
                        wrongItemsHtml += `
                            <li class="pl-4 relative before:content-['•'] before:absolute before:left-1 before:text-slate-400">
                                <span class="font-medium text-slate-700">${choiceIdx + 1}번 보기:</span> ${wrongExplText}
                            </li>
                        `;
                    }
                });

                explanationBlock.innerHTML += `
                    <div class="mt-2">
                        <span class="inline-block px-1.5 py-0.5 bg-red-50 text-red-500 rounded font-semibold mr-1.5">오답 보기 분석</span>
                        <ul class="space-y-1 mt-1 text-slate-500">
                            ${wrongItemsHtml}
                        </ul>
                    </div>
                `;

                card.appendChild(explanationBlock);
                container.appendChild(card);
            });

            document.getElementById('review-section').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>네온 테트리스 (Neon Tetris)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d0e15;

        }

        #game-container {
            position: relative;

        }
        /* 태블릿/모바일용 터치 컨트롤러 */
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
            padding: 0 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #3d4360;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }
        .empty-cell {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>NEON TETRIS</h1>
    <div id="score-board">Score: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="tetris" width="240" height="480"></canvas>
    </div>

    <div id="controls">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-rotate">↻</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="empty-cell"></div>
        <div class="btn" id="btn-down">▼</div>
        <div class="empty-cell"></div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // 게임 설정
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 24;
        
        ctx.scale(BLOCK_SIZE, BLOCK_SIZE);

        // 네온 색상 팔레트
        const COLORS = [
            null,
            '#00f0ff', // I - Cyan
            '#0033ff', // J - Blue
            '#ff9900', // L - Orange
            '#ffe600', // O - Yellow
            '#00ff00', // S - Green
            '#9900ff', // T - Purple
            '#ff007f'  // Z - Red
        ];

        // 테트로미노 형태 정의
        const PIECES = [
            [],
            [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]], // I
            [[0, 2, 0], [0, 2, 0], [2, 2, 0]], // J
            [[0, 3, 0], [0, 3, 0], [0, 3, 3]], // L
            [[4, 4], [4, 4]], // O
            [[0, 5, 5], [5, 5, 0], [0, 0, 0]], // S
            [[0, 0, 0], [6, 6, 6], [0, 6, 0]], // T
            [[7, 7, 0], [0, 7, 7], [0, 0, 0]]  // Z
        ];

        let board = createMatrix(COLS, ROWS);
        let score = 0;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
        };

        // 배열(매트릭스) 생성
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // 블록 충돌 감지
        function collide(board, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 보드에 블록 병합
        function merge(board, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        board[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 완성된 줄 제거 및 점수 획득
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = board.length - 1; y >= 0; --y) {
                for (let x = 0; x < board[y].length; ++x) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                ++y;

                score += rowCount * 100;
                rowCount *= 2;
            }
            scoreElement.innerText = score;
        }

        // 블록 그리기
        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = COLORS[value];
                        // 네온 효과 설정
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = COLORS[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // 테두리 강조
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        ctx.lineWidth = 0.05;
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // 전체 화면 그리기
        function draw() {
            ctx.fillStyle = '#12131c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(board, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        // 플레이어 블록 하강
        function playerDrop() {
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        // 플레이어 좌우 이동
        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(board, player)) {
                player.pos.x -= dir;
            }
        }

        // 새로운 블록 생성
        function playerReset() {
            const typeId = Math.floor(Math.random() * 7) + 1;
            player.matrix = PIECES[typeId];
            player.pos.y = 0;
            player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

            // 생성되자마자 충돌하면 게임 오버 (보드 초기화)
            if (collide(board, player)) {
                board.forEach(row => row.fill(0));
                score = 0;
                scoreElement.innerText = score;
                dropInterval = 1000;
            }
        }

        // 블록 회전
        function playerRotate() {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1); // 원래대로 복구
                    player.pos.x = pos;
                    return;
                }
            }
        }

        // 행렬 회전 로직
        function rotate(matrix, dir = 1) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // 게임 루프
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        // 키보드 조작 이벤트
        document.addEventListener('keydown', event => {
            switch(event.keyCode) {
                case 37: // Left
                    playerMove(-1);
                    break;
                case 39: // Right
                    playerMove(1);
                    break;
                case 40: // Down
                    playerDrop();
                    break;
                case 38: // Up (Rotate)
                case 32: // Space (Rotate)
                    playerRotate();
                    break;
            }
        });

        // 모바일 터치 컨트롤러 이벤트 바인딩 함수
        function bindTouch(id, action) {
            const btn = document.getElementById(id);
            const handler = (e) => {
                e.preventDefault(); // 더블 탭 확대 등 기본 동작 방지
                action();
            };
            btn.addEventListener('touchstart', handler, {passive: false});
            btn.addEventListener('mousedown', handler);
        }

        bindTouch('btn-left', () => playerMove(-1));
        bindTouch('btn-right', () => playerMove(1));
        bindTouch('btn-rotate', () => playerRotate());
        bindTouch('btn-down', () => playerDrop());

        // 게임 시작
        playerReset();
        update();
    </script>
</body>
</html>

            주말이나 공휴일, 혹은 방학 기간일 수 있어요. 다른 날짜를 선택해서 검색해 보세요!

  <script>
    const API_URL = "https://2026sy.eunseony75.workers.dev";
const EDUCATION_OFFICE_CODE = "B10";
    const SCHOOL_CODE = "7132148";

    // DOM 요소 캐싱
    const dateInput = document.getElementById('lunch-date');
    const searchBtn = document.getElementById('search-btn');
    const loadingSpinner = document.getElementById('loading-spinner');
    const successView = document.getElementById('success-view');
    const errorView = document.getElementById('error-view');
    
    const menuContent = document.getElementById('menu-content');
    const caloriesContent = document.getElementById('calories-content');
    const errorTitle = document.getElementById('error-title');
    const errorMessage = document.getElementById('error-message');

    // 4. 처음 웹페이지가 열렸을 때 오늘 날짜 자동 지정 및 즉시 조회
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      
      // 달력 input의 value형식은 'YYYY-MM-DD'이어야 함
      const todayFormatted = `${yyyy}-${mm}-${dd}`;
      dateInput.value = todayFormatted;

      // 초기 즉시 조회 실행
      fetchLunchData(todayFormatted);
    });

    // 검색 버튼 클릭 이벤트 바인딩
    searchBtn.addEventListener('click', () => {
      const selectedDate = dateInput.value;
      if (!selectedDate) {
        showErrorView("날짜 선택 오류", "날짜를 올바르게 선택해 주세요!");
        return;
      }
      fetchLunchData(selectedDate);
    });

    // 날짜 변경 시에도 즉시 조회되도록 유저 편의성 추가
    dateInput.addEventListener('change', () => {
      const selectedDate = dateInput.value;
      if (selectedDate) {
        fetchLunchData(selectedDate);
      }
    });

    // 2 & 3. 급식 데이터 요청 처리 함수
    async function fetchLunchData(dateString) {
      // 화면 뷰 초기화 및 로딩 가동
      successView.classList.add('hidden');
      errorView.classList.add('hidden');
      loadingSpinner.classList.remove('hidden');

      // 하이픈(-)을 제거하고 숫자 8자리 'YYYYMMDD' 형식으로 파라미터 변환
      const cleanDate = dateString.replace(/-/g, '');
      const params = new URLSearchParams({
Type: "json",
        pIndex: "1",
        pSize: "10",
        ATPT_OFCDC_SC_CODE: EDUCATION_OFFICE_CODE,
        SD_SCHUL_CODE: SCHOOL_CODE,
        MLSV_YMD: cleanDate
      });
      const requestUrl = `${API_URL}?${params.toString()}`;

      try {
        // API 비동기 호출
        const response = await fetch(requestUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP Error! status: ${response.status}`);
        }

        const data = await response.json();

        // 로딩 종료
        loadingSpinner.classList.add('hidden');

        const mealRows = data.mealServiceDietInfo?.[1]?.row;

        if (Array.isArray(mealRows) && mealRows.length > 0) {
          const meal = mealRows.find(item => String(item.MMEAL_SC_CODE) === "2") || mealRows[0];
          const cleanMenu = (meal.DDISH_NM || "")
            .replace(/<br\s*\/?\s*>/gi, "\n")
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">");
          // 성공했을 때 처리 규칙
          menuContent.textContent = cleanMenu;
          caloriesContent.textContent = meal.CAL_INFO || "정보 없음";
          
          successView.classList.remove('hidden');
        } else {
          // 실패했을 때 (급식이 없거나 주말인 경우 등) 처리 규칙
          const apiMessage = data.RESULT?.MESSAGE;
          showErrorView("오늘은 급식이 없습니다", apiMessage || "식단 정보가 등록되지 않은 날이거나 조회 실패했습니다.");
        }

      } catch (error) {
        // 네트워크 에러 혹은 서버 연결 실패 예외처리
        loadingSpinner.classList.add('hidden');
        console.error("급식 정보 조회 에러:", error);
        
        // 개발/대체 테스트를 위해 로컬 mock 데이터를 제공하는 우회책 로직도 부가적으로 작성할 수 있습니다.
        showErrorView(
          "급식 정보 조회 실패", 
          "급식 정보를 가져올 수 없습니다. 잠시 후 다시 시도해주세요."
        );
      }
    }

    // 에러 카드 출력 헬퍼 함수
    function showErrorView(title, msg) {
      successView.classList.add('hidden');
      errorView.classList.remove('hidden');
      
      errorTitle.textContent = title;
      errorMessage.textContent = msg;
    }
  </script>
</body>

    <script>
        const STUDENT_INFO = { id: 's_3_6_chaeyeon', name: '박채연', grade: 3, classNum: 6 };
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let carouselIndexes = {};
        let multiFilePayloads = [];
        let currentFullscreenItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFullscreen(); closeModal(); } });
            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenItem) return;
                const newWin = window.open('', '_blank');
                if (currentFullscreenItem.type === 'image') {
                    newWin.document.write('<img src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;">');
                } else if (currentFullscreenItem.type === 'video') {
                    newWin.document.write('<video controls autoplay src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;"></video>');
                } else {
                    newWin.document.write(currentFullscreenItem.data);
                }
                newWin.document.close();
            });
        });

        function switchUploadTab(tab) {
            if (tab === 'file') {
                document.getElementById('tabBtnFile').classList.add('active');
                document.getElementById('tabBtnCode').classList.remove('active');
                document.getElementById('tabContentFile').style.display = 'block';
                document.getElementById('tabContentCode').style.display = 'none';
            } else {
                document.getElementById('tabBtnCode').classList.add('active');
                document.getElementById('tabBtnFile').classList.remove('active');
                document.getElementById('tabContentCode').style.display = 'block';
                document.getElementById('tabContentFile').style.display = 'none';
            }
        }

        function handleMultipleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const listContainer = document.getElementById('fileListPreview');
            listContainer.innerHTML = '';
            multiFilePayloads = [];
            files.forEach((file) => {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let fType = 'html';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov'].includes(ext)) fType = 'video';
                else if (['pdf'].includes(ext)) fType = 'pdf';
                else if (['ppt', 'pptx'].includes(ext)) fType = 'pptx';

                reader.onload = (re) => {
                    multiFilePayloads.push({ name: file.name, type: fType, data: re.target.result });
                    const tag = document.createElement('div');
                    tag.className = 'file-item-tag';
                    tag.innerHTML = `<span><i class="fa-solid fa-check-circle"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB)</span> <span style="font-size:0.75rem;">${fType.toUpperCase()}</span>`;
                    listContainer.appendChild(tag);
                };
                if (fType === 'image' || fType === 'video' || fType === 'pdf') {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function loadStudentProjects() {
            studentProjectsMap = {};

            const el_tmpl_quiz = document.getElementById('tmpl_quiz');
            if (el_tmpl_quiz) {
                studentProjectsMap['quiz'] = {
                    title: "중3 과학 [운동과 에너지] 기말고사 대비 모의고사",
                    items: [{ name: "중3 과학 [운동과 에너지] 기말고사 대비 모의고사", type: 'html', data: el_tmpl_quiz.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const el_tmpl_game = document.getElementById('tmpl_game');
            if (el_tmpl_game) {
                studentProjectsMap['game'] = {
                    title: "네온 테트리스 (Neon Tetris)",
                    items: [{ name: "네온 테트리스 (Neon Tetris)", type: 'html', data: el_tmpl_game.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const el_tmpl_meal_app = document.getElementById('tmpl_meal_app');
            if (el_tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "🏫 숭의여자중학교 오늘의 급식",
                    items: [{ name: "🏫 숭의여자중학교 오늘의 급식", type: 'html', data: el_tmpl_meal_app.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 파일 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

                    { text: "물체가 아래로 내려갈수록 역학적 에너지는 점점 증가한다.", rationale: "역학적 에너지는 증가하거나 감소하지 않고 일정한 값을 유지합니다.", isCorrect: false },
                    { text: "낙하하는 도중에는 위치 에너지가 운동 에너지보다 항상 크다.", rationale: "낙하 시작 직후에는 위치 에너지가 더 크지만, 지면에 닿기 직전에는 운동 에너지가 더 커지므로 항상 크다고 볼 수는 없습니다.", isCorrect: false }
                ],
                hint: "역학적 에너지는 위치 에너지와 운동 에너지의 '합'을 의미합니다. 에너지 보존 법칙을 고려해 보세요."
            }
        ];

        // App States
        let currentQuestionIndex = 0;
        let userAnswers = Array(questions.length).fill(null);
        let timerInterval = null;
        let timeLeft = 40 * 60; // 40 minutes in seconds
        let isStarted = false;
        let isSubmitted = false;

        // Initialize Lucide Icons
        window.onload = function() {
            lucide.createIcons();
            buildNavigationGrid();
        };

        // Start Quiz
        function startQuiz() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-header-status').classList.remove('hidden');
            
            isStarted = true;
            currentQuestionIndex = 0;
            userAnswers = Array(questions.length).fill(null);
            
            startTimer();
            renderQuestion();
            updateProgress();
            buildNavigationGrid();
        }

        // Timer Function
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSubmit();
                    return;
                }
                timeLeft--;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const displayStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timer-display').innerText = displayStr;
            
            // Warn if under 5 minutes
            if (timeLeft < 300) {
                const timerContainer = document.getElementById('timer-display').parentElement;
                timerContainer.classList.remove('bg-rose-50', 'text-rose-700', 'border-rose-100');
                timerContainer.classList.add('bg-rose-600', 'text-white', 'border-transparent', 'animate-pulse');
            }
        }

        // Build Navigation Grid (1-20 sidebar)
        function buildNavigationGrid() {
            const gridContainer = document.getElementById('nav-grid');
            gridContainer.innerHTML = '';
            
            for (let i = 0; i < questions.length; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = i + 1;
                btn.className = getNavButtonClass(i);
                btn.onclick = () => selectQuestion(i);
                gridContainer.appendChild(btn);
            }
            
            // Update Answered Badge Count
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            document.getElementById('answered-count-badge').innerText = `${answeredCount} / ${questions.length}`;
        }

        // Determine CSS classes for navigation grid buttons
        function getNavButtonClass(index) {
            const baseClass = "h-10 text-sm font-bold rounded-lg transition-all focus:outline-none flex items-center justify-center border ";
            
            if (index === currentQuestionIndex) {
                return baseClass + "border-indigo-600 bg-indigo-600 text-white shadow-md shadow-indigo-100";
            } else if (userAnswers[index] !== null) {
                return baseClass + "border-indigo-100 bg-indigo-50 text-indigo-700";
            } else {
                return baseClass + "border-slate-200 bg-white text-slate-600 hover:bg-slate-50";
            }
        }

        // Render Current Question
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            
            // Header Indicator
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            
            // Question Title
            document.getElementById('question-text').innerText = q.question;
            
            // Hint Text
            document.getElementById('hint-text').innerText = q.hint;
            // Always collapse hint box when changing questions
            document.getElementById('hint-box').classList.add('hidden');
            
            // Render Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.answerOptions.forEach((option, idx) => {
                const isSelected = userAnswers[currentQuestionIndex] === idx;
                
                const optionBtn = document.createElement('button');
                optionBtn.type = 'button';
                optionBtn.onclick = () => selectOption(idx);
                optionBtn.className = `w-full text-left p-4 rounded-xl border transition-all flex items-start space-x-3 group relative ${
                    isSelected 
                    ? 'border-indigo-600 bg-indigo-50/50 text-indigo-900 font-semibold shadow-sm' 
                    : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:border-slate-300'
                }`;
                
                // Index Circle Badge
                const numberCircle = isSelected 
                    ? `<span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">${idx + 1}</span>`
                    : `<span class="flex-shrink-0 w-6 h-6 rounded-full bg-slate-100 text-slate-500 font-semibold text-xs flex items-center justify-center group-hover:bg-slate-200">${idx + 1}</span>`;
                
                optionBtn.innerHTML = `
                    ${numberCircle}
                    <span class="text-sm md:text-base leading-snug pt-0.5">${option.text}</span>
                `;
                
                container.appendChild(optionBtn);
            });
            
            // Update Nav Controls (prev / next buttons)
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.innerHTML = `<span>최종 제출</span><i data-lucide="check" class="w-4 h-4"></i>`;
                nextBtn.onclick = openSubmitModal;
                nextBtn.className = "flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition-all shadow-md";
            } else {
                nextBtn.innerHTML = `<span>다음 문제</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                nextBtn.onclick = nextQuestion;
                nextBtn.className = "flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold transition-all";
            }
            
            lucide.createIcons();
            buildNavigationGrid();
        }

        // Interaction Handlers
        function selectOption(optionIndex) {
            userAnswers[currentQuestionIndex] = optionIndex;
            renderQuestion();
            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function selectQuestion(index) {
            currentQuestionIndex = index;
            renderQuestion();
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function updateProgress() {
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            const percent = Math.round((answeredCount / questions.length) * 100);
            
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${percent}% 완료 (${answeredCount}/${questions.length} 문제)`;
        }

        // Modal Controls
        function openSubmitModal() {
            const unanswered = questions.length - userAnswers.filter(ans => ans !== null).length;
            const warningText = document.getElementById('modal-warning-text');
            
            if (unanswered > 0) {
                warningText.innerHTML = `아직 풀지 않은 문제가 <strong class="text-rose-600">${unanswered}개</strong> 있습니다.<br>정말 제출하고 즉시 채점 결과를 확인하시겠습니까?`;
            } else {
                warningText.innerHTML = "모든 문제를 해결하셨습니다! 제출하고 성적표와 오답 해설 노트를 확인해 보세요.";
            }
            
            document.getElementById('submit-modal').classList.remove('hidden');
        }

        function closeSubmitModal() {
            document.getElementById('submit-modal').classList.add('hidden');
        }

        // Form Submission (Grading)
        function autoSubmit() {
            alert("제한 시간이 초과되어 시험이 자동으로 제출됩니다.");
            submitQuiz();
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            closeSubmitModal();
            
            isSubmitted = true;
            
            // Calculate Results
            let correctCount = 0;
            questions.forEach((q, qIdx) => {
                const userAns = userAnswers[qIdx];
                if (userAns !== null && q.answerOptions[userAns].isCorrect) {
                    correctCount++;
                }
            });
            
            const score = (correctCount / questions.length) * 100;
            const timeTakenSec = (40 * 60) - timeLeft;
            const minutesTaken = Math.floor(timeTakenSec / 60);
            const secondsTaken = timeTakenSec % 60;
            
            // Hide Quiz Screen, Show Results
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-header-status').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            // Set stats
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = correctCount;
            document.getElementById('time-taken-display').innerText = `소요 시간: ${minutesTaken}분 ${secondsTaken}초`;
            
            // Apply customized grade messages
            const gradeTitle = document.getElementById('feedback-grade');
            const gradeDesc = document.getElementById('feedback-message');
            const iconBox = document.getElementById('result-icon-box');
            
            if (score >= 90) {
                gradeTitle.innerText = "최상위권 보장! 완벽합니다 ⭐";
                gradeDesc.innerText = "기념비적인 우수한 성적입니다! 완벽에 가까운 실력이며 실전에서도 100점을 기대할 수 있는 상태입니다.";
                iconBox.className = "inline-flex bg-emerald-50 text-emerald-600 p-4 rounded-full mb-6";
                iconBox.innerHTML = `<i data-lucide="award" class="w-14 h-14"></i>`;
            } else if (score >= 70) {
                gradeTitle.innerText = "훌륭한 실력입니다! 🎉";
                gradeDesc.innerText = "개념을 대체로 정확하게 잘 이해하고 있습니다. 몇 가지 실수나 헷갈리는 부분들을 아래 상세 피드백에서 완벽하게 보정해 보세요.";
                iconBox.className = "inline-flex bg-indigo-50 text-indigo-600 p-4 rounded-full mb-6";
                iconBox.innerHTML = `<i data-lucide="check-circle-2" class="w-14 h-14"></i>`;
            } else if (score >= 50) {
                gradeTitle.innerText = "조금 더 집중해봅시다! 👍";
                gradeDesc.innerText = "확실하지 않게 아는 애매한 상태의 문제들이 다소 있었습니다. 아래 오답 정리 목록을 통해 핵심 개념 이론을 다시 가다듬으세요.";
                iconBox.className = "inline-flex bg-amber-50 text-amber-500 p-4 rounded-full mb-6";
                iconBox.innerHTML = `<i data-lucide="help-circle" class="w-14 h-14"></i>`;
            } else {
                gradeTitle.innerText = "기초 보강이 필요해요 ✍️";
                gradeDesc.innerText = "단원별 주요 핵심 개념을 명확하게 파악하는 학습이 시급합니다. 오답 해설 노트의 친절한 설명을 천천히 정독하는 것부터 시작해 봅시다.";
                iconBox.className = "inline-flex bg-rose-50 text-rose-500 p-4 rounded-full mb-6";
                iconBox.innerHTML = `<i data-lucide="alert-circle" class="w-14 h-14"></i>`;
            }
            
            // Build Detailed Analysis Accordions
            buildDetailedAnalysis();
            lucide.createIcons();
            
            // Scroll to Top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Build detailed review for all questions at the bottom of result screen
        function buildDetailedAnalysis() {
            const listContainer = document.getElementById('detailed-analysis-list');
            listContainer.innerHTML = '';
            
            questions.forEach((q, qIdx) => {
                const userAnsIdx = userAnswers[qIdx];
                const isCorrect = userAnsIdx !== null && q.answerOptions[userAnsIdx].isCorrect;
                
                const item = document.createElement('div');
                item.className = `bg-white rounded-xl border p-5 shadow-sm transition-all duration-300 ${
                    isCorrect ? 'border-emerald-200 hover:border-emerald-300' : 'border-rose-200 hover:border-rose-300'
                }`;
                
                // Status Header
                const statusBadge = isCorrect 
                    ? `<span class="inline-flex items-center space-x-1 text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md"><i data-lucide="check" class="w-3.5 h-3.5"></i><span>정답</span></span>`
                    : `<span class="inline-flex items-center space-x-1 text-xs font-bold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-md"><i data-lucide="x" class="w-3.5 h-3.5"></i><span>오답</span></span>`;
                
                // Render choices inside review
                let choicesHtml = '';
                q.answerOptions.forEach((option, oIdx) => {
                    let optionStatusStyle = 'bg-slate-50 border-slate-150 text-slate-700';
                    let optionIcon = '';
                    
                    if (option.isCorrect) {
                        // Correct option highlighted in Green
                        optionStatusStyle = 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold';
                        optionIcon = `<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600 flex-shrink-0 mt-0.5"></i>`;
                    } else if (oIdx === userAnsIdx && !option.isCorrect) {
                        // User selected wrong option highlighted in Red
                        optionStatusStyle = 'bg-rose-50 border-rose-200 text-rose-900 font-semibold';
                        optionIcon = `<i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 flex-shrink-0 mt-0.5"></i>`;
                    }
                    
                    choicesHtml += `
                        <div class="p-3.5 rounded-lg border text-xs md:text-sm flex items-start space-x-2.5 ${optionStatusStyle}">
                            ${optionIcon ? optionIcon : `<span class="w-4 h-4 bg-slate-200 text-slate-500 rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0 mt-0.5">${oIdx+1}</span>`}
                            <div class="flex-grow">
                                <p class="mb-1 leading-snug">${option.text}</p>
                                <p class="text-xs text-slate-400 mt-1 pl-1 border-l-2 border-slate-200">${option.rationale}</p>
                            </div>
                        </div>
                    `;
                });
                
                item.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2.5">
                        <span class="text-sm font-bold text-slate-400">질문 ${qIdx + 1}</span>
                        ${statusBadge}
                    </div>
                    <h4 class="text-sm md:text-base font-bold text-slate-900 mb-4 whitespace-pre-line leading-relaxed">${q.question}</h4>
                    
                    <div class="space-y-2 mb-4">
                        ${choicesHtml}
                    </div>
                    
                    <!-- Core Tip box for explanation -->
                    <div class="bg-indigo-50/50 rounded-lg p-3 text-xs text-indigo-950 flex items-start space-x-2 border border-indigo-100/50">
                        <i data-lucide="sparkles" class="w-4 h-4 text-indigo-600 flex-shrink-0 mt-0.5"></i>
                        <div>
                            <span class="font-bold block text-indigo-800 mb-0.5">정답 요약 정보</span>
                            <span>이 문제의 정답은 <strong>${q.answerOptions.findIndex(o => o.isCorrect) + 1}번</strong>입니다. 힌트 원리였던 "${q.hint}"를 꼭 기억하세요.</span>
                        </div>
                    </div>
                `;
                
                listContainer.appendChild(item);
            });
        }

        // Restart Quiz / Reset State
        function restartQuiz() {
            isStarted = false;
            isSubmitted = false;
            timeLeft = 40 * 60;
            currentQuestionIndex = 0;
            userAnswers = Array(questions.length).fill(null);
            
            // Toggle screens
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
            
            // Clean up timers
            clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = "40:00";
            const timerContainer = document.getElementById('timer-display').parentElement;
            timerContainer.className = "flex items-center space-x-1.5 bg-rose-50 text-rose-700 px-3 py-1.5 rounded-full text-sm font-semibold border border-rose-100";
            
            // Scroll to Top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let carouselIndexes = {};
        let multiFilePayloads = [];
        let currentFullscreenItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFullscreen(); closeModal(); } });
            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenItem) return;
                const newWin = window.open('', '_blank');
                if (currentFullscreenItem.type === 'image') {
                    newWin.document.write('<img src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;">');
                } else if (currentFullscreenItem.type === 'video') {
                    newWin.document.write('<video controls autoplay src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;"></video>');
                } else {
                    newWin.document.write(currentFullscreenItem.data);
                }
                newWin.document.close();
            });
        });

        function switchUploadTab(tab) {
            if (tab === 'file') {
                document.getElementById('tabBtnFile').classList.add('active');
                document.getElementById('tabBtnCode').classList.remove('active');
                document.getElementById('tabContentFile').style.display = 'block';
                document.getElementById('tabContentCode').style.display = 'none';
            } else {
                document.getElementById('tabBtnCode').classList.add('active');
                document.getElementById('tabBtnFile').classList.remove('active');
                document.getElementById('tabContentCode').style.display = 'block';
                document.getElementById('tabContentFile').style.display = 'none';
            }
        }

        function handleMultipleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const listContainer = document.getElementById('fileListPreview');
            listContainer.innerHTML = '';
            multiFilePayloads = [];
            files.forEach((file) => {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let fType = 'html';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov'].includes(ext)) fType = 'video';
                else if (['pdf'].includes(ext)) fType = 'pdf';
                else if (['ppt', 'pptx'].includes(ext)) fType = 'pptx';

                reader.onload = (re) => {
                    multiFilePayloads.push({ name: file.name, type: fType, data: re.target.result });
                    const tag = document.createElement('div');
                    tag.className = 'file-item-tag';
                    tag.innerHTML = `<span><i class="fa-solid fa-check-circle"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB)</span> <span style="font-size:0.75rem;">${fType.toUpperCase()}</span>`;
                    listContainer.appendChild(tag);
                };
                if (fType === 'image' || fType === 'video' || fType === 'pdf') {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function loadStudentProjects() {
            studentProjectsMap = {};

            const el_tmpl_quiz = document.getElementById('tmpl_quiz');
            if (el_tmpl_quiz) {
                studentProjectsMap['quiz'] = {
                    title: "중3 과학 1학기 기말고사 모의고사",
                    items: [{ name: "중3 과학 1학기 기말고사 모의고사", type: 'html', data: el_tmpl_quiz.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 파일 추가/수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => openFullscreen(project, topic.id));
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 파일 올리기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

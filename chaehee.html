<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숭의여자중학교 학생 AI 포트폴리오 전시대</title>
    
    <!-- Google Sites iframe 임베드 설정 -->
    <base target="_blank">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #FFFFFF;
            --bg-subtle: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --text-muted: #94A3B8;

            --p-image-bg: #FFF1F2; --p-image-border: #FFE4E6; --p-image-text: #E11D48; --p-image-accent: #FB7185;
            --p-quiz-bg: #F5F3FF; --p-quiz-border: #EDE9FE; --p-quiz-text: #7C3AED; --p-quiz-accent: #A78BFA;
            --p-game-bg: #ECFDF5; --p-game-border: #D1FAE5; --p-game-text: #059669; --p-game-accent: #34D399;
            --p-video-bg: #F0F9FF; --p-video-border: #E0F2FE; --p-video-text: #0284C7; --p-video-accent: #38BDF8;
            --p-slide-bg: #FFF7ED; --p-slide-border: #FFEDD5; --p-slide-text: #EA580C; --p-slide-accent: #FB923C;
            --p-meal-bg: #FEFCE8; --p-meal-border: #FEF08A; --p-meal-text: #CA8A04; --p-meal-accent: #FACC15;
            --p-pingpong-bg: #F0FDFA; --p-pingpong-border: #CCFBF1; --p-pingpong-text: #0D9488; --p-pingpong-accent: #2DD4BF;
            --p-piebrain-bg: #EEF2FF; --p-piebrain-border: #E0E7FF; --p-piebrain-text: #4F46E5; --p-piebrain-accent: #818CF8;

            --border-subtle: #E2E8F0;
            --shadow-sm: 0 2px 8px rgba(148, 163, 184, 0.08);
            --shadow-md: 0 8px 24px rgba(148, 163, 184, 0.12);
            --shadow-lg: 0 16px 36px rgba(148, 163, 184, 0.18);
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg-main); color: var(--text-primary); line-height: 1.6; padding: 18px 12px; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; border: none; outline: none; }

        .portfolio-wrapper { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        /* Top Header Banner */
        .profile-banner {
            background: linear-gradient(135deg, #FFF5F7 0%, #FFFFFF 50%, #F5F7FF 100%);
            border-radius: var(--radius-lg); border: 1px solid var(--border-subtle);
            padding: 22px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 14px; box-shadow: var(--shadow-sm);
        }
        .profile-left { display: flex; align-items: center; gap: 14px; }
        .profile-avatar {
            width: 54px; height: 54px; border-radius: 50%;
            background: linear-gradient(135deg, var(--p-image-border), var(--p-quiz-border));
            color: var(--p-quiz-text); font-size: 1.4rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
        }
        .profile-info h1 { font-size: 1.35rem; font-weight: 800; color: var(--text-primary); }
        .profile-info p { font-size: 0.86rem; color: var(--text-secondary); }

        .profile-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .student-select-box {
            padding: 7px 12px; border-radius: var(--radius-full); border: 1px solid var(--border-subtle);
            font-size: 0.85rem; font-weight: 600; background: #FFFFFF; color: var(--text-primary);
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 8px 16px; border-radius: var(--radius-full);
            font-size: 0.85rem; font-weight: 600; transition: var(--transition-smooth);
        }
        .btn-primary { background: linear-gradient(135deg, var(--p-image-accent), var(--p-quiz-accent)); color: #FFFFFF; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(251, 113, 133, 0.3); }
        .btn-secondary { background: var(--p-quiz-bg); color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); }
        .btn-secondary:hover { background: var(--p-quiz-border); }
        .btn-outline { background: #FFFFFF; border: 1px solid var(--border-subtle); color: var(--text-secondary); }
        .btn-outline:hover { background: var(--bg-subtle); color: var(--text-primary); }
        .btn-sm { padding: 6px 14px; font-size: 0.82rem; }

        .badge-pill {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
            border-radius: var(--radius-full); font-size: 0.78rem; font-weight: 700;
        }

        /* 8 Slots Project Grid */
        .slots-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .slots-title { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }

        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }

        .slot-card {
            background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle);
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            gap: 14px; box-shadow: var(--shadow-sm); transition: var(--transition-smooth); position: relative;
        }
        .slot-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

        .slot-card-header { display: flex; justify-content: space-between; align-items: center; }
        .slot-title { font-size: 1.08rem; font-weight: 700; color: var(--text-primary); margin-top: 4px; line-height: 1.35; }

        /* Preview Screen (높이를 320px로 확장 및 상단 풀스크린 바로가기 오버레이) */
        .slot-preview-box {
            width: 100%; height: 320px; background: #FAFAFC; border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle); overflow: hidden; position: relative;
        }
        .slot-iframe { width: 100%; height: 100%; border: none; background: #FFFFFF; }

        .preview-controls-overlay {
            position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10;
        }
        .preview-action-chip {
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px);
            padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700;
            color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); box-shadow: var(--shadow-sm);
            cursor: pointer; transition: var(--transition-smooth);
        }
        .preview-action-chip:hover { background: var(--p-quiz-accent); color: #FFF; transform: translateY(-1px); }

        .empty-slot-box {
            width: 100%; height: 320px; background: #F8FAFC; border-radius: var(--radius-md);
            border: 2px dashed var(--border-subtle); display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); text-align: center; padding: 20px;
        }
        .empty-slot-box i { font-size: 2.4rem; color: var(--p-quiz-accent); }

        .slot-card-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border-subtle); padding-top: 12px; flex-wrap: wrap; gap: 8px;
        }
        .slot-footer-left { display: flex; gap: 6px; }

        /* Fullscreen Large Interactive Play Modal */
        .fullscreen-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px;
        }
        .fullscreen-modal.active { display: flex; }
        .fullscreen-container {
            background: #FFFFFF; border-radius: var(--radius-lg); width: 95vw; height: 92vh;
            max-width: 1300px; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden;
        }
        .fullscreen-header {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 24px;
            background: #F8FAFC; border-bottom: 1px solid var(--border-subtle);
        }
        .fullscreen-body { flex: 1; width: 100%; height: 100%; position: relative; background: #FFFFFF; }
        .fullscreen-iframe { width: 100%; height: 100%; border: none; }

        /* Upload Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.48); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-container {
            background: #FFFFFF; border-radius: var(--radius-lg); width: 100%; max-width: 600px;
            max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-subtle); background: var(--bg-subtle); }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-label { font-size: 0.84rem; font-weight: 600; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: inherit; font-size: 0.88rem; }
        .form-textarea { font-family: 'Fira Code', monospace; min-height: 140px; resize: vertical; }

        .toast-box {
            position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #FFF;
            padding: 12px 20px; border-radius: var(--radius-full); font-size: 0.88rem; font-weight: 600;
            display: none; z-index: 4000; box-shadow: var(--shadow-lg);
        }
        .toast-box.active { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="portfolio-wrapper">
        <!-- 1. Student Header Banner -->
        <header class="profile-banner">
            <div class="profile-left">
                <div class="profile-avatar" id="avatarLetter">박</div>
                <div class="profile-info">
                    <h1 id="studentTitleName">박채연 학생의 AI 창작 포트폴리오</h1>
                    <p id="studentClassInfo">2026학년도 숭의여자중학교 3학년 6반</p>
                </div>
            </div>

            <div class="profile-actions">
                <select id="studentSwitcher" class="student-select-box" title="학생 변경">
                    <!-- Javascript generated students -->
                </select>
                <a href="https://eunseony75.github.io/2026sy/" target="_self" class="btn btn-outline">
                    <i class="fa-solid fa-house"></i> 동아리 전체 갤러리
                </a>
            </div>
        </header>

        <!-- 2. 8 Slots Curriculum Header -->
        <div class="slots-header">
            <div>
                <h2 class="slots-title">
                    <i class="fa-solid fa-cubes" style="color: var(--p-quiz-text);"></i> 8대 프로젝트 결과물 전시대
                </h2>
                <p style="font-size: 0.86rem; color: var(--text-muted); margin-top: 2px;">
                    카드 우측 상단의 <strong>[⛶ 크게 체험하기]</strong>를 누르면 전체화면 대형 창에서 실전 퀴즈 풀이 및 게임을 쾌적하게 즐길 수 있습니다.
                </p>
            </div>
        </div>

        <!-- 3. 8 Project Slots Grid -->
        <div class="slots-grid" id="slotsGrid">
            <!-- Dynamic 8 Topic Slots -->
        </div>
    </div>

    <!-- 4. Fullscreen Interactive Player Modal (대형 화면 체험 모달) -->
    <div class="fullscreen-modal" id="fullscreenModal">
        <div class="fullscreen-container">
            <div class="fullscreen-header">
                <div>
                    <h3 id="fullscreenTitle" style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary);">결과물 대형 화면 체험</h3>
                    <span id="fullscreenStudentName" style="font-size: 0.82rem; color: var(--text-muted);"></span>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-outline btn-sm" id="fullscreenNewTabBtn" title="새 탭에서 전체화면으로 열기">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> 새 창에서 열기
                    </button>
                    <button class="btn btn-primary btn-sm" onclick="closeFullscreen()">
                        <i class="fa-solid fa-xmark"></i> 닫기 (ESC)
                    </button>
                </div>
            </div>
            <div class="fullscreen-body">
                <iframe id="fullscreenIframe" class="fullscreen-iframe" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <!-- Upload/Edit Modal -->
    <div class="modal-overlay" id="slotModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTopicTitle" style="font-size: 1.1rem; font-weight: 700;">프로젝트 결과물 등록</h3>
                <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
            </div>
            <form id="slotForm">
                <input type="hidden" id="modalTopicId" value="">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">작품 제목 *</label>
                        <input type="text" id="slotTitleInput" class="form-control" placeholder="예: 중3 과학 운동과 에너지 20제 모의고사" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">소스코드 / 이미지 태그 / 캔바 링크 붙여넣기 *</label>
                        <textarea id="slotCodeInput" class="form-control form-textarea" placeholder="<!DOCTYPE html>... 제미나이 캔버스나 캔바에서 복사한 HTML 코드 또는 <img src='...'> 태그를 붙여넣기하세요." required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-box" id="toast">
        <i class="fa-solid fa-check" style="color: #34D399;"></i>
        <span id="toastMsg">성공적으로 저장되었습니다!</span>
    </div>

    <script>
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },
            { id: 'game', name: '게임', icon: 'fa-solid fa-gamepad', bg: 'var(--p-game-bg)', color: 'var(--p-game-text)', border: 'var(--p-game-border)' },
            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },
            { id: 'meal-app', name: '급식앱', icon: 'fa-solid fa-utensils', bg: 'var(--p-meal-bg)', color: 'var(--p-meal-text)', border: 'var(--p-meal-border)' },
            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        const STUDENTS = [
            { id: 's_3_6_chaeyeon', name: '박채연', grade: 3, classNum: 6 },
            { id: 's_3_1_minsol', name: '김민솔', grade: 3, classNum: 1 },
            { id: 's_2_1_seohyun', name: '김서현', grade: 2, classNum: 1 },
            { id: 's_3_2_haeun', name: '박하은', grade: 3, classNum: 2 },
            { id: 's_3_3_soyoon', name: '최소윤', grade: 3, classNum: 3 },
            { id: 's_2_2_seulon', name: '채슬온', grade: 2, classNum: 2 },
            { id: 's_3_5_hyoyoon', name: '김효윤', grade: 3, classNum: 5 },
            { id: 's_2_3_seyeoung', name: '신세영', grade: 2, classNum: 3 },
            { id: 's_2_4_jiwoo', name: '임지우', grade: 2, classNum: 4 },
            { id: 's_1_2_heejung', name: '김희정', grade: 1, classNum: 2 },
            { id: 's_1_2_chaehee', name: '박채희', grade: 1, classNum: 2 },
            { id: 's_2_5_yoonha', name: '최윤하', grade: 2, classNum: 5 },
            { id: 's_2_6_hyuna', name: '장현아', grade: 2, classNum: 6 },
            { id: 's_3_1_sua', name: '김수아', grade: 3, classNum: 1 },
            { id: 's_3_4_yerin', name: '문예린', grade: 3, classNum: 4 },
            { id: 's_3_5_chaeyoon', name: '엄채윤', grade: 3, classNum: 5 },
            { id: 's_3_2_ayeon', name: '이아연', grade: 3, classNum: 2 },
            { id: 's_3_3_hayoon', name: '인하윤', grade: 3, classNum: 3 },
            { id: 's_3_6_yoona', name: '최윤아', grade: 3, classNum: 6 },
            { id: 's_3_6_younghyun', name: '송영현', grade: 3, classNum: 6 },
            { id: 's_3_6_chaehyun', name: '박채현', grade: 3, classNum: 6 }
        ];

        let currentStudent = STUDENTS.find(s => s.name === '박채희') || STUDENTS[0];
        let studentProjectsMap = {};
        let currentFullscreenCode = '';

        document.addEventListener('DOMContentLoaded', () => {
            detectStudentFromUrl();
            populateStudentDropdown();
            loadStudentProjects();
            renderSlots();

            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeFullscreen();
            });

            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenCode) return;
                const newWin = window.open('', '_blank');
                newWin.document.write(currentFullscreenCode);
                newWin.document.close();
            });
        });

        function detectStudentFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const nameParam = params.get('name') || params.get('id');
            if (nameParam) {
                const found = STUDENTS.find(s => s.name === decodeURIComponent(nameParam) || s.id === nameParam);
                if (found) currentStudent = found;
            }
        }

        function populateStudentDropdown() {
            const select = document.getElementById('studentSwitcher');
            select.innerHTML = '';
            STUDENTS.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.grade}학년 ${s.classNum}반 ${s.name}`;
                if (s.id === currentStudent.id) opt.selected = true;
                select.appendChild(opt);
            });

            select.addEventListener('change', (e) => {
                const selected = STUDENTS.find(s => s.id === e.target.value);
                if (selected) {
                    currentStudent = selected;
                    updateStudentProfileUI();
                    renderSlots();
                }
            });

            updateStudentProfileUI();
        }

        function updateStudentProfileUI() {
            document.getElementById('avatarLetter').textContent = currentStudent.name.charAt(0);
            document.getElementById('studentTitleName').textContent = `${currentStudent.name} 학생의 AI 창작 포트폴리오`;
            document.getElementById('studentClassInfo').textContent = `2026학년도 숭의여자중학교 ${currentStudent.grade}학년 ${currentStudent.classNum}반`;
        }

        function loadStudentProjects() {
            const saved = localStorage.getItem('2026sy_student_slots_' + currentStudent.id);
            if (saved) {
                try {
                    studentProjectsMap = JSON.parse(saved);
                    return;
                } catch (e) {}
            }
            studentProjectsMap = {};
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + currentStudent.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            loadStudentProjects();
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.sourceCode) {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                <iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(project.sourceCode)}"></iframe>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <div class="slot-footer-left">
                                <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                    <i class="fa-solid fa-play"></i> 전체화면 실행
                                </button>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-pen"></i> 수정
                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">
                                    <i class="fa-solid fa-trash"></i> 삭제
                                </button>
                            </div>
                        </div>
                    `;

                    card.querySelectorAll('.play-fullscreen-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            openFullscreen(project.title, project.sourceCode);
                        });
                    });
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>
                            </div>
                            <h3 class="slot-title" style="color:var(--text-muted);">${topic.name} 결과물 준비 중</h3>
                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">
                                    <i class="fa-solid fa-plus"></i> 내 작품 등록하기
                                </button>
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <span style="font-size:0.75rem; color:var(--text-muted);">다음 수업 예정</span>
                            <button class="btn btn-outline btn-sm" onclick="openEditModal('${topic.id}')">
                                <i class="fa-solid fa-plus"></i> 등록
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function openFullscreen(title, sourceCode) {
            currentFullscreenCode = sourceCode;
            document.getElementById('fullscreenTitle').textContent = title;
            document.getElementById('fullscreenStudentName').textContent = `${currentStudent.grade}학년 ${currentStudent.classNum}반 ${currentStudent.name} 학생 작품`;
            document.getElementById('fullscreenIframe').srcdoc = sourceCode;
            document.getElementById('fullscreenModal').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenIframe').srcdoc = '';
        }

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;

            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 등록 및 수정`;

            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
                document.getElementById('slotCodeInput').value = existing.sourceCode || '';
            } else {
                document.getElementById('slotTitleInput').value = `${currentStudent.name} 학생의 ${topic.name} 창작 과제`;
                document.getElementById('slotCodeInput').value = '';
            }

            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            const sourceCode = document.getElementById('slotCodeInput').value.trim();

            if (!title || !sourceCode) {
                alert('제목과 소스코드를 입력해주세요.');
                return;
            }

            studentProjectsMap[topicId] = {
                title,
                sourceCode,
                updatedAt: new Date().toISOString().split('T')[0]
            };

            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast('성공적으로 저장되었습니다!');
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

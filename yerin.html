        .preview-controls-overlay { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 15; }
        .preview-action-chip { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; color: var(--p-quiz-text); border: 1px solid var(--p-quiz-border); box-shadow: var(--shadow-sm); cursor: pointer; transition: var(--transition-smooth); }

        .fullscreen-iframe { width: 100%; height: 100%; border: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: flex-start; z-index: 9999; padding: 50px 16px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal-container { background: #FFFFFF; border-radius: 22px; width: 100%; max-width: 660px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); margin: auto; animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); background: #F8FAFC; border-top-left-radius: 22px; border-top-right-radius: 22px; }
        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border-subtle); background: #F8FAFC; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }
        .upload-tab-buttons { display: flex; gap: 8px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 8px; }
        .tab-btn { padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.86rem; font-weight: 700; border: 1px solid var(--border-subtle); background: #FFF; color: var(--text-secondary); cursor: pointer; transition: var(--transition-smooth); }
        .tab-btn.active { background: var(--p-quiz-bg); color: var(--p-quiz-text); border-color: var(--p-quiz-border); box-shadow: var(--shadow-sm); }
        .drop-zone { border: 2px dashed var(--p-quiz-border); background: #F8FAFC; border-radius: var(--radius-md); padding: 30px 20px; text-align: center; cursor: pointer; transition: var(--transition-smooth); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .drop-zone:hover { background: #F5F3FF; border-color: var(--p-quiz-accent); }
        .drop-zone i { font-size: 2.6rem; color: var(--p-quiz-accent); }
        .file-list-preview { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
        .file-item-tag { display: flex; justify-content: space-between; align-items: center; background: #ECFDF5; border: 1px solid #A7F3D0; padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.84rem; color: #065F46; font-weight: 600; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }

        .toast-box.active { display: flex; align-items: center; gap: 8px; }
    </style>

  <script>
    const API_URL =
      "https://2026sy.eunseony75.workers.dev";
const EDUCATION_OFFICE_CODE = "B10";
    const SCHOOL_CODE = "7132148";

    const dateInput =
      document.getElementById("meal-date");

    const searchButton =
      document.getElementById("search-button");

    const loadingBox =
      document.getElementById("loading-box");

    const errorBox =
      document.getElementById("error-box");

    const errorMessage =
      document.getElementById("error-message");

    const mealResult =
      document.getElementById("meal-result");

    const mealMenu =
      document.getElementById("meal-menu");

    const mealCalories =
      document.getElementById("meal-calories");

    function getTodayDate() {
      const today = new Date();

      const year =
        today.getFullYear();

      const month =
        String(today.getMonth() + 1).padStart(2, "0");

      const day =
        String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function cleanMenuText(menuText) {
      return String(menuText || "")
        .replace(/<br\s*\/?\s*>/gi, "\n")
        .replace(/&amp;/gi, "&")
        .replace(/&lt;/gi, "<")
        .replace(/&gt;/gi, ">")
        .replace(/&quot;/gi, "\"")
        .replace(/&#39;/gi, "'");
    }

    function getApiMessage(data) {
      if (data?.RESULT?.MESSAGE) {
        return data.RESULT.MESSAGE;
      }

      const head =
        data?.mealServiceDietInfo?.[0]?.head;

      if (Array.isArray(head)) {
        const resultItem =
          head.find((item) => item.RESULT);

        if (resultItem?.RESULT?.MESSAGE) {
          return resultItem.RESULT.MESSAGE;
        }
      }

      return "";
    }

    function setButtonLoading(isLoading) {
      searchButton.disabled = isLoading;

      searchButton.textContent =
        isLoading ? "조회 중" : "급식 조회";
    }

    function showLoading() {
      mealResult.classList.add("hidden");
      errorBox.classList.add("hidden");

      loadingBox.classList.remove("hidden");
      loadingBox.classList.add("flex");

      setButtonLoading(true);
    }

    function showMeal(menu, calories) {
      loadingBox.classList.add("hidden");
      loadingBox.classList.remove("flex");

      errorBox.classList.add("hidden");
      errorBox.classList.remove("flex");

      mealMenu.textContent =
        menu || "메뉴 정보가 없습니다.";

      mealCalories.textContent =
        calories || "열량 정보 없음";

      mealResult.classList.remove("hidden");

      setButtonLoading(false);
    }

    function showError(message) {
      loadingBox.classList.add("hidden");
      loadingBox.classList.remove("flex");

      mealResult.classList.add("hidden");

      errorMessage.textContent = message;

      errorBox.classList.remove("hidden");
      errorBox.classList.add("flex");

      setButtonLoading(false);
    }

    async function fetchMealData(selectedDate) {
      if (!selectedDate) {
        showError("조회할 날짜를 선택해 주세요.");
        return;
      }

      showLoading();

      const mealDate =
        selectedDate.replace(/-/g, "");

      const parameters =
        new URLSearchParams({
Type: "json",
          pIndex: "1",
          pSize: "10",
          ATPT_OFCDC_SC_CODE:
            EDUCATION_OFFICE_CODE,
          SD_SCHUL_CODE:
            SCHOOL_CODE,
          MLSV_YMD:
            mealDate
        });

      const requestUrl =
        `${API_URL}?${parameters.toString()}`;

      try {
        const response =
          await fetch(requestUrl);

        if (!response.ok) {
          throw new Error(
            `HTTP 오류: ${response.status}`
          );
        }

        const data =
          await response.json();

        const mealRows =
          data?.mealServiceDietInfo?.[1]?.row;

        if (
          !Array.isArray(mealRows) ||
          mealRows.length === 0
        ) {
          const apiMessage =
            getApiMessage(data);

          if (
            apiMessage.includes(
              "해당하는 데이터가 없습니다"
            )
          ) {
            showError(
              "오늘은 급식이 없습니다"
            );
          } else {
            showError(
              apiMessage ||
              "오늘은 급식이 없습니다"
            );
          }

          return;
        }

        const lunch =
          mealRows.find(
            (meal) =>
              String(meal.MMEAL_SC_CODE) === "2"
          ) || mealRows[0];

        showMeal(
          cleanMenuText(lunch.DDISH_NM),
          lunch.CAL_INFO
        );

      } catch (error) {
        console.error(
          "급식 정보 조회 오류:",
          error
        );

        showError(
          "급식 정보를 불러오지 못했습니다. 잠시 후 다시 조회해 주세요."
        );
      }
    }

    searchButton.addEventListener(
      "click",
      function () {
        if (!dateInput.value) {
          dateInput.focus();
          return;
        }

        fetchMealData(dateInput.value);
      }
    );

    dateInput.addEventListener(
      "change",
      function () {
        if (dateInput.value) {
          fetchMealData(dateInput.value);
        }
      }
    );

    window.addEventListener(
      "DOMContentLoaded",
      function () {
        const todayDate =
          getTodayDate();

        dateInput.value =
          todayDate;

        fetchMealData(todayDate);
      }
    );
  </script>

    <script>
        const STUDENT_INFO = { id: 's_3_4_yerin', name: '문예린', grade: 3, classNum: 4 };
        const TOPICS = [
            { id: 'ai-image', name: 'AI 이미지', icon: 'fa-solid fa-image', bg: 'var(--p-image-bg)', color: 'var(--p-image-text)', border: 'var(--p-image-border)' },
            { id: 'quiz', name: '퀴즈', icon: 'fa-solid fa-circle-question', bg: 'var(--p-quiz-bg)', color: 'var(--p-quiz-text)', border: 'var(--p-quiz-border)' },

            { id: 'ai-video', name: 'AI 동영상', icon: 'fa-solid fa-video', bg: 'var(--p-video-bg)', color: 'var(--p-video-text)', border: 'var(--p-video-border)' },
            { id: 'ai-slide', name: 'AI 슬라이드', icon: 'fa-solid fa-file-powerpoint', bg: 'var(--p-slide-bg)', color: 'var(--p-slide-text)', border: 'var(--p-slide-border)' },

            { id: 'pingpong-robot', name: '피지컬AI - 핑퐁로봇', icon: 'fa-solid fa-robot', bg: 'var(--p-pingpong-bg)', color: 'var(--p-pingpong-text)', border: 'var(--p-pingpong-border)' },
            { id: 'piebrain', name: '피지컬AI - 파이브레인', icon: 'fa-solid fa-microchip', bg: 'var(--p-piebrain-bg)', color: 'var(--p-piebrain-text)', border: 'var(--p-piebrain-border)' }
        ];

        let studentProjectsMap = {};
        let carouselIndexes = {};
        let multiFilePayloads = [];
        let currentFullscreenItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentProjects();
            renderSlots();
            document.getElementById('slotForm').addEventListener('submit', handleSaveSlot);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFullscreen(); closeModal(); } });
            document.getElementById('fullscreenNewTabBtn').addEventListener('click', () => {
                if (!currentFullscreenItem) return;
                const newWin = window.open('', '_blank');
                if (currentFullscreenItem.type === 'image') {
                    newWin.document.write('<img src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;">');
                } else if (currentFullscreenItem.type === 'video') {
                    newWin.document.write('<video controls autoplay src="' + currentFullscreenItem.data + '" style="max-width:100%;height:auto;margin:auto;display:block;"></video>');
                } else {
                    newWin.document.write(currentFullscreenItem.data);
                }
                newWin.document.close();
            });
        });

        function switchUploadTab(tab) {
            if (tab === 'file') {
                document.getElementById('tabBtnFile').classList.add('active');
                document.getElementById('tabBtnCode').classList.remove('active');
                document.getElementById('tabContentFile').style.display = 'block';
                document.getElementById('tabContentCode').style.display = 'none';
            } else {
                document.getElementById('tabBtnCode').classList.add('active');
                document.getElementById('tabBtnFile').classList.remove('active');
                document.getElementById('tabContentCode').style.display = 'block';
                document.getElementById('tabContentFile').style.display = 'none';
            }
        }

        function handleMultipleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            const listContainer = document.getElementById('fileListPreview');
            listContainer.innerHTML = '';
            multiFilePayloads = [];
            files.forEach((file) => {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let fType = 'html';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov'].includes(ext)) fType = 'video';
                else if (['pdf'].includes(ext)) fType = 'pdf';
                else if (['ppt', 'pptx'].includes(ext)) fType = 'pptx';

                reader.onload = (re) => {
                    multiFilePayloads.push({ name: file.name, type: fType, data: re.target.result });
                    const tag = document.createElement('div');
                    tag.className = 'file-item-tag';
                    tag.innerHTML = `<span><i class="fa-solid fa-check-circle"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB)</span> <span style="font-size:0.75rem;">${fType.toUpperCase()}</span>`;
                    listContainer.appendChild(tag);
                };
                if (fType === 'image' || fType === 'video' || fType === 'pdf') {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        function loadStudentProjects() {
            studentProjectsMap = {};

            const el_tmpl_meal_app = document.getElementById('tmpl_meal_app');
            if (el_tmpl_meal_app) {
                studentProjectsMap['meal-app'] = {
                    title: "숭의여자중학교 오늘의 급식",
                    items: [{ name: "숭의여자중학교 오늘의 급식", type: 'html', data: el_tmpl_meal_app.innerHTML.trim() }],
                    updatedAt: '2026-07-01'
                };
            }
            const saved = localStorage.getItem('2026sy_student_slots_' + STUDENT_INFO.id);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const k in parsed) {
                        if (parsed[k] && parsed[k].items && parsed[k].items.length > 0) {
                            studentProjectsMap[k] = parsed[k];
                        }
                    }
                } catch (e) {}
            }
        }

        function saveStudentProjects() {
            localStorage.setItem('2026sy_student_slots_' + STUDENT_INFO.id, JSON.stringify(studentProjectsMap));
        }

        function renderSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            TOPICS.forEach(topic => {
                const project = studentProjectsMap[topic.id];
                const card = document.createElement('div');
                card.className = 'slot-card';

                if (project && project.items && project.items.length > 0) {
                    const curIdx = carouselIndexes[topic.id] || 0;
                    const totalItems = project.items.length;
                    const activeItem = project.items[curIdx % totalItems];

                    let mediaHtml = '';
                    if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                        mediaHtml = `<img src="${activeItem.data}" alt="${escapeHtmlAttr(activeItem.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
                    } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                        mediaHtml = `<video controls style="width:100%; max-height:100%;" src="${activeItem.data}"></video>`;
                    } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                        mediaHtml = `<iframe class="slot-iframe" src="${activeItem.data}"></iframe>`;
                    } else {
                        mediaHtml = `<iframe class="slot-iframe" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${escapeHtmlAttr(activeItem.data)}"></iframe>`;
                    }

                    let navControls = '';
                    if (totalItems > 1) {
                        navControls = `
                            <button class="carousel-nav-btn carousel-btn-prev" onclick="changeSlide('${topic.id}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="carousel-nav-btn carousel-btn-next" onclick="changeSlide('${topic.id}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                            <span class="carousel-indicator">${(curIdx % totalItems) + 1} / ${totalItems}</span>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name} ${totalItems > 1 ? `(${totalItems}개 파일)` : ''}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${project.updatedAt || '완료'}</span>
                            </div>
                            <h3 class="slot-title">${escapeHtml(project.title)}</h3>
                            <div class="slot-preview-box" style="margin-top:8px;">
                                <div class="preview-controls-overlay">
                                    <button class="preview-action-chip play-fullscreen-btn" data-topic="${topic.id}">
                                        <i class="fa-solid fa-expand"></i> 크게 체험하기
                                    </button>
                                </div>
                                ${mediaHtml}
                                ${navControls}
                            </div>
                        </div>
                        <div class="slot-card-footer">
                            <button class="btn btn-secondary btn-sm play-fullscreen-btn" data-topic="${topic.id}">
                                <i class="fa-solid fa-play"></i> 전체화면 실행
                            </button>

                                </button>
                                <button class="btn btn-outline btn-sm" style="color:var(--p-image-text);" onclick="deleteSlot('${topic.id}')">

                                </button>
                            </div>
                        </div>
                    `;

                        btn.addEventListener('click', () => openFullscreen(project, topic.id));

                    card.innerHTML = `
                        <div>
                            <div class="slot-card-header">
                                <span class="badge-pill" style="background:${topic.bg}; color:${topic.color}; border:1px solid ${topic.border};">
                                    <i class="${topic.icon}"></i> ${topic.name}

                                <span style="font-size:0.75rem; color:var(--text-muted);">미등록</span>

                            <div class="empty-slot-box" style="margin-top:8px;">
                                <i class="${topic.icon}"></i>
                                <span style="font-size:0.88rem; font-weight:600;">아직 등록된 작품이 없습니다.</span>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${topic.id}')">

        function changeSlide(topicId, step) {
            const project = studentProjectsMap[topicId];
            if (!project || !project.items || !project.items.length) return;
            const len = project.items.length;
            carouselIndexes[topicId] = ((carouselIndexes[topicId] || 0) + step + len) % len;
            renderSlots();
        }

        function openFullscreen(project, topicId) {
            const curIdx = carouselIndexes[topicId] || 0;
            const activeItem = project.items[curIdx % project.items.length];
            currentFullscreenItem = activeItem;
            document.getElementById('fullscreenTitle').textContent = project.title;
            const fsBody = document.getElementById('fullscreenBody');
            fsBody.innerHTML = '';

            if (activeItem.type === 'image' || (typeof activeItem.data === 'string' && (activeItem.data.startsWith('data:image/') || activeItem.data.match(/\.(jpeg|jpg|gif|png|webp)/i)))) {
                fsBody.innerHTML = `<img src="${activeItem.data}" style="max-width:96%; max-height:96%; object-fit:contain; margin:auto;">`;
            } else if (activeItem.type === 'video' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:video/'))) {
                fsBody.innerHTML = `<video controls autoplay style="max-width:96%; max-height:96%; margin:auto;" src="${activeItem.data}"></video>`;
            } else if (activeItem.type === 'pdf' || (typeof activeItem.data === 'string' && activeItem.data.startsWith('data:application/pdf'))) {
                fsBody.innerHTML = `<iframe class="fullscreen-iframe" src="${activeItem.data}"></iframe>`;
            } else {
                const iframe = document.createElement('iframe');
                iframe.className = 'fullscreen-iframe';
                iframe.sandbox = 'allow-scripts allow-forms allow-modals allow-same-origin';
                iframe.srcdoc = activeItem.data;
                fsBody.appendChild(iframe);
            }
            document.getElementById('fullscreenModal').classList.add('active');

        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.getElementById('fullscreenBody').innerHTML = '';

        function openEditModal(topicId) {
            const topic = TOPICS.find(t => t.id === topicId);
            if (!topic) return;
            multiFilePayloads = [];
            document.getElementById('fileUploadInput').value = '';
            document.getElementById('fileListPreview').innerHTML = '';
            switchUploadTab('file');
            document.getElementById('modalTopicId').value = topicId;
            document.getElementById('modalTopicTitle').textContent = `[${topic.name}] 결과물 파일 등록/수정`;
            const existing = studentProjectsMap[topicId];
            if (existing) {
                document.getElementById('slotTitleInput').value = existing.title || '';
            } else {
                document.getElementById('slotTitleInput').value = `${STUDENT_INFO.name} 학생의 ${topic.name} 과제`;
            }
            document.getElementById('slotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slotModal').classList.remove('active');
        }

        function handleSaveSlot(e) {
            e.preventDefault();
            const topicId = document.getElementById('modalTopicId').value;
            const title = document.getElementById('slotTitleInput').value.trim();
            let items = [];
            if (multiFilePayloads && multiFilePayloads.length > 0) {
                items = multiFilePayloads;
            } else {
                const rawCode = document.getElementById('slotCodeInput').value.trim();
                if (rawCode) {
                    let fType = 'html';
                    if (rawCode.match(/\.(jpeg|jpg|gif|png|webp)/i) || rawCode.startsWith('data:image/')) fType = 'image';
                    else if (rawCode.match(/\.(mp4|webm|mov)/i) || rawCode.startsWith('data:video/')) fType = 'video';
                    else if (rawCode.match(/\.pdf/i) || rawCode.startsWith('data:application/pdf')) fType = 'pdf';
                    items.push({ name: title, type: fType, data: rawCode });
                }
            }
            if (!title || !items.length) { alert('제목과 파일(또는 코드/링크)을 1개 이상 등록해주세요.'); return; }
            studentProjectsMap[topicId] = {
                title,
                items,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            saveStudentProjects();
            closeModal();
            renderSlots();
            showToast(`총 ${items.length}개의 파일이 성공적으로 등록되었습니다!`);
        }

        function deleteSlot(topicId) {
            if (!confirm('이 프로젝트 결과물을 삭제하시겠습니까?')) return;
            delete studentProjectsMap[topicId];
            saveStudentProjects();
            renderSlots();
            showToast('삭제되었습니다.');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('active');
            setTimeout(() => { t.classList.remove('active'); }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeHtmlAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
